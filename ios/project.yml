# The Xcode project, as a file you can read and diff.
#
# `SafeBeauty.xcodeproj` is generated from this and is NOT in git. That is the
# whole reason this repository can be developed from VS Code: nobody has to open
# Xcode to add a file, change a setting, or resolve a merge — you edit this, run
# `make project`, and the project is rebuilt. A .pbxproj is not a file two
# people can edit in the same week without pain, and it is not a file anyone can
# review.
#
# Regenerate:  make project
# Build:       make build
# Test:        make test
# Run:         make run

name: SafeBeauty
options:
  bundleIdPrefix: com.safebeauty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Xcode's own file ordering churns the project on every save; this keeps a
  # regenerated project byte-stable so `make project` is not a diff generator.
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # The app is Dari-first and Pashto-equal, and both are right-to-left. This
    # makes the simulator and Xcode previews honour that instead of silently
    # laying everything out left-to-right and looking fine.
    DEVELOPMENT_LANGUAGE: fa
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULE_VERIFIER: NO

packages:
  # Pinned to a major version rather than a branch. A backend this app cannot
  # rebuild on demand is not a thing to float against.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  SafeBeautyCore:
    path: SafeBeautyCore

targets:
  SafeBeauty:
    type: application
    platform: iOS
    sources:
      - path: SafeBeauty
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SafeBeautyCore
        product: SafeBeautyCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safebeauty.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_FILE: SafeBeauty/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"          # iPhone. The salon and admin consoles are web.
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        # Team ID 27RXPRW77S, Apple Developer Program, individual enrollment,
        # enrolled 2026-09-07 (renews 2027-09-08). Pinned rather than left to
        # whichever team Xcode's Automatic signing happens to pick — this Mac
        # had zero signing identities before that, and a second Mac or a CI
        # runner with more than one team configured would resolve differently
        # without this.
        #
        # Does NOT fix the simulator keychain failure from 2026-09-06/07
        # (SB-AUTH FIRAuthErrorDomain 17995, securityd -34018) — checked this
        # directly rather than assume it, on 2026-09-08: even with this team
        # pinned, `xcodebuild ... -destination 'id=<simulator>'` still signs
        # the app ad-hoc (`codesign --sign -`) with an EMPTY entitlements
        # dict, confirmed by reading the actual .xcent Xcode generates.
        # Forcing CODE_SIGN_IDENTITY[sdk=iphonesimulator*] and disabling
        # AD_HOC_CODE_SIGNING_ALLOWED were both tried and neither changed
        # this — the latter makes the build fail outright ("Ad Hoc code
        # signing is not allowed with SDK 'Simulator...'"), meaning Xcode's
        # simulator SDK requires ad-hoc signing and there is no supported way
        # around it. This is a platform limitation of the iOS Simulator, not
        # a project misconfiguration — see CLAUDE.md's Gotchas for what this
        # means for testing sign-in.
        #
        # What this team DOES fix: a real DEVICE build (and any TestFlight /
        # App Store build) gets application-identifier and
        # keychain-access-groups merged in from the real provisioning profile
        # regardless of the simulator limitation above, so sign-in should be
        # tested on a physical iPhone or via TestFlight, not the simulator.
        DEVELOPMENT_TEAM: 27RXPRW77S
        CODE_SIGN_ENTITLEMENTS: SafeBeauty/SafeBeauty.entitlements
    info:
      path: SafeBeauty/Resources/Info.plist
      properties:
        CFBundleDisplayName: SafeBeauty
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Dari and Pashto are both right-to-left; English is the third.
        CFBundleLocalizations: [fa, ps, en]
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: >-
          SafeBeauty needs the camera so you can photograph your identity
          document for verification, and take photos for a review.
        NSPhotoLibraryUsageDescription: >-
          SafeBeauty needs your photo library so you can choose an existing
          photo for verification or for a review.
        NSLocationWhenInUseUsageDescription: >-
          SafeBeauty uses your location only to sort salons by distance. It is
          never stored and never shared.
        # Required before iOS will show a Face ID prompt at all — without it
        # the request fails rather than asking. Touch ID needs no equivalent.
        NSFaceIDUsageDescription: >-
          SafeBeauty uses Face ID so you can sign in without typing your
          password. Your password stays on this phone and is never sent
          anywhere.

  SafeBeautyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SafeBeautyTests]
    dependencies:
      - target: SafeBeauty
      - package: SafeBeautyCore
        product: SafeBeautyCore

schemes:
  SafeBeauty:
    build:
      targets:
        SafeBeauty: all
        SafeBeautyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SafeBeautyTests]
    profile:
      config: Release
    archive:
      config: Release
