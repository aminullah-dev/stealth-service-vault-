name: Build APK

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

# pr.yml has had this since it was written; this file never did, so every push
# to a claude/** branch started its own ten-minute APK build and none of the
# superseded ones were cancelled. Pushing three commits in a row billed thirty
# minutes to produce one APK anybody wanted. It is the same group expression
# pr.yml uses, with a different prefix so the two workflows do not cancel each
# other.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # app/build/outputs/apk/debug/ stopped existing on 2026-08-25, when the
      # prod/demo flavour dimension was added: assembleDebug now writes to
      # apk/prod/debug/ and apk/demo/debug/ instead. The path here was never
      # updated, so from that day this job built both APKs for ten minutes and
      # then failed on the upload, having produced nothing — 12 days of a green
      # build step followed by a red one nobody read. The glob covers both
      # flavours, which is the point of assembleDebug building both.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stealth-app-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
