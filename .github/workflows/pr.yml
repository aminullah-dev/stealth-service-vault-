name: Pull request

# The gate that P2 exists to create: nothing merges without the tests that
# already existed having actually run. Before this, 118 backend tests ran only
# when someone remembered, and 41 Android tests had been failing to compile for
# long enough that nobody knew they were there.
#
# Every job here runs without Firebase credentials — the emulator needs none —
# so a fork or a fresh clone gets the same verdict.
#
# firebase-tools is a pinned devDependency rather than something the machine is
# assumed to have. The first run of this workflow failed on exactly that: `npx
# firebase` resolved locally because it was installed globally on one laptop,
# and "could not determine executable to run" everywhere else.

# Every push to a branch with an open PR fired this workflow TWICE — once as
# `push` on claude/**, once as `pull_request` on the same commit — so all seven
# jobs ran twice, macos-latest included, and GitHub bills macOS minutes at ten
# times Linux. Verified on 40a76d6 and c1d5d29: three runs per commit, two of
# them this workflow under two different events.
#
# The two cannot be merged with a shared concurrency group: cancelling one
# leaves a cancelled check on the PR, and a cancelled required check blocks the
# merge this workflow exists to gate. So the push trigger drops claude/**
# instead. `pull_request` already covers exactly what the header below claims —
# nothing merges without these having run — and main is still covered on push.
#
# What this gives up, deliberately: a claude/** branch with NO open PR gets no
# run of this workflow until one is opened. build-apk.yml still runs on every
# such push, so the branch is not silent.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions

  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      # Correctness, not style. The rule set is no-undef / no-redeclare /
      # no-unused-vars plus the always-a-mistake checks — see functions/
      # eslint.config.js for why those three specifically. Its first run found
      # `actor is not defined` in rescheduleAppointment: a ReferenceError that
      # had been live since the event trail was added, on a path no customer had
      # happened to take yet. No test covered it, and no test would have.
      - run: npm run lint
        working-directory: functions

  concurrency-guarantee:
    name: Money and slots cannot go wrong
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # The Firestore emulator is a Java process, and firebase-tools 15 refuses
      # anything before JDK 21. The Android job below still needs 17 for Gradle,
      # so the two cannot share a version.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: functions
      # Runs the reservation suite against a real Firestore. This is the P1
      # guarantee: two simultaneous bookings for one slot, repeatedly, must
      # produce exactly one winner. It is a separate job because it is the one
      # check whose failure means the platform can double-book a customer.
      - run: npx firebase emulators:exec --only firestore --project safebeauty-ci "npm run test:emulator:inner"
        working-directory: functions
      # The settlement path: whether a provider is credited, whether a booking
      # reaches the salon, and whether a webhook replayed twice pays twice. It
      # runs the production function, not a reimplementation, so what passes
      # here is what the webhook and the manual settle path both run.
      - run: npx firebase emulators:exec --only firestore --project safebeauty-ci "npm run test:settlement:inner"
      # Whether .create() really lets exactly one of ten simultaneous callers
      # through is a property of Firestore, not of our code — and it is what
      # stops a retried booking from being charged twice.
      - run: npx firebase emulators:exec --only firestore --project safebeauty-ci "npm run test:idempotency:inner"
        working-directory: functions

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      # A debug build needs a Maps key placeholder; local.properties is
      # gitignored, so CI supplies an obviously-fake one. Nothing here calls Maps.
      - run: echo "MAPS_API_KEY=ci-placeholder-not-a-real-key" >> local.properties
      # testDebugUnitTest stopped existing the moment the prod/demo flavour
      # dimension was added — only the per-flavour tasks remain. The unit tests
      # are flavour-agnostic, so prod alone runs them all; build-apk.yml's
      # assembleDebug still compiles both flavours and would catch a demo break.
      - run: ./gradlew testProdDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: app/build/reports/tests/testProdDebugUnitTest/

  ios:
    name: iOS logic tests
    # macOS, because Swift Testing and Foundation's regex here are not the
    # Linux toolchain's. It is the most expensive runner on this workflow and
    # it earns it: SafeBeautyCore holds the slot maths, PinHasher and the area
    # list, each of which is a second copy of something the server owns, and
    # each has a test that fails when the two drift. Those guards ran only when
    # somebody remembered to run them on a Mac — which is this repository's
    # stated recurring defect, a check that looks healthy and has never run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/SafeBeautyCore
      # The area list is GENERATED from Areas.kt. AreasParityTests already fails
      # on drift, but this says so in the one sentence that fixes it, rather
      # than leaving a contributor to work out why a diff of 121 rows is failing.
      - name: Areas.swift is regenerated from Areas.kt
        run: |
          python3 scripts/gen-areas.py
          git diff --exit-code ios/SafeBeautyCore/Sources/SafeBeautyCore/Areas.swift \
            || { echo "::error::Areas.kt changed without regenerating. Run: python3 scripts/gen-areas.py"; exit 1; }

      # The app target itself, which nothing here compiled.
      #
      # `swift test` builds SafeBeautyCore and stops. Every screen, service and
      # view model in ios/SafeBeauty — the large majority of the iOS code — was
      # never compiled by CI at all, so a Swift error in any of them merged
      # green and was found only by whoever next opened a Mac. That is the same
      # class of hole as an unrun test, and on the platform this project is
      # about to publish.
      #
      # The .xcodeproj is not in git (see project.yml), so it is generated
      # first. Simulator destination rather than a device: no signing identity
      # exists on a runner and none is needed to prove the code compiles.
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate --spec project.yml
        working-directory: ios
      - name: iOS app builds
        run: |
          set -o pipefail
          xcodebuild -project SafeBeauty.xcodeproj -scheme SafeBeauty \
            -destination 'generic/platform=iOS Simulator' \
            -quiet CODE_SIGNING_ALLOWED=NO build
        working-directory: ios

  rules:
    name: Security rules compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # JDK 21: firebase-tools 15 refuses anything older.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Install BEFORE the emulator runs. This job used to call it first and
      # then install, which worked on a machine that already had firebase-tools
      # and nowhere else.
      - run: npm ci
        working-directory: functions
      # Starting the emulator compiles firestore.rules and storage.rules. A rule
      # that does not compile is not deployed — the previous deploy stays live —
      # so this catches a change that would otherwise look successful.
      - run: npx firebase emulators:exec --only firestore --project safebeauty-ci "echo rules compiled"
        working-directory: functions
      # Behavioural tests for the rules, not just a syntax check. The privacy
      # claim that demand signals carry no identity is enforced by hasOnly(); a
      # claim about behaviour has to be tested or it is a comment that was true
      # on the day it was written.
      - run: npm run test:rules
        working-directory: functions

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Invariant I-13. Keystores and service-account keys are gitignored today;
      # a single careless commit reverses that permanently, and git history
      # cannot be un-published.
      - name: Scan tracked files
        run: |
          set -euo pipefail
          fail=0

          # Signing material and server credentials. These are the things that
          # cannot be un-published once committed — invariant I-13.
          if git ls-files | grep -iE '\.(jks|keystore|p12|pfx|p8)$|keystore\.properties$|service-account.*\.json$'; then
            echo "::error::A signing key or service-account credential is tracked by git."
            fail=1
          fi

          if git ls-files -z | xargs -0 grep -lE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' 2>/dev/null; then
            echo "::error::A private key block is committed."
            fail=1
          fi

          # Deliberately NOT flagged: google-services.json and the Firebase web
          # config in public/. A Firebase client API key is an identifier, not a
          # secret — it ships inside every APK and every page, and anyone can
          # extract it. What protects the data is firestore.rules, not the key
          # being hidden. Treating it as a secret would train everyone to ignore
          # this job.
          #
          # The real server secrets — the HesabPay key and webhook secret — are
          # held in Secret Manager via defineSecret and never appear in the tree.
          # This checks that stays true.
          if git ls-files -z | xargs -0 grep -lE 'HESAB_API_KEY\s*=\s*["'"'"'][A-Za-z0-9]' 2>/dev/null; then
            echo "::error::A HesabPay credential appears to be hardcoded."
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then echo "Clean."; fi
          exit "$fail"
