<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SafeBeauty · Salon Console</title>
<style>
  /* ============================================================
     SafeBeauty Salon Console — shares the admin design system
     (light + dark) plus multi-language (English / Dari / Pashto)
     with RTL support. Same class names / tokens as the admin
     console; only the tabs, data & language layer differ.
     ============================================================ */
  :root{
    --rose:#B76E79; --deep:#8B3A47; --plum:#7A2F3D; --blush:#F9CBDA;
    --gold:#D4A853; --green:#3fa14a; --red:#C0392B;
    /* status TEXT inks — tuned to pass WCAG 4.5:1 on their tinted pill/flash
       backgrounds in each theme (the raw accent colors above fail as text) */
    --ok-ink:#256b2e; --warn-ink:#77571a; --bad-ink:#a93226;
    --grad:linear-gradient(120deg,#EBA9C0,#B76E79 55%,#7A2F3D);
    --bg1:#FFF7FB; --bg2:#FDEAF3; --bg3:#F3E6F5;
    --panel:rgba(255,255,255,.66); --panel-solid:#ffffff;
    --card:#ffffff; --surface:#FDEFF6; --petal:#FCE4EF; --lilac:#E9D5F0; --cream:#FFF7FB;
    --ink:#3f3237; --muted:#9c8890; --line:#EFD5E1; --hover:#FFF9FC;
    --shadow:0 4px 20px rgba(139,58,71,.06);
    --shadow-md:0 8px 26px rgba(139,58,71,.10);
    --shadow-lg:0 22px 60px rgba(139,58,71,.16);
    --ring:rgba(183,110,121,.14);
  }
  :root[data-theme="dark"]{
    --deep:#F6D9E1; --plum:#F0C6D2; --blush:#4d2f39;
    --ok-ink:#7dd087; --warn-ink:#e6c47a; --bad-ink:#f0958a;
    --bg1:#17100f; --bg2:#1e1216; --bg3:#191016;
    --panel:rgba(40,27,33,.62); --panel-solid:#241820;
    --card:#241820; --surface:#2c1e26; --petal:#38262f; --lilac:#3a2a3f; --cream:#221820;
    --ink:#F1E6EB; --muted:#B79AA5; --line:#3a2831; --hover:#2a1c24;
    --shadow:0 4px 20px rgba(0,0,0,.36);
    --shadow-md:0 10px 30px rgba(0,0,0,.44);
    --shadow-lg:0 24px 64px rgba(0,0,0,.55);
    --ring:rgba(235,169,192,.20);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{background:
      radial-gradient(1100px 600px at 100% -10%,rgba(235,169,192,.18),transparent 60%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    background-attachment:fixed;transition:background .3s ease,color .3s ease}
  button{font-family:inherit;cursor:pointer;border:none}
  input,textarea,select{font-family:inherit}
  .hidden{display:none !important}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--rose);background-clip:content-box}

  /* ── Login ─────────────────────────────────────────────────────── */
  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg)}
  #login .card{width:100%;max-width:392px;padding:40px 34px 34px;text-align:center;position:relative;overflow:hidden}
  #login .card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad)}
  .logo{width:74px;height:74px;border-radius:24px;margin:2px auto 16px;
        background:var(--grad);box-shadow:0 12px 30px rgba(183,110,121,.42);
        display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
  h1{margin:0;font-size:25px;background:var(--grad);
     -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:12px;margin:5px 0 24px;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
  .field{width:100%;padding:12px 15px;border:1.5px solid var(--line);border-radius:13px;font-size:13.5px;
    margin-bottom:11px;background:var(--panel-solid);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  .field::placeholder{color:var(--muted);opacity:.8}
  .field:focus{border-color:var(--rose);box-shadow:0 0 0 4px var(--ring)}
  .btn{width:100%;padding:13px;border-radius:13px;font-size:14px;font-weight:700;color:#fff;letter-spacing:.01em;
       background:var(--grad);box-shadow:0 8px 20px rgba(183,110,121,.32);transition:transform .12s,box-shadow .15s,opacity .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(183,110,121,.4)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
  .btn-ghost{background:var(--petal);color:var(--deep);font-weight:700;box-shadow:none}
  .btn-ghost:hover{transform:none;box-shadow:none;opacity:.9}
  .btn-sm{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;transition:transform .12s,opacity .15s;box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .btn-sm:hover{opacity:.92;transform:translateY(-1px)}
  .btn-sm:active{transform:none}
  .btn-sm:disabled{opacity:.55;cursor:default}
  .err{color:var(--bad-ink);font-size:12.5px;min-height:18px;margin-top:8px;font-weight:600}
  .langpick{display:flex;gap:6px;justify-content:center;margin:-6px 0 20px}
  .langpick button{padding:6px 15px;border-radius:20px;font-size:12px;font-weight:700;
    background:var(--petal);color:var(--deep);transition:opacity .15s,transform .1s}
  .langpick button:hover{opacity:.85}
  .langpick button:active{transform:scale(.96)}
  .langpick button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(183,110,121,.32)}

  /* ── Shell ─────────────────────────────────────────────────────── */
  #app{height:100vh;display:flex;overflow:hidden}
  .sidebar{width:224px;flex-shrink:0;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 13px}
  .sidebar .brand{font-size:19px;font-weight:800;padding:2px 10px 2px;letter-spacing:-.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .who2{font-size:11px;color:var(--muted);padding:2px 10px 16px;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;margin:0 -3px;padding:0 3px}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;width:100%;
    color:var(--muted);font-weight:600;font-size:13px;background:transparent;text-align:left;
    transition:background .14s,color .14s,transform .1s}
  .navitem:hover{background:var(--petal);color:var(--deep)}
  .navitem:active{transform:scale(.98)}
  .navitem.active{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(183,110,121,.34);font-weight:700}
  .navitem .ico{font-size:15px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;background:var(--surface);flex-shrink:0;transition:background .14s}
  .navitem.active .ico{background:rgba(255,255,255,.22)}
  .navitem .tag{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;
    min-width:18px;height:18px;padding:0 5px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .navitem.active .tag{background:rgba(255,255,255,.28)}
  .sidebar .foot{padding-top:12px;margin-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .theme-toggle{width:100%;padding:9px;border-radius:11px;background:var(--petal);color:var(--deep);
    font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
  .theme-toggle:hover{opacity:.88}
  .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{padding:17px 30px;border-bottom:1px solid var(--line);background:var(--panel);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:18px;font-weight:800;color:var(--deep);letter-spacing:-.02em;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .topbar .salon-name{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:0}
  main{flex:1;overflow-y:auto;padding:24px 30px 56px;max-width:1120px;width:100%;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ── Stat cards ────────────────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
  .stat{padding:18px 18px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);
    box-shadow:var(--shadow);transition:transform .14s,box-shadow .14s;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,var(--ring),transparent 70%);pointer-events:none}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
  .stat .ico{font-size:18px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    border-radius:12px;background:var(--surface);margin-bottom:12px}
  .stat .n{font-size:30px;font-weight:800;color:var(--deep);line-height:1;letter-spacing:-.02em}
  .stat .l{color:var(--muted);font-size:12px;margin-top:5px;font-weight:600}

  /* ── Availability card + switch ────────────────────────────────── */
  .avail-card{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:19px 22px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
  .avail-card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--grad)}
  .avail-title{font-size:15px;font-weight:800;color:var(--deep)}
  .avail-sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600}
  .switch{width:58px;height:32px;border-radius:20px;background:var(--line);position:relative;transition:background .2s;flex-shrink:0}
  .switch.on{background:var(--green)}
  .switch .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
    transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .switch.on .knob{transform:translateX(26px)}

  /* ── Rows ──────────────────────────────────────────────────────── */
  .row{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 16px;margin-bottom:9px;box-shadow:var(--shadow)}
  .row h3{margin:0 0 2px;font-size:14px;color:var(--deep);font-weight:700}
  .row .meta{color:var(--muted);font-size:12px;line-height:1.5}
  .row .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  @media(min-width:680px){
    .row:not(.wide){padding-right:168px}
    .row:not(.wide) .actions{position:absolute;top:13px;right:15px;margin-top:0;flex-direction:column;align-items:stretch;width:142px}
    .row:not(.wide) .actions .btn-sm{width:100%}
  }
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;vertical-align:middle}
  .badge.cash{background:rgba(212,168,83,.22);color:var(--gold)}
  .badge.warn2{background:rgba(192,57,43,.14);color:#e06c5e}
  .empty{text-align:center;color:var(--muted);padding:56px 10px;font-size:13.5px;font-weight:600;line-height:1.7}
  .section-title{font-size:11px;color:var(--rose);font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin:4px 0 13px}
  .card-pad{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}

  /* ── Tables ────────────────────────────────────────────────────── */
  .tbl-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
  .tbl{width:100%;border-collapse:collapse;background:transparent;min-width:560px}
  .tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:800;padding:12px 17px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap;
    position:sticky;top:0;z-index:1}
  .tbl td{padding:12px 17px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr{transition:background .1s}
  .tbl tbody tr:hover{background:var(--hover)}
  .tbl .name{font-weight:700;color:var(--deep)}
  .pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .pill.ok{background:rgba(63,161,74,.16);color:var(--ok-ink)}
  .pill.warn{background:rgba(212,168,83,.22);color:var(--warn-ink)}
  .pill.bad{background:rgba(192,57,43,.15);color:var(--bad-ink)}
  .pill.info{background:var(--surface);color:var(--rose)}

  /* ── Filter chips ──────────────────────────────────────────────── */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;background:var(--card);
    border:1.5px solid var(--line);color:var(--muted);transition:all .14s}
  .chip:hover{border-color:var(--rose);color:var(--deep)}
  .chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(183,110,121,.3)}

  /* ── Reviews / stars ───────────────────────────────────────────── */
  .stars{color:var(--gold);font-size:14px;letter-spacing:1px}
  .reply-box{margin-top:10px;display:flex;gap:8px;align-items:flex-start}
  .reply-box textarea{flex:1;min-height:44px}
  .reply-shown{margin-top:9px;background:var(--surface);border-radius:12px;padding:9px 13px;font-size:12.5px;color:var(--ink)}
  .reply-shown b{color:var(--deep)}

  /* ── Forms ─────────────────────────────────────────────────────── */
  textarea.field{min-height:90px;resize:vertical;line-height:1.55}
  .flash{background:rgba(63,161,74,.14);color:var(--ok-ink);border-radius:12px;padding:11px 15px;font-size:12.5px;
    margin-bottom:12px;font-weight:700;border:1px solid rgba(63,161,74,.2)}
  .flash.bad{background:rgba(192,57,43,.14);color:var(--bad-ink);border-color:rgba(192,57,43,.2)}
  .fl{display:block;font-size:11px;font-weight:800;color:var(--rose);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
  .mini{padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel-solid);color:var(--ink);
    font-size:13px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
  .mini:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--ring)}
  .svc-row{display:grid;grid-template-columns:1fr 96px 96px 96px 96px 40px;gap:8px;align-items:center;margin-bottom:9px}
  .svc-row .svc-name{font-weight:700;color:var(--deep);font-size:13px}
  .svc-row .u{font-size:10.5px;color:var(--muted);font-weight:700}
  .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--surface);color:var(--red);font-size:15px;
    display:flex;align-items:center;justify-content:center;transition:opacity .14s}
  .icon-btn:hover{opacity:.75}
  .day-row{display:grid;grid-template-columns:130px 62px 1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}
  .day-row .dl{font-weight:700;color:var(--deep);font-size:13px}
  .day-row.closed .dl{color:var(--muted)}
  .inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .inline > div{flex:1;min-width:150px}
  .savebar{position:sticky;bottom:0;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:14px 0;margin-top:8px;display:flex;gap:12px;align-items:center}
  .savebar .btn{width:auto;padding:12px 30px}
  @media(max-width:560px){
    .svc-row{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
    .svc-row .svc-name{grid-column:1 / -1}
    .day-row{grid-template-columns:1fr 1fr;row-gap:6px}
    .day-row .dl{grid-column:1 / -1}
  }

  /* ── Gallery + staff photos ────────────────────────────────────── */
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .g-cell{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;background:var(--surface)}
  .g-cell img{width:100%;height:100%;object-fit:cover;display:block}
  .g-cover{position:absolute;top:6px;inset-inline-start:6px;background:var(--grad);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:12px}
  .g-actions{position:absolute;top:6px;inset-inline-end:6px;display:flex;gap:5px}
  .g-actions button{width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;transition:opacity .14s}
  .g-actions button:hover{opacity:.8}
  .g-actions .g-del{background:rgba(192,57,43,.92)}
  .staff-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .staff-photos .sp{position:relative;width:58px;height:58px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .staff-photos .sp img{width:100%;height:100%;object-fit:cover;display:block}
  .staff-photos .sp-del{position:absolute;top:2px;inset-inline-end:2px;width:19px;height:19px;border-radius:50%;background:rgba(192,57,43,.92);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  .staff-photos .sp-add{width:58px;height:58px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface);color:var(--rose);font-size:22px;font-weight:700}
  .staff-photos .sp-add:hover{border-color:var(--rose)}

  /* Latin/numeric inputs stay LTR even in an RTL layout. */
  input[type="tel"],input[type="password"],input[type="number"],input[type="time"]{direction:ltr}

  /* ── RTL (Dari / Pashto) ───────────────────────────────────────── */
  [dir="rtl"] .navitem{text-align:right}
  [dir="rtl"] .navitem .tag{margin-left:0;margin-right:auto}
  [dir="rtl"] .sidebar{border-right:none;border-left:1px solid var(--line)}
  [dir="rtl"] .tbl th,[dir="rtl"] .tbl td{text-align:right}
  [dir="rtl"] .avail-card::before{inset:0 0 0 auto}
  [dir="rtl"] .stat::after{right:auto;left:-30px}
  [dir="rtl"] .switch .knob{left:auto;right:3px}
  [dir="rtl"] .switch.on .knob{transform:translateX(-26px)}
  @media(min-width:680px){
    [dir="rtl"] .row:not(.wide){padding-right:16px;padding-left:168px}
    [dir="rtl"] .row:not(.wide) .actions{right:auto;left:15px}
  }

  /* ── Accessibility ─────────────────────────────────────────────── */
  .navitem:focus-visible,.btn:focus-visible,.btn-sm:focus-visible,
  .theme-toggle:focus-visible,.pw-toggle:focus-visible,.icon-btn:focus-visible{
    outline:2px solid var(--rose);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* ── Password show/hide (login) ────────────────────────────────── */
  /* Physical right side on purpose: password inputs are forced direction:ltr
     (see the input[type=…] rule above), so the eye pins to the input's own
     trailing edge in ALL languages — logical inline-end would resolve against
     the RTL page and land on the opposite side from the reserved padding. */
  .pw-wrap{position:relative;margin-bottom:11px}
  .pw-wrap .field{margin-bottom:0;padding-right:44px}
  .pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:transparent;color:var(--muted);font-size:15px;padding:5px 7px;border-radius:9px;line-height:1}
  .pw-toggle:hover{background:var(--petal)}

  /* ── Responsive: collapse the sidebar to a top rail on narrow windows ── */
  @media(max-width:720px){
    #app{flex-direction:column}
    /* Brand + footer buttons share the top line; the nav drops to its own
       full-width line below and scrolls horizontally, so all 10 tabs stay
       reachable instead of being crushed into a sliver beside Sign out.
       margin-inline-end keeps it correct in both RTL (Dari/Pashto) and LTR. */
    .sidebar{width:100%;flex-flow:row wrap;align-items:center;gap:8px;padding:10px 12px;
      border-right:none;border-bottom:1px solid var(--line)}
    [dir="rtl"] .sidebar{border-left:none;border-bottom:1px solid var(--line)}
    .sidebar .brand{white-space:nowrap;margin-inline-end:auto}
    .who2{display:none}
    .nav{order:3;flex:1 0 100%;flex-direction:row;gap:4px;overflow-x:auto;
      -webkit-overflow-scrolling:touch;padding-bottom:2px}
    .navitem{width:auto;white-space:nowrap;padding:8px 11px;flex:0 0 auto}
    .sidebar .foot{border-top:none;padding-top:0;margin-top:0;flex-direction:row;gap:8px}
    .theme-toggle{width:auto;padding:9px 11px}
    main{padding:18px 16px 44px}
    .topbar{padding:14px 18px;font-size:16px}
  }
</style>
<script>
  /* Apply the saved / system theme + language direction before first paint
     (no flash). Shared with the admin console via the same localStorage keys. */
  (function(){
    try{
      var saved = localStorage.getItem('sb-theme') ||
              (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', saved);
    }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
    try{
      var l = localStorage.getItem('sb-lang') || 'fa';
      if(['fa','ps','en'].indexOf(l) < 0) l = 'fa';
      document.documentElement.lang = l;
      document.documentElement.dir = (l === 'en') ? 'ltr' : 'rtl';
    }catch(e){ document.documentElement.dir = 'rtl'; }
  })();
</script>

}

// ── Phone normalization (mirrors PhoneUtils.normalizeForLogin) ──────────────
function clean(raw){ const v=raw.trim(); const plus=v.startsWith('+'); const d=v.replace(/\D/g,''); return plus?'+'+d:d; }
function normalizeAfghan(raw){
  let c=clean(raw);
  if(c.startsWith('+93')) return c;
  if(c.startsWith('0093')) return '+93'+c.slice(4);
  if(c.startsWith('93')&&c.length>=11) return '+'+c;
  c=c.replace(/^\+/,''); if(c.startsWith('0')) c=c.slice(1);
  return '+93'+c;
}
function normalizeForLogin(raw){ const c=clean(raw); return c.startsWith('+')?c:normalizeAfghan(raw); }

// ── PBKDF2 auth-password derivation (mirrors PinHasher.deriveAuthPassword) ───
function b64ToBytes(b64){ const s=atob(b64); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }
function bytesToB64(b){ let s=''; for(const x of b) s+=String.fromCharCode(x); return btoa(s); }
async function deriveAuthPassword(pin, saltB64){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode('AUTH:'+pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:b64ToBytes(saltB64), iterations:65536, hash:'SHA-256' }, key, 256);
  return bytesToB64(new Uint8Array(bits));
}

// ── Login ────────────────────────────────────────────────────────────────────
$('lbtn').addEventListener('click', doLogin);
$('lw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const phone = normalizeForLogin($('lp').value);
  const pw = $('lw').value;
  $('lerr').textContent = '';
  if(!phone || !pw){ $('lerr').textContent = t('errEnter'); return; }
  $('lbtn').disabled = true; $('lbtn').textContent = t('signingIn');
  try{
    const res = await httpsCallable(fns,'authenticateWithPassword')({ phone, password: pw });
    const m = res.data || {};
    if(m.mode !== 'REAL'){ throw new Error(t('errInvalid')); }
    if((m.role||'') !== 'PROVIDER'){ throw new Error(t('errNotProvider')); }
    // Only APPROVED salons may operate the console — the salon doc exists at
    // registration so sign-in would otherwise succeed, then every write fails
    // with a raw "Missing or insufficient permissions" (rules require isApproved).
    const st = (m.status||'');
    if(st === 'SUSPENDED'){ throw new Error(t('errSuspended')); }
    if(st === 'REJECTED'){ throw new Error(t('errRejected')); }
    if(st !== 'APPROVED'){ throw new Error(t('errPending')); }
    const authPw = await deriveAuthPassword(pw, m.salt || '');
    await signInWithEmailAndPassword(auth, m.firebaseEmail, authPw);
    await httpsCallable(fns,'syncUidMap')({ appUid: m.uid });
    if (window.electronBiometric && $('lremc') && $('lremc').checked) {
      try { await window.electronBiometric.save(phone, pw); } catch(_){}
    }
    provider = { uid: m.uid, name: m.name || 'Salon', status: m.status || '' };
    await enterApp();
  }catch(e){
    $('lerr').textContent = (e && e.message) ? e.message : t('errFailed');
  }finally{
    $('lbtn').disabled = false; $('lbtn').textContent = t('signIn');
  }
}

$('logout').addEventListener('click', async () => {
  if(salonUnsub){ try{salonUnsub();}catch(_){} }
  await signOut(auth); location.reload();
});

(async function setupBiometric(){
  const bio = window.electronBiometric;
  if(!bio) return;                                   // plain browser → skip
  let avail = false; try{ avail = await bio.available(); }catch(_){}
  if(!avail) return;
  $('lrem').classList.remove('hidden');
  let has = false; try{ has = await bio.has(); }catch(_){}
  if(has){
    const b = $('lbio');
    b.classList.remove('hidden');
    b.onclick = async () => {
      const cred = await bio.get();                  // triggers the Touch ID prompt
      if(cred && cred.phone && cred.password){
        $('lp').value = cred.phone; $('lw').value = cred.password;
        doLogin();
      }
    };
  }
})();

async function enterApp(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = t('signedInAs', provider.name);

  try{
    const snap = await getDocs(query(collection(db,'salons'), where('providerId','==',provider.uid)));
    const d = snap.docs[0];
    if(d){ salonId = d.id; salon = d.data(); }
  }catch(_){}

  try{
    const us = await getDoc(doc(db,'users',provider.uid));
    if(us.exists()) hesab = us.data().hesabAccountNumber || '';
  }catch(_){}

  $('salonName').textContent = salon ? (salon.salonName || '') : '';

  if(salonId){
    salonUnsub = onSnapshot(doc(db,'salons',salonId), (s)=>{
      if(s.exists()){ salon = s.data(); $('salonName').textContent = salon.salonName || ''; paintAvailability(); }
    });
  }

  paintStatic();
  buildNav();
  selectTab(activeTab);
}

function buildNav(){
  const nav = $('nav');
  nav.innerHTML = '';
  TABS.forEach(tab => {
    const b = document.createElement('button');
    b.className = 'navitem' + (tab.id===activeTab?' active':'');
    if(tab.id===activeTab) b.setAttribute('aria-current','page');
    b.dataset.id = tab.id;
    b.innerHTML = `<span class="ico">${tab.icon}</span><span>${esc(t(tab.id))}</span>` +
      (tab.id==='requests' ? `<span class="tag hidden" id="reqTag"></span>` : '');
    b.onclick = () => selectTab(tab.id);
    nav.appendChild(b);
  });
  paintReqTag();
}

function selectTab(id){
  activeTab = id;
  unsub.forEach(fn => { try{fn();}catch(_){} }); unsub = [];
  const tab = TABS.find(x=>x.id===id);
  [...$('nav').children].forEach(b => {
    const on = b.dataset.id===id;
    b.classList.toggle('active', on);
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  $('topbar').textContent = t(tab.id);
  $('view').innerHTML = `<div class="empty">${t('loading')}</div>`;
  if(!salonId && id!=='today'){
    $('view').innerHTML = `<div class="empty">${t('noSalon')}</div>`;
    return;
  }
  tab.render();
}

function paintReqTag(){
  const tag = $('reqTag'); if(!tag) return;
  if(pendingCount>0){ tag.textContent = pendingCount>99?'99+':String(pendingCount); tag.classList.remove('hidden'); }
  else tag.classList.add('hidden');
}

function sameDay(ms, ref){
  const a=new Date(Number(ms)), b=ref;
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

async function renderToday(){
  if(!salonId){ $('view').innerHTML = `<div class="empty">${t('noSalon')}</div>`; return; }
  try{
    const [apptSnap, balSnap] = await Promise.all([
      getDocs(query(collection(db,'appointments'), where('salonId','==',salonId))),
      getDoc(doc(db,'provider_balances',provider.uid)).catch(()=>null),
    ]);
    const appts = apptSnap.docs.map(d=>({id:d.id,...d.data()}));
    const now = new Date();
    const pending   = appts.filter(a=>a.status==='PENDING').length;
    const confirmed = appts.filter(a=>a.status==='CONFIRMED'||a.status==='COMPLETED').length;
    const todays    = appts.filter(a=>(a.status==='CONFIRMED'||a.status==='PENDING') && sameDay(a.appointmentDate, now)).length;
    const owed      = balSnap && balSnap.exists() ? (balSnap.data().owedAmount||0) : 0;
    pendingCount = pending; paintReqTag();

    const prices = (salon && salon.pricePerService) || {};
    const est = appts
      .filter(a=>a.status==='CONFIRMED'||a.status==='COMPLETED')
      .reduce((sum,a)=> sum + (Number(prices[a.serviceName])||0), 0);

    const cards = [
      ['🔔', pending,   t('pendingRequests')],
      ['📅', todays,    t('todaysBookings')],
      ['✅', confirmed, t('confirmedTotal')],
      ['⭐', (Number(salon&&salon.rating)||0).toFixed(1), t('averageRating')],
      ['💰', AFN(Math.abs(owed)), owed>=0 ? t('owedToYou') : t('youOwe')],
      ['📈', AFN(est), t('estRevenue')],
    ];

    $('view').innerHTML =
      `<div class="avail-card">
         <div><div class="avail-title">${t('salonStatus')}</div><div class="avail-sub" id="availLabel">…</div></div>
         <button class="switch" id="availSwitch" role="switch" aria-label="${esc(t('salonStatus'))}"><span class="knob"></span></button>
       </div>
       <div class="section-title">${t('atAGlance')}</div>
       <div class="grid">` +
      cards.map(([ic,n,l]) => `<div class="stat"><div class="ico">${ic}</div><div class="n">${esc(String(n))}</div><div class="l">${esc(l)}</div></div>`).join('') +

async function actOnBooking(row, id, callable, workingKey){
  const acc = row.querySelector('.act-accept'), dec = row.querySelector('.act-decline');
  [acc,dec].forEach(b=>{ if(b) b.disabled=true; });
  if(workingKey==='accepting' && acc) acc.textContent = t('accepting');
  if(workingKey==='declining' && dec) dec.textContent = t('declining');
  try{
    await httpsCallable(fns, callable)({ appointmentId: id });
    // The onSnapshot listener drops the row automatically when the status flips.
  }catch(e){
    [acc,dec].forEach(b=>{ if(b) b.disabled=false; });
    if(acc) acc.textContent=t('accept'); if(dec) dec.textContent=t('decline');
    alert(t('actionErr', e.message||''));
  }
}

// ── Shared image helpers ────────────────────────────────────────────────────────
function pickImage(onFile){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if(f) onFile(f); };
  inp.click();
}
function validImage(f){ return /^image\/(jpeg|png|webp)$/.test(f.type) && f.size < 2*1024*1024; }

// A story is only worth reading while it is still true, so say how long that is
// rather than only that it is "live" — a salon deciding whether to post another
// one needs the number, not the pill.
function storyLeft(expiresAt){
  const ms = (expiresAt||0) - Date.now();
  if(ms <= 0) return '';
  const hours = Math.floor(ms / 3600000);
  return hours < 1 ? t('expiringSoon') : t('hoursLeft', String(hours));
}

// The comment thread under one of this salon's own photos.
//
// Loaded on demand rather than with a listener per post: a salon with thirty
// photos would otherwise open thirty live queries to render a tab where most
// threads are never looked at.
//
// Deleting is the salon moderating its own photo, which the rules allow
// (ownsThisSalon). The author is not notified — this removes a comment, it does
// not argue with anyone.
async function paintComments(host, postId){
  host.innerHTML = `<div class="meta" style="color:var(--muted)">${t('loadingComments')}</div>`;
  try{
    const snap = await getDocs(query(
      collection(db,'post_comments'),
      where('postId','==',postId),
      orderBy('createdAt','asc')
    ));
    const rows = snap.docs.map(d=>({id:d.id,...d.data()}));
    host.innerHTML = rows.length
      ? rows.map(c => `<div class="row" style="margin-bottom:7px" data-cmt="${esc(c.id)}">
           <div style="font-size:13px;font-weight:700;color:var(--deep)">${esc(c.authorName||'—')}</div>
           <div style="font-size:13px;color:var(--ink);margin-top:2px">${esc(c.text||'')}</div>
           <div class="meta" style="margin-top:3px">${esc(fmtD(c.createdAt))}</div>
           <div class="actions" style="margin-top:7px"><button class="btn-sm cmt-del" style="background:var(--red)">${t('del')}</button></div>
         </div>`).join('')
      : `<div class="meta" style="color:var(--muted)">${t('noComments')}</div>`;
    host.querySelectorAll('[data-cmt]').forEach(row => {
      row.querySelector('.cmt-del').onclick = async () => {
        if(!confirm(t('deleteCommentConfirm'))) return;
        try{
          await deleteDoc(doc(db,'post_comments', row.dataset.cmt));
          await paintComments(host, postId);
        }catch(e){ alert(e.message||String(e)); }
      };
    });
  }catch(e){
    host.innerHTML = `<div class="meta" style="color:var(--muted)">${esc(e.message||String(e))}</div>`;
  }
}

      } else host.innerHTML = '';
    };
    // ── Story: a 24-hour availability announcement ──────────────────────────
    // No image required. The point is speed: a salon with an empty chair should
    // be able to say so in one line, from a phone, between customers.
    (async () => {
      const host = $('story-live'); if(!host) return;
      try{
        const snap = await getDocs(query(collection(db,'salon_stories'), where('salonId','==',salonId)));
        const live = snap.docs.map(d=>({id:d.id,...d.data()})).filter(x => (x.expiresAt||0) > Date.now());
        host.innerHTML = live.length
          ? live.map(x => `<div class="row" style="margin-bottom:9px" data-story="${esc(x.id)}">
               <span class="pill ok">${t('storyLive')}</span>

        host.querySelectorAll('[data-story]').forEach(row => {

            catch(err){ alert(err.message||String(err)); }
          };
        });
      }catch(_){ host.innerHTML = ''; }
    })();

    $('story-post').onclick = async (e) => {
      const text = ($('story-text').value||'').trim().slice(0,200);
      if(!text){ alert(t('storyNeedText')); return; }
      const btn = e.target, lbl = btn.textContent; btn.disabled = true;
      try{
        const now = Date.now();
        const ref = doc(collection(db,'salon_stories'));
        await setDoc(ref, {
          id: ref.id, salonId, salonName: (salon&&salon.salonName)||'',
          text, imageUrl: '', storagePath: '',
          createdAt: now,
          // Written by the author rather than inferred on read, so the lifetime
          // does not shift with each reader's clock.
          expiresAt: now + 24*60*60*1000,
        });
        $('story-text').value = '';
        renderFeed();
      }catch(err){ alert(err.message||String(err)); }
      finally{ btn.disabled = false; btn.textContent = lbl; }
    };

    $('post-pick').onclick = () => pickImage(f => {
      if(!validImage(f)){ alert(t('imageTooBig')); return; }

    });
    $('post-share').onclick = async (e) => {
      if(!feedDraftFile){ alert(t('pickImageFirst')); return; }
      const btn = e.target, lbl = btn.textContent; btn.disabled = true; btn.textContent = t('uploading');
      try{
        const pRef = doc(collection(db,'salon_posts'));
        const path = `salon_posts/${salonId}/${pRef.id}.jpg`;
        await uploadBytes(sref(storage, path), feedDraftFile, { contentType: feedDraftFile.type });
        const url = await getDownloadURL(sref(storage, path));
        await setDoc(pRef, {
          id: pRef.id, salonId, providerId: provider.uid,
          salonName: (salon&&salon.salonName)||'',
          imageUrl: url, storagePath: path,
          caption: ($('post-caption').value||'').trim().slice(0,300),
          createdAt: Date.now()
        });
        feedDraftFile = null;
      }catch(err){ alert(t('uploadErr', err.message||'')); }
      finally{ btn.disabled = false; btn.textContent = lbl; }
    };
    paintPreview();

    // Scoped to post rows. Stories and comments carry the same .row class and are
    // painted asynchronously into this same view, so a bare '.row' selector only
    // ever worked because it happened to run before they arrived.
    $('view').querySelectorAll('.row[data-id]').forEach(row => {
      const host = row.querySelector('.cmt-host');
      const cmt  = row.querySelector('.post-cmt');
      if(cmt) cmt.onclick = async () => {
        const open = host.dataset.open === '1';
        if(open){
          host.innerHTML = ''; host.dataset.open = '';
          cmt.textContent = `${t('showComments')} (${row.dataset.cc||0})`;
        }else{
          host.dataset.open = '1';
          cmt.textContent = t('hideComments');
          await paintComments(host, row.dataset.id);
        }
      };
      row.querySelector('.post-del').onclick = async () => {
        if(!confirm(t('deletePostConfirm'))) return;
        try{
          // The cleanupDeletedPost trigger clears this post's likes and comments;
          // only the image has to be removed from here.
          await deleteDoc(doc(db,'salon_posts', row.dataset.id));
          if(row.dataset.path){ try{ await deleteObject(sref(storage, row.dataset.path)); }catch(_){} }
        }catch(e){ alert(e.message); }
      };
    });
  }, (e)=>{ $('view').innerHTML = `<div class="empty">${t('loadErr', esc(e.message))}</div>`; });
  unsub.push(unsubFn);
}

// ── Gallery (portfolio photos) ──────────────────────────────────────────────────
async function addGalleryPhoto(file, btn){
  if(!validImage(file)){ alert(t('imageTooBig')); return; }
  const lbl = btn.textContent; btn.disabled = true; btn.textContent = t('uploading');
  try{
    const gRef = doc(collection(db,'salon_gallery'));
    const path = `salon_gallery/${salonId}/${gRef.id}.jpg`;
    await uploadBytes(sref(storage, path), file, { contentType: file.type });
    const url = await getDownloadURL(sref(storage, path));
    await setDoc(gRef, { id:gRef.id, salonId, imageUrl:url, imageBase64:'', storagePath:path, createdAt: Date.now() });
  }catch(e){ alert(t('uploadErr', e.message||'')); }
  finally{ btn.disabled = false; btn.textContent = lbl; }
}
function renderGallery(){
  if(!salonId){ $('view').innerHTML = `<div class="empty">${t('noSalon')}</div>`; return; }
  const unsubFn = onSnapshot(query(collection(db,'salon_gallery'), where('salonId','==',salonId)), (snap)=>{
    const imgs = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const cover = (salon && salon.coverImageUrl) || '';
    $('view').innerHTML =
      `<div class="card-pad" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
         <div><span class="fl">${t('galleryTitle')}</span><div class="meta" style="color:var(--muted)">${t('galleryHint')}</div></div>
         <button id="g-add" class="btn" style="width:auto;padding:11px 22px">${t('addPhoto')}</button>
       </div>` +
      (imgs.length ? `<div class="gallery-grid">` + imgs.map(im => {
        const isCover = im.imageUrl && im.imageUrl === cover;
        return `<div class="g-cell" data-id="${esc(im.id)}" data-url="${esc(im.imageUrl||'')}" data-path="${esc(im.storagePath||'')}">
          <img src="${esc(im.imageUrl||'')}" alt="" />
          ${isCover ? `<span class="g-cover">${t('coverLabel')}</span>` : ''}
          <div class="g-actions">
            ${isCover ? '' : `<button class="g-cover-btn" title="${esc(t('setCover'))}">★</button>`}
            <button class="g-del" title="${esc(t('del'))}">✕</button>
          </div>
        </div>`;
      }).join('') + `</div>` : `<div class="empty">${t('noPhotos')}</div>`);
    $('g-add').onclick = (e) => pickImage(f => addGalleryPhoto(f, e.target));
    $('view').querySelectorAll('.g-cell').forEach(cell => {
      const cb = cell.querySelector('.g-cover-btn');
      if(cb) cb.onclick = async () => {
        try{ await updateDoc(doc(db,'salons',salonId), { coverImageUrl: cell.dataset.url }); }
        catch(e){ alert(e.message); }
      };
      cell.querySelector('.g-del').onclick = async () => {
        if(!confirm(t('deletePhotoConfirm'))) return;
        try{
          await deleteDoc(doc(db,'salon_gallery', cell.dataset.id));
          if(cell.dataset.path){ try{ await deleteObject(sref(storage, cell.dataset.path)); }catch(_){} }
          if(cell.dataset.url && salon && salon.coverImageUrl === cell.dataset.url){
            await updateDoc(doc(db,'salons',salonId), { coverImageUrl: '' });
          }
        }catch(e){ alert(e.message); }
      };
    });
  }, (e)=>{ $('view').innerHTML = `<div class="empty">${t('loadErr', esc(e.message))}</div>`; });
  unsub.push(unsubFn);
}

// ── Staff roster (embedded on the salon doc) ────────────────────────────────────
async function saveStaff(next){
  try{ await updateDoc(doc(db,'salons',salonId), { staff: next }); salon.staff = next; renderStaff(); }
  catch(e){ alert(t('saveErr', e.message||'')); }
}
async function addStaffPhoto(member, file){
  if(!validImage(file)){ alert(t('imageTooBig')); return; }
  if((member.photoUrls||[]).length >= 4) return;
  try{
    const idx  = Date.now() & 0x7fffffff;
    const path = `staff_portfolio/${salonId}/${member.id}_${idx}.jpg`;
    await uploadBytes(sref(storage, path), file, { contentType: file.type });
    const url = await getDownloadURL(sref(storage, path));
    const next = (salon.staff||[]).map(x => x.id===member.id ? { ...x, photoUrls:[...(x.photoUrls||[]), url] } : x);
    await saveStaff(next);
  }catch(e){ alert(t('uploadErr', e.message||'')); }
}
function renderStaff(){
  if(!salon){ $('view').innerHTML = `<div class="empty">${t('salonNotLoaded')}</div>`; return; }
  const staff = salon.staff || [];
  $('view').innerHTML =
    `<div class="card-pad">
       <span class="fl">${t('addStaffTitle')}</span>
       <input id="st-name" class="mini" placeholder="${esc(t('staffNamePh'))}" style="margin-bottom:9px" />
       <div class="inline">
         <div><input id="st-spec" class="mini" placeholder="${esc(t('staffSpecialtyPh'))}" /></div>
         <button id="st-add" class="btn-sm" style="background:var(--rose)">${t('addStaff')}</button>
       </div>
     </div>
     <div class="section-title">${t('teamTitle')} (${staff.length})</div>` +
    (staff.length ? staff.map(m => `
      <div class="row wide" data-id="${esc(m.id)}">
        <h3>${esc(m.name||'')} ${m.active ? `<span class="pill ok">${t('staffActive')}</span>` : `<span class="pill bad">${t('staffInactive')}</span>`}</h3>
        ${m.specialty ? `<div class="meta">${esc(m.specialty)}</div>` : ''}
        <div class="staff-photos">
          ${(m.photoUrls||[]).map(u => `<span class="sp" data-url="${esc(u)}"><img src="${esc(u)}" alt="" /><button class="sp-del" title="${esc(t('del'))}">✕</button></span>`).join('')}
          ${(m.photoUrls||[]).length < 4 ? `<button class="sp-add" title="${esc(t('addPhoto'))}">＋</button>` : ''}
        </div>
        <div class="actions" style="margin-top:10px">
          <button class="btn-sm st-toggle" style="background:${m.active?'var(--gold)':'var(--green)'}">${m.active?t('turnOff'):t('turnOn')}</button>
          <button class="btn-sm st-remove" style="background:var(--red)">${t('del')}</button>
        </div>
      </div>`).join('') : `<div class="empty">${t('noStaff')}</div>`);

  $('st-add').onclick = () => {
    const name = ($('st-name').value||'').trim();
    if(!name) { $('st-name').focus(); return; }
    saveStaff([...(salon.staff||[]), { id: crypto.randomUUID(), name, specialty:($('st-spec').value||'').trim(), photoUrls:[], active:true }]);
  };
  $('st-name').addEventListener('keydown', e => { if(e.key==='Enter') $('st-add').click(); });
  $('view').querySelectorAll('.row').forEach(row => {
    const id = row.dataset.id;
    const m  = (salon.staff||[]).find(x => x.id === id);
    if(!m) return;
    row.querySelector('.st-toggle').onclick = () => saveStaff((salon.staff||[]).map(x => x.id===id ? { ...x, active: !x.active } : x));
    row.querySelector('.st-remove').onclick = () => { if(confirm(t('del')+'؟')) saveStaff((salon.staff||[]).filter(x => x.id !== id)); };
    const spAdd = row.querySelector('.sp-add');
    if(spAdd) spAdd.onclick = () => pickImage(f => addStaffPhoto(m, f));
    row.querySelectorAll('.sp-del').forEach(btn => btn.onclick = () => {
      const url = btn.parentElement.dataset.url;
      saveStaff((salon.staff||[]).map(x => x.id===id ? { ...x, photoUrls:(x.photoUrls||[]).filter(u => u !== url) } : x));
    });
  });
}

// ── Profile (services, prices, hours, deals, payout account) ────────────────────
const DAYS = [[7,'Saturday'],[1,'Sunday'],[2,'Monday'],[3,'Tuesday'],[4,'Wednesday'],[5,'Thursday'],[6,'Friday']];
let pf = null;   // working draft for the profile form

function hhmm(h,m){ return String(h??0).padStart(2,'0')+':'+String(m??0).padStart(2,'0'); }

function renderProfile(){
  if(!salon){ $('view').innerHTML = `<div class="empty">${t('salonNotLoaded')}</div>`; return; }
  const hoursByDay = {};
  (salon.workingHours||[]).forEach(w => hoursByDay[w.dayOfWeek] = w);
  pf = {
    district: salon.district || '',
    services: [...(salon.services||[])],
    prices: {...(salon.pricePerService||{})},
    durations: {...(salon.durationPerService||{})},
    timing: {...(salon.serviceTiming||{})},
    slot: salon.slotDurationMinutes || 60,
    hours: DAYS.map(([d]) => {
      const w = hoursByDay[d] || {};
      return { dayOfWeek:d, isOpen: w.isOpen===true, openHour: w.openHour??9, openMinute: w.openMinute??0, closeHour: w.closeHour??18, closeMinute: w.closeMinute??0 };
    }),
    lastEnabled: salon.lastMinuteEnabled===true,
    lastPct: salon.lastMinutePercent||0,
    lastWin: salon.lastMinuteWindowHours||0,
    hesab
  };

  $('view').innerHTML = `
    <div id="pf-flash"></div>
    <div class="card-pad">
      <span class="fl">${t('salonBasics')}</span>
      <div class="inline">
        <div><span class="fl">${t('district')}</span><input id="pf-district" class="mini" value="${esc(pf.district)}" placeholder="${esc(t('districtPh'))}" /></div>
        <div><span class="fl">${t('slotLen')}</span>
          <select id="pf-slot" class="mini">${[15,20,30,45,60,90,120].map(v=>`<option value="${v}" ${v===pf.slot?'selected':''}>${v}</option>`).join('')}</select>
        </div>
        <div><span class="fl">${t('hesabAccount')}</span><input id="pf-hesab" class="mini" value="${esc(pf.hesab)}" placeholder="${esc(t('hesabPh'))}" /></div>
      </div>
    </div>

    <div class="card-pad">
      <span class="fl">${t('servicesPricing')}</span>
      <div class="hint" style="margin:2px 0 8px">${t('waitHint')}</div>
      <div class="svc-row" style="color:var(--muted)"><div class="u">${t('colService')}</div><div class="u">${t('colPrice')}</div><div class="u">${t('colDuration')}</div><div class="u">${t('colWait')}</div><div class="u">${t('colAfter')}</div><div></div></div>
      <div id="pf-services"></div>
      <div class="inline" style="margin-top:6px">
        <div><input id="pf-newsvc" class="mini" placeholder="${esc(t('addServicePh'))}" /></div>
        <button id="pf-addsvc" class="btn-sm" style="background:var(--rose)">${t('addService')}</button>
      </div>
    </div>

    <div class="card-pad">
      <span class="fl">${t('workingHours')}</span>
      <div id="pf-hours"></div>
    </div>

    <div class="card-pad">
      <span class="fl">${t('lastMinuteDeal')}</span>
      <label style="display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:11px;cursor:pointer">
        <input type="checkbox" id="pf-lm" ${pf.lastEnabled?'checked':''} /> ${t('lastMinuteLabel')}
      </label>
      <div class="inline">
        <div><span class="fl">${t('discountPct')}</span><input id="pf-lmpct" class="mini" type="number" min="0" max="100" value="${pf.lastPct}" /></div>
        <div><span class="fl">${t('within')}</span><input id="pf-lmwin" class="mini" type="number" min="0" max="168" value="${pf.lastWin}" /></div>
      </div>
    </div>

    <div class="savebar">
      <button id="pf-save" class="btn">${t('saveChanges')}</button>
      <span class="meta" style="color:var(--muted)">${t('appliesInstantly')}</span>
    </div>`;

  paintServices();
  paintHours();

  $('pf-district').oninput = e => pf.district = e.target.value;
  $('pf-slot').onchange = e => pf.slot = parseInt(e.target.value,10)||60;
  $('pf-hesab').oninput = e => pf.hesab = e.target.value;
  $('pf-lm').onchange = e => pf.lastEnabled = e.target.checked;
  $('pf-lmpct').oninput = e => pf.lastPct = Math.max(0,Math.min(100, parseInt(e.target.value||'0',10)||0));
  $('pf-lmwin').oninput = e => pf.lastWin = Math.max(0,Math.min(168, parseInt(e.target.value||'0',10)||0));
  $('pf-addsvc').onclick = () => {
    const v = ($('pf-newsvc').value||'').trim();
    if(v && !pf.services.includes(v)){ pf.services.push(v); $('pf-newsvc').value=''; paintServices(); }
  };
  $('pf-newsvc').addEventListener('keydown', e => { if(e.key==='Enter') $('pf-addsvc').click(); });
  $('pf-save').onclick = saveProfile;
}

function paintServices(){
  const host = $('pf-services');
  if(!pf.services.length){ host.innerHTML = `<div class="meta" style="color:var(--muted);padding:6px 0">${t('noServices')}</div>`; return; }
  host.innerHTML = pf.services.map((s) => `
    <div class="svc-row" data-svc="${esc(s)}">
      <div class="svc-name">${esc(s)}</div>
      <input class="mini pf-price" type="number" min="0" placeholder="0" value="${pf.prices[s]!=null?pf.prices[s]:''}" />
      <input class="mini pf-dur" type="number" min="0" placeholder="${pf.slot}" value="${pf.durations[s]!=null?pf.durations[s]:''}" />
      <input class="mini pf-wait" type="number" min="0" placeholder="0" value="${(pf.timing[s]||{}).processing||''}" />
      <input class="mini pf-after" type="number" min="0" placeholder="0" value="${(pf.timing[s]||{}).activeAfter||''}" />
      <button class="icon-btn pf-rm" title="${esc(t('del'))}">✕</button>
    </div>`).join('');
  host.querySelectorAll('.svc-row').forEach(row => {
    const s = row.dataset.svc;
    row.querySelector('.pf-price').oninput = e => { const v=parseInt(e.target.value||'0',10); pf.prices[s]=isNaN(v)?0:v; };
    row.querySelector('.pf-dur').oninput   = e => { const v=parseInt(e.target.value||'0',10); if(v>0) pf.durations[s]=v; else delete pf.durations[s]; };
    // The three numbers the salon types are total, wait and after. What gets
    // stored is the breakdown the slot maths wants — the working time before the
    // wait is whatever is left, never negative, so a typo that makes the parts
    // exceed the total costs the salon a little capacity instead of freeing a
    // stylist who is actually busy.
    const retime = () => {
      const total = parseInt(pf.durations[s] || pf.slot, 10) || pf.slot;
      const wait  = parseInt(row.querySelector('.pf-wait').value  || '0', 10) || 0;
      const after = parseInt(row.querySelector('.pf-after').value || '0', 10) || 0;
      if (wait <= 0) { delete pf.timing[s]; return; }
      pf.timing[s] = {
        activeBefore: Math.max(0, total - wait - after),
        processing:   wait,
        activeAfter:  after,
      };
    };
    row.querySelector('.pf-wait').oninput  = retime;
    row.querySelector('.pf-after').oninput = retime;
    row.querySelector('.pf-rm').onclick    = () => { pf.services = pf.services.filter(x=>x!==s); delete pf.prices[s]; delete pf.durations[s]; delete pf.timing[s]; paintServices(); };
  });
}

function paintHours(){
  const host = $('pf-hours');
  host.innerHTML = pf.hours.map((w,i) => `
    <div class="day-row ${w.isOpen?'':'closed'}" data-i="${i}">
      <label class="dl" style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" class="h-open" ${w.isOpen?'checked':''} /> ${t(DAYS[i][1])}
      </label>
      <span class="u" style="color:var(--muted)">${w.isOpen?t('openLbl'):t('closedLbl')}</span>
      <input type="time" class="mini h-o" value="${hhmm(w.openHour,w.openMinute)}" ${w.isOpen?'':'disabled'} />
      <input type="time" class="mini h-c" value="${hhmm(w.closeHour,w.closeMinute)}" ${w.isOpen?'':'disabled'} />
    </div>`).join('');
  host.querySelectorAll('.day-row').forEach(row => {
    const i = parseInt(row.dataset.i,10);
    row.querySelector('.h-open').onchange = e => { pf.hours[i].isOpen = e.target.checked; paintHours(); };
    row.querySelector('.h-o').onchange = e => { const [h,m]=(e.target.value||'09:00').split(':').map(Number); pf.hours[i].openHour=h||0; pf.hours[i].openMinute=m||0; };
    row.querySelector('.h-c').onchange = e => { const [h,m]=(e.target.value||'18:00').split(':').map(Number); pf.hours[i].closeHour=h||0; pf.hours[i].closeMinute=m||0; };
  });
}

async function saveProfile(){
  const btn = $('pf-save'); btn.disabled=true; btn.textContent=t('saving');
  const flash = $('pf-flash');
  try{
    // Re-read the live doc so we preserve every server-owned field
    // (confirmedCount, rating, isVerified, staff, packages, cover, location…)
    // and only overwrite what this form edits — the rules freeze the rest.
    const cur = (await getDoc(doc(db,'salons',salonId))).data() || salon || {};
    const merged = {
      ...cur,
      district: pf.district.trim(),
      services: pf.services,
      pricePerService: pf.prices,
      durationPerService: pf.durations,
      serviceTiming:      pf.timing,
      slotDurationMinutes: pf.slot,
      workingHours: pf.hours.map(w=>({ dayOfWeek:w.dayOfWeek, isOpen:w.isOpen, openHour:w.openHour, openMinute:w.openMinute, closeHour:w.closeHour, closeMinute:w.closeMinute })),
      lastMinuteEnabled: pf.lastEnabled,
      lastMinutePercent: Math.max(0,Math.min(100, pf.lastPct)),
      lastMinuteWindowHours: Math.max(0,Math.min(168, pf.lastWin)),
    };
    await setDoc(doc(db,'salons',salonId), merged);
    if((pf.hesab||'') !== (hesab||'')){
      await updateDoc(doc(db,'users',provider.uid), { hesabAccountNumber: pf.hesab.trim() });
      hesab = pf.hesab.trim();
    }
    flash.innerHTML = `<div class="flash">${t('savedLive')}</div>`;
    flash.scrollIntoView({behavior:'smooth', block:'nearest'});
  }catch(e){
    flash.innerHTML = `<div class="flash bad">${t('saveErr', esc(e.message||''))}</div>`;
  }finally{
    btn.disabled=false; btn.textContent=t('saveChanges');
    setTimeout(()=>{ if(flash) flash.innerHTML=''; }, 4200);
  }
}

// Paint all static chrome in the resolved language on first load.
applyLangDir();
paintStatic();
</script>
