      <input id="ssearch" class="field" placeholder="Search salon, district or phone…" style="max-width:340px;margin-bottom:16px" />
      <div id="slist"></div>`;

    $('ns-create').onclick = async (e) => {
      const services = $('ns-services').value.split(',').map(x=>x.trim()).filter(Boolean);
      const payload = {
        ownerName: $('ns-owner').value.trim(),
        phone:     $('ns-phone').value.trim(),
        password:  $('ns-pass').value,
        salonName: $('ns-salon').value.trim(),
        district:  $('ns-district').value,
        services,
      };
      if(!payload.ownerName || !payload.phone || !payload.salonName || !payload.district || !services.length){
        $('nsflash').className='mflash bad';
        $('nsflash').textContent='Fill in owner name, phone, salon name, district and at least one service.';
        return;
      }
      if(payload.password.length < 6){
        $('nsflash').className='mflash bad';
        $('nsflash').textContent='Password must be at least 6 characters.';
        return;
      }
      if(await callFn('adminCreateSalon', payload, e.target, 'nsflash', 'Salon created ✓')){
        ['ns-owner','ns-phone','ns-pass','ns-salon','ns-services'].forEach(id => $(id).value='');
        $('ns-district').value='';
        setTimeout(renderSalons, 800);
      }
    };
    const verify = async (id, v) => {
      try{ await updateDoc(doc(db,'salons',id), { isVerified:v });
        const s = salons.find(x=>x.id===id); if(s) s.isVerified = v; draw($('ssearch').value); }
      catch(e){ alert(e.message); }
    };
    const draw = (term='') => {
      // Named q, not t — see renderUsers.draw.
      const q = term.trim().toLowerCase();
      const rows = salons.filter(s => {
        const o = owners[s.providerId] || {};
        return !q || (s.salonName||'').toLowerCase().includes(q) || (s.district||'').toLowerCase().includes(q) || (o.phone||'').includes(q);
      });
      $('slist').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_salon')}</th><th scope="col">${t('th_district')}</th><th scope="col">${t('th_ownerPhone')}</th><th scope="col">${t('th_rating')}</th><th scope="col">${t('th_kyc')}</th><th scope="col">${t('th_verified')}</th><th scope="col"></th></tr></thead>
        <tbody>` + rows.map(s => { const o = owners[s.providerId] || {}; return `<tr>
          <td class="name">${esc(s.salonName||s.id)}</td>
          <td>${esc(s.district||'—')}</td>
          <td>${esc(o.phone||'—')}</td>
          <td>★ ${Number(s.rating||0).toFixed(1)}</td>
          <td>${kycPill(o.kycStatus)}</td>
          <td>${s.isVerified?`<span class="pill ok">${t('th_verified')}</span>`:'<span class="pill info">No</span>'}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn-sm" style="background:var(--rose)" data-manage="${s.id}">${t('btn_manage')}</button>
            ${s.isVerified
              ? `<button class="btn-sm" style="background:var(--muted);margin-inline-start:6px" data-unv="${s.id}">${t('btn_unverify')}</button>`
              : `<button class="btn-sm" style="background:var(--green);margin-inline-start:6px" data-ver="${s.id}">${t('btn_verify')}</button>`}
          </td>
        </tr>`; }).join('') + `</tbody></table></div>`
        : `<div class="empty">${t('empty_noMatchingSalons')}</div>`;
      $('slist').querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>verify(b.dataset.ver,true));
      $('slist').querySelectorAll('[data-unv]').forEach(b=>b.onclick=()=>verify(b.dataset.unv,false));
      $('slist').querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{
        const s = salons.find(x=>x.id===b.dataset.manage); if(s) openSalonModal(s, ()=>renderSalons());
      });
    };
    draw();
    $('ssearch').oninput = e => draw(e.target.value);
  }catch(e){ $('view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ── Content (what customers actually see) ────────────────────────────────────
//
// Everything published into Discover, in one place, with a way to take any of it
// down. Until this tab existed the platform could publish but not moderate: an
// abusive comment or a photo posted in bad faith could only be removed from the
// Firestore console, which is not a tool anyone should need at 9pm.
//
// Comments come first deliberately. Photos are posted by salons the admin has
// vetted; comments are written by anyone with an account, so that is where
// something is most likely to need removing, and burying it under two other
// sections would cost time when it matters.
async function renderContent(){
  $('view').innerHTML = `<div class="empty">${t('empty_loading')}</div>`;
  try{
    const [cSnap, pSnap, sSnap] = await Promise.all([
      getDocs(query(collection(db,'post_comments'), orderBy('createdAt','desc'), limit(100))),
      getDocs(query(collection(db,'salon_posts'),   orderBy('createdAt','desc'), limit(60))),
      getDocs(collection(db,'salon_stories')),
    ]);
    const comments = cSnap.docs.map(d=>({id:d.id,...d.data()}));
    const posts    = pSnap.docs.map(d=>({id:d.id,...d.data()}));
    const stories  = sSnap.docs.map(d=>({id:d.id,...d.data()}))
                          .filter(x => (x.expiresAt||0) > Date.now())
                          .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    const seeded = (x) => x.createdByAdmin ? ` <span class="pill info">${t('pill_byAdmin')}</span>` : '';
    const hoursLeft = (ms) => {
      const h = Math.floor(((ms||0) - Date.now())/3600000);
      return h < 1 ? '<1h' : h + 'h';
    };

    $('view').innerHTML = `
      <div class="section-title">${t('hint_commentsCount', comments.length)}</div>
      <div class="meta" style="color:var(--muted);margin:-6px 0 14px;font-size:12px">
        ${t('hint_commentsScope')}
      </div>
      ${comments.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_author')}</th><th scope="col">${t('th_comment')}</th><th scope="col">${t('th_salon')}</th><th scope="col">${t('th_when')}</th><th scope="col"></th></tr></thead>
        <tbody>` + comments.map(c => `<tr>
          <td class="name">${esc(c.authorName||'—')}</td>
          <td>${esc(c.text||'')}</td>
          <td>${esc(c.salonId||'—')}</td>
          <td>${fmtDate(c.createdAt)}</td>
          <td style="text-align:right"><button class="btn-sm" style="background:var(--red)" data-delc="${esc(c.id)}">${t('btn_removeItem')}</button></td>
        </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">${t('empty_noCommentsYet')}</div>`}

      <div class="section-title" style="margin-top:26px">${t('hint_liveStoriesCount', stories.length)}</div>
      ${stories.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_salon')}</th><th scope="col">${t('th_announcement')}</th><th scope="col">${t('th_left')}</th><th scope="col"></th></tr></thead>
        <tbody>` + stories.map(x => `<tr>
          <td class="name">${esc(x.salonName||x.salonId||'—')}${seeded(x)}</td>
          <td>${esc(x.text||'')}</td>
          <td>${hoursLeft(x.expiresAt)}</td>
          <td style="text-align:right"><button class="btn-sm" style="background:var(--red)" data-dels="${esc(x.id)}">${t('btn_removeItem')}</button></td>
        </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">${t('empty_noStoryRunning')}</div>`}

      <div class="section-title" style="margin-top:26px">${t('hint_postsCount', posts.length)}</div>
      ${posts.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_photo')}</th><th scope="col">${t('th_salon')}</th><th scope="col">${t('th_caption')}</th><th scope="col">❤</th><th scope="col">💬</th><th scope="col">${t('th_when')}</th><th scope="col"></th></tr></thead>
        <tbody>` + posts.map(p => `<tr>
          <td><img src="${esc(p.imageUrl||'')}" alt="" style="width:54px;height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line)"/></td>
          <td class="name">${esc(p.salonName||p.salonId||'—')}${seeded(p)}</td>
          <td>${esc(p.caption||'—')}</td>
          <td>${Number(p.likeCount||0)}</td>
          <td>${Number(p.commentCount||0)}</td>
          <td>${fmtDate(p.createdAt)}</td>
          <td style="text-align:right"><button class="btn-sm" style="background:var(--red)"
                data-delp="${esc(p.id)}" data-path="${esc(p.storagePath||'')}">${t('btn_removeItem')}</button></td>
        </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">${t('empty_noPostsYet')}</div>`}
    `;

    const after = (fn) => async (btn) => {
      btn.disabled = true; const lbl = btn.textContent; btn.textContent = 'Removing…';
      try{ await fn(); await renderContent(); }
      catch(e){ alert(e.message||String(e)); btn.disabled = false; btn.textContent = lbl; }
    };

    $('view').querySelectorAll('[data-delc]').forEach(b => b.onclick = () => {
      if(confirm('Remove this comment?')) after(() => deleteDoc(doc(db,'post_comments', b.dataset.delc)))(b);
    });
    $('view').querySelectorAll('[data-dels]').forEach(b => b.onclick = () => {
      if(confirm('Remove this story?')) after(() => deleteDoc(doc(db,'salon_stories', b.dataset.dels)))(b);
    });
    $('view').querySelectorAll('[data-delp]').forEach(b => b.onclick = () => {
      if(!confirm('Remove this photo? Its likes and comments go with it.')) return;
      after(async () => {
        // cleanupDeletedPost collects the likes and comments; the image is the
        // only part that does not belong to Firestore.
        await deleteDoc(doc(db,'salon_posts', b.dataset.delp));
        if(b.dataset.path){ try{ await deleteObject(sref(storage, b.dataset.path)); }catch(_){} }
      })(b);
    });
  }catch(e){
    $('view').innerHTML = `<div class="empty">${esc(e.message||String(e))}</div>`;
  }
}

// ── Booking lookup (one reference, the whole story) ──────────────────────────
//
// The first thing a support call needs: a customer reads her SB- code, and this
// shows what was booked, what was paid, and every state the booking has been
// through with who moved it and why. Before this existed the only answer to
// "why was my appointment cancelled" was a guess.
const STATUS_PILL = {
  AWAITING_PAYMENT: 'warn', PENDING: 'info', CONFIRMED: 'ok',
  COMPLETED: 'ok', CANCELLED: 'bad',
};

function renderBooking(){
  $('view').innerHTML = `
    <div class="section-title">${t('hint_findABooking')}</div>
    <div class="meta" style="color:var(--muted);margin:-6px 0 14px;font-size:12px">
      ${t('hint_bookingLookupHelp')}
    </div>
    <div class="mrow" style="max-width:520px">
      <input id="bk-code" class="field" placeholder="SB-4C7GHJ" autocomplete="off" />
      <button class="btn-sm" id="bk-go" style="background:var(--rose)">${t('btn_lookUp')}</button>
    </div>
    <div id="bk-flash" class="mflash"></div>
    <div id="bk-out"></div>`;

  const run = async () => {
    const code = $('bk-code').value.trim();
    if(!code){ return; }
    const btn = $('bk-go'), lbl = btn.textContent;
    btn.disabled = true; btn.textContent = 'Looking…';
    $('bk-flash').className = 'mflash'; $('bk-flash').textContent = '';
    $('bk-out').innerHTML = '';
    try{
      const { data } = await httpsCallable(fns,'adminLookupBooking')({ code });
      paintBooking(data);
    }catch(e){
      $('bk-flash').className = 'mflash bad';
      $('bk-flash').textContent = fnError(e);
    }finally{ btn.disabled = false; btn.textContent = lbl; }
  };
  $('bk-go').onclick = run;
  $('bk-code').onkeydown = (e) => { if(e.key === 'Enter') run(); };
  $('bk-code').focus();

  // Delegated, because the buttons are rendered by paintBooking every time a
  // booking is looked up — binding them directly would leave the handlers of the
  // previous booking attached to nothing.
  $('bk-out').onclick = async (e) => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const id = btn.dataset.id;
    if(!id) return;

    let ok = false;
    if(btn.dataset.act === 'confirm'){
      // confirmAppointment has always accepted an admin — it checks the salon's
      // owner OR the ADMIN role. There was simply no way to reach it from here.
      ok = await callFn('confirmAppointment', { appointmentId: id }, btn, 'bk-actflash',
                        'Confirmed on the salon\u2019s behalf \u2713');

    } else if(btn.dataset.act === 'move'){
      const v = $('bk-newdate').value;
      if(!v){
        $('bk-actflash').className = 'mflash bad';
        $('bk-actflash').textContent = 'Pick the new date and time first.';
        return;
      }
      // datetime-local has no timezone, so it is read in the operator's own — the
      // same clock they are reading the appointment time on.
      const ms = new Date(v).getTime();
      if(!Number.isFinite(ms)){
        $('bk-actflash').className = 'mflash bad';
        $('bk-actflash').textContent = 'That date could not be read.';
        return;
      }
      ok = await callFn('rescheduleAppointment', { appointmentId: id, newDate: ms },
                        btn, 'bk-actflash', 'Moved \u2713 The salon has to confirm it again.');

    } else if(btn.dataset.act === 'cancel'){
      const why = ($('bk-reason').value || '').trim();
      if(why.length < 3){
        $('bk-actflash').className = 'mflash bad';
        $('bk-actflash').textContent = 'Say why first — a cancellation with no reason cannot be explained later.';
        $('bk-reason').focus();
        return;
      }
      if(!window.confirm('Cancel this booking? The payment is flagged for refund and the salon\u2019s balance is unwound.')) return;
      ok = await callFn('adminCancelAppointment', { appointmentId: id, reason: why },
                        btn, 'bk-actflash', 'Cancelled \u2713 Refund flagged for a person to settle.');
    }

    // Re-read rather than patching the card in place: the server decides what the
    // booking now is, and a screen that guesses drifts from it.
    if(ok) setTimeout(run, 700);
  };
}

// ── Activity ────────────────────────────────────────────────────────────────
//
// Every status change a booking has ever been through, newest first.
//
// appointment_events has been written on every transition since the trail went
// in — who changed what, from which state to which, and why — and nothing has
// ever read it. The other tabs each answer one question about one kind of thing;
// this is the only place that shows the platform moving.
//
// It is deliberately not a dashboard of totals. A count tells you the shape of a
// week; this tells you that a booking was confirmed and then cancelled eleven
// minutes later, which is the sort of thing a person notices and no aggregate
// ever surfaces.
const EVENT_TONE = {
  CONFIRMED: 'ok', COMPLETED: 'ok',
  PENDING: 'info', AWAITING_PAYMENT: 'info',
  CANCELLED: 'bad', DECLINED: 'bad',
};

async function renderActivity(){
  $('view').innerHTML = `<div class="empty">${t('empty_loading')}</div>`;
  try{
    const snap = await getDocs(query(
      collection(db,'appointment_events'), orderBy('at','desc'), limit(120)
    ));
    const rows = snap.docs.map(d => d.data());

    if(!rows.length){
      $('view').innerHTML = `<div class="card-pad"><div class="empty">
        ${t('hint_nothingHasHappenedYet')}</div></div>`;
      return;
    }

    // Grouped by day so a scroll reads as a diary rather than a wall.
    const byDay = new Map();
    for(const r of rows){
      const day = new Date(Number(r.at||0)).toLocaleDateString(undefined,
        { weekday:'short', day:'numeric', month:'short' });
      if(!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(r);
    }

    const who = (r) => {
      const role = String(r.actorRole||'').toUpperCase();
      if(role === 'SYSTEM') return 'automatically';
      const name = esc(r.actorName || '') || role.toLowerCase() || 'someone';
      return `by ${name}${role && role !== 'SYSTEM' ? ` (${esc(role.toLowerCase())})` : ''}`;
    };

    $('view').innerHTML = [...byDay.entries()].map(([day, items]) => `
      <div class="section-title" style="margin-top:20px">${esc(day)} · ${items.length}</div>
      <div class="card-pad">
        ${items.map(r => `
          <div style="display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)">
            <span class="pill ${EVENT_TONE[r.to]||'info'}" style="flex-shrink:0">${esc(r.to||'—')}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13.5px;color:var(--ink)">
                <b>${esc(r.bookingCode||r.appointmentId||'—')}</b>
                ${r.from ? `moved from ${esc(r.from)}` : 'created'} ${who(r)}
              </div>
              ${r.reason ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">“${esc(r.reason)}”</div>` : ''}
            </div>
            <div style="font-size:11.5px;color:var(--muted);flex-shrink:0">
              ${new Date(Number(r.at||0)).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
            </div>
          </div>`).join('')}
      </div>`).join('');
  }catch(err){
    $('view').innerHTML = `<div class="card-pad"><div class="mflash bad">${esc(fnError(err))}</div></div>`;
  }
}

// Which interventions make sense for a booking in this state.
//
// PENDING and CONFIRMED are the only live states. Everything else is finished,
// and rendering buttons the server would refuse teaches an operator to distrust
// the screen — which is worse than not offering them.
//
// The reason box appears only where it is required, so it never looks optional.
function BOOKING_ACTIONS(a){
  const id = esc(a.id || '');
  if(!id) return `<div class="empty">${t('hint_noAppointmentId')}</div>`;

  if(a.status !== 'PENDING' && a.status !== 'CONFIRMED'){
    return `<div class="empty">${t('hint_bookingFinished', esc(a.status||'finished'))}</div>`;
  }

  const confirm = a.status === 'PENDING'
    ? `<button class="btn-sm" data-act="confirm" data-id="${id}" style="background:var(--rose)">${t('btn_confirmForTheSalon')}</button>`
    : '';

  return `<div style="display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:8px">
            ${confirm}
            <input type="datetime-local" id="bk-newdate"
              style="padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)" />
            <button class="btn-sm" data-act="move" data-id="${id}"
              style="background:var(--surface);color:var(--deep)">${t('btn_moveToThisTime')}</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:11px">
            <input id="bk-reason" placeholder="Why is this being cancelled?" maxlength="300"
              style="flex:1;min-width:230px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)" />
            <button class="btn-sm" data-act="cancel" data-id="${id}" style="background:#B4404F">${t('btn_cancelBooking')}</button>
          </div>`;
}

function paintBooking(d){
  const a = d.appointment || {};
  const money = (n) => `${Number(n||0).toLocaleString()} AFN`;
  const pill  = (st) => `<span class="pill ${STATUS_PILL[st]||'info'}">${esc(st||'—')}</span>`;

  const rowsOrEmpty = (rows, head, body, empty) => rows.length
    ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${rows.map(body).join('')}</tbody></table></div>`
    : `<div class="empty">${empty}</div>`;

  $('bk-out').innerHTML = `
    <div class="card-pad" style="margin-top:14px">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px">
        <span style="font-size:19px;font-weight:800;letter-spacing:.5px;color:var(--deep)">${esc(a.bookingCode||a.id)}</span>
        ${pill(a.status)}
        ${a.paymentMethod === 'CASH' ? `<span class="pill info">${t('pill_cash')}</span>` : `<span class="pill info">${t('pill_online')}</span>`}
        ${a.customerReported ? `<span class="pill warn">${t('pill_customerReported')}</span>` : ''}
      </div>
      <div class="meta" style="color:var(--muted);line-height:1.9">
        <b>${esc(a.serviceName||'—')}</b> at <b>${esc(a.salonName||'—')}</b>${a.staffName?` with ${esc(a.staffName)}`:''}<br/>
        Customer: ${esc(a.customerName||'—')} · <bdi dir="ltr">${esc(a.customerPhone||'—')}</bdi><br/>
        Appointment: ${fmtDate(a.appointmentDate)} · Booked: ${fmtDate(a.createdAt)}<br/>
        ${a.notes?`Note: “${esc(a.notes)}”`:''}
      </div>
    </div>

    <div class="card-pad" style="margin-top:14px">
      <div class="mlabel">${t('hint_actOnThisBooking')}</div>
      <div class="mhint">
        ${t('hint_bookingActionsRecorded')}
      </div>
      ${BOOKING_ACTIONS(a)}
      <div id="bk-actflash" class="mflash" style="margin-top:10px"></div>
    </div>

    <div class="section-title" style="margin-top:22px">${t('hint_historyCount', (d.events||[]).length)}</div>
    ${rowsOrEmpty(d.events||[],
      `<th scope="col">${t('th_when')}</th><th scope="col">${t('th_from')}</th><th scope="col">${t('th_to')}</th><th scope="col">${t('th_by')}</th><th scope="col">${t('th_why')}</th>`,
      (e) => `<tr>
        <td>${fmtDate(e.at)}</td>
        <td>${e.from?pill(e.from):'—'}</td>
        <td>${pill(e.to)}</td>
        <td class="name">${esc(e.actorName||e.actorRole||'system')}<div class="meta" style="color:var(--muted)">${esc(e.actorRole||'')}</div></td>
        <td>${esc(e.reason||'—')}</td>
      </tr>`,
      'No history recorded — this booking predates the event trail.')}

    <div class="section-title" style="margin-top:22px">${t('hint_paymentsCount', (d.payments||[]).length)}</div>
    ${rowsOrEmpty(d.payments||[],
      `<th scope="col">${t('th_amount')}</th><th scope="col">${t('th_status')}</th><th scope="col">${t('th_method')}</th><th scope="col">${t('th_when')}</th>`,
      (p) => `<tr><td>${money(p.amount)}</td><td>${esc(p.status||'—')}</td><td>${esc(p.method||p.paymentMethod||'—')}</td><td>${fmtDate(p.createdAt)}</td></tr>`,
      'No payment row')}

    ${(d.refunds||[]).length ? `<div class="section-title" style="margin-top:22px">${t('hint_refundsCount', d.refunds.length)}</div>` +
      rowsOrEmpty(d.refunds,

        (r) => `<tr><td>${money(r.amount)}</td><td>${esc(r.status||'—')}</td><td>${fmtDate(r.createdAt)}</td></tr>`, '') : ''}

// ── Health (what the platform found wrong with itself overnight) ─────────────
//
// reconcileIntegrity writes its findings every night; without somewhere to read
// them they are just a log line nobody opens. Backup state sits here too,
// because "is there a backup" and "is anything broken" are the same question
// asked at the same moment.
// Where the invite-code backfill got to, kept outside renderHealth so switching
// tabs — or a page that failed halfway — does not send the next press back to
// the first account. Two cursors, because a preview and a real run walk the
// collection independently and must not inherit each other's position.
let refBusy = false;

// Where each maintenance job got to, keyed by callable name. Kept at module
// scope so a job that runs out of time continues on the next press instead of
// walking the same first page again — which is what all three of these did
// until now, while telling the admin to "run again to continue".
const jobCursors = {};

/**
 * Drive a paged maintenance callable until its collection is exhausted or the
 * time budget runs out. [onPage] accumulates whatever the caller wants to say
 * afterwards; the return says whether it actually finished, which is the part
 * that must never be assumed.
 */
async function runPaged(name, limit, onPage, opts){
  const o   = opts || {};
  const ck  = o.cursorKey || name;      // a preview and a real run page separately
  const started = Date.now();
  let complete = false;
  while (Date.now() - started < (o.budgetMs || 120000)) {
    const { data } = await httpsCallable(fns, name)(
      Object.assign({ limit, cursor: jobCursors[ck] || '' }, o.extra || {}));
    onPage(data);
    jobCursors[ck] = data.cursor || '';
    if (data.done) { complete = true; jobCursors[ck] = ''; break; }
  }
  return complete;
}

    const runRefCodes = async (btn, dryRun) => {

      const flash = $('h-refflash');

      const lbl = btn.textContent;

        'an account that already has a code is skipped — but it cannot be undone ' +
        'account by account. Run "Count them first" if you have not.')) return;

      refBusy = true;
      buttons.forEach(b => { b.disabled = true; });
      let scanned = 0, written = 0, needed = 0, fixable = 0, complete = false;
      const collisions = [], unresolved = [];
      try{
        complete = await runPaged('adminBackfillReferralCodes', 100, d => {
          scanned += d.scanned; written += d.written;

          btn.textContent = dryRun ? `Counting… ${scanned}` : `Working… ${written}`;

        const extra =
          (collisions.length ? ` ${collisions.length} needed a longer code to stay unique.` : '') +
          (unresolved.length ? ` ${unresolved.length} cannot be given one at all — check the logs.` : '');
        const head = dryRun
          ? `Checked ${scanned} account(s); ${needed} still have no invite code`
            + (fixable !== needed ? `, ${fixable} of which can be fixed` : '') + '.'
          : `Checked ${scanned} account(s); wrote ${written} invite code(s).`;
        flash.className = 'mflash ' + ((unresolved.length || !complete) ? 'bad' : 'ok');
        flash.textContent = head + extra + moreToGo(complete, scanned);
      }catch(err){
        // The cursor is kept, so a failed page resumes rather than restarts.

          (scanned ? ` Stopped after ${scanned} account(s); press again to carry on from here.` : '');

      let scanned = 0, assigned = 0;
      try{
        const complete = await runPaged('adminBackfillBookingCodes', 200, d => {
          scanned += d.scanned; assigned += d.assigned;
          btn.textContent = `Working… ${scanned}`;
        });
        $('h-flash').className = 'mflash ' + (complete ? 'ok' : 'bad');
        $('h-flash').textContent = `Scanned ${scanned}, assigned ${assigned}.` +
          (complete ? ' All done.' : '') + moreToGo(complete, scanned);
      }catch(err){
        $('h-flash').className = 'mflash bad';
        $('h-flash').textContent = fnError(err);
      }finally{ btn.disabled = false; btn.textContent = lbl; }
    };
  }catch(e){
    $('view').innerHTML = `<div class="empty">${esc(e.message||String(e))}</div>`;
  }
}

// ── Stuck payments ───────────────────────────────────────────────────────────
//
// A payment that started and never settled. Usually the customer simply closed
// the checkout — but if HesabPay took the money and the webhook never arrived,
// she has paid for an appointment the salon has never seen, and nothing else in
// the system will notice.
//
// Settling is deliberately not automatic: this integration has no HesabPay
// status endpoint to ask, so a person checks the reference on their dashboard
// and confirms. The settlement itself runs the same code the webhook runs.
async function renderStuck(){
  $('view').innerHTML = `<div class="empty">${t('empty_loading')}</div>`;
  try{
    const { data } = await httpsCallable(fns,'adminStuckPayments')({});
    const rows = data.rows || [];
    const money = (n) => `${Number(n||0).toLocaleString()} AFN`;

    $('view').innerHTML = `
      <div class="section-title">${t('hint_paymentsStartedButNeverSettled', rows.length)}</div>
      <div class="meta" style="color:var(--muted);margin:-6px 0 14px;font-size:12px">
        ${t('hint_olderThanGraceMinutes', data.graceMinutes)}
      </div>
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th scope="col">${t('th_booking')}</th><th scope="col">${t('th_customer')}</th><th scope="col">${t('th_amount')}</th>
          <th scope="col">${t('th_bookingState')}</th><th scope="col">${t('th_started')}</th>
          <th scope="col">${t('th_hesabPaySession')}</th><th scope="col"></th>
        </tr></thead>
        <tbody>` + rows.map(r => `<tr>
          <td class="name">${esc(r.bookingCode || r.appointmentId || '—')}<div class="meta" style="color:var(--muted)">${esc(r.serviceName||'')}</div></td>
          <td>${esc(r.customerName||'—')}<div class="meta" style="color:var(--muted)"><bdi dir="ltr">${esc(r.customerPhone||'')}</bdi></div></td>
          <td>${money(r.amount)}</td>
          <td>${r.appointmentStatus === 'AWAITING_PAYMENT'
                 ? `<span class="pill bad">${t('pill_neverArrived')}</span>`
                 : `<span class="pill info">${esc(r.appointmentStatus||'—')}</span>`}</td>
          <td>${fmtDate(r.createdAt)}</td>
          <td class="meta" style="word-break:break-all">${esc(r.hesabSessionId||'—')}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn-sm" style="background:var(--green)" data-settle="${esc(r.paymentId)}">${t('btn_settle')}</button>
          </td>
        </tr>`).join('') + `</tbody></table></div>`
        : `<div class="empty">${t('empty_nothingStuck')}</div>`}
      <div id="stuck-flash" class="mflash" style="margin-top:10px"></div>`;

    $('view').querySelectorAll('[data-settle]').forEach(b => b.onclick = async () => {
      const reference = prompt(
        'Enter the HesabPay transaction reference you verified.\n\n' +
        'It is recorded with the settlement, and used as the replay key so this ' +
        'payment cannot be settled twice.'
      );
      if (!reference || !reference.trim()) return;
      const btn = b, lbl = btn.textContent;
      btn.disabled = true; btn.textContent = 'Settling…';
      try{
        const { data } = await httpsCallable(fns,'adminSettleStuckPayment')({
          paymentId: btn.dataset.settle, transactionId: reference.trim(),
        });
        $('stuck-flash').className = 'mflash ok';
        $('stuck-flash').textContent = `Settlement result: ${data.outcome}.`;
        setTimeout(renderStuck, 900);
      }catch(err){
        $('stuck-flash').className = 'mflash bad';
        $('stuck-flash').textContent = fnError(err);
        btn.disabled = false; btn.textContent = lbl;
      }
    });
  }catch(e){
    $('view').innerHTML = `<div class="empty">${esc(e.message||String(e))}</div>`;
  }
}

// ── Demand ───────────────────────────────────────────────────────────────────

// actually serve. With two live salons and five hundred as the target, which

      ${unmet.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_district')}</th><th scope="col">${t('th_category')}</th><th scope="col">${t('th_timesWanted')}</th><th scope="col">${t('th_salonsServingIt')}</th><th scope="col">${t('th_madeUpOf')}</th></tr></thead>

          <td><span class="pill bad">${t('pill_none')}</span></td>
          <td class="meta">${kinds(r.byKind)}</td>
        </tr>`).join('') + `</tbody></table></div>`
        : `<div class="empty">${t('empty_noDemandYetThatNobodyCanServe')}</div>`}

      <div class="section-title" style="margin-top:26px">${t('hint_allRecordedDemand')}</div>
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_district')}</th><th scope="col">${t('th_category')}</th><th scope="col">${t('th_timesWanted')}</th><th scope="col">${t('th_salons')}</th><th scope="col">${t('th_madeUpOf')}</th></tr></thead>
        <tbody>` + rows.map(r => `<tr>
          <td class="name">${esc(r.districtKey)}</td>
          <td>${esc(r.category)}</td>
          <td>${r.demand}</td>
          <td>${r.salons === 0 ? '<span class="pill bad">0</span>' : r.salons}</td>
          <td class="meta">${kinds(r.byKind)}</td>
        </tr>`).join('') + `</tbody></table></div>`
        : `<div class="empty">${t('empty_nothingRecordedYet')}</div>`}

      <div class="section-title" style="margin-top:26px">${t('hint_supplyByDistrict')}</div>
      ${(data.supplyByDistrict||[]).length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_district')}</th><th scope="col">${t('th_bookableSalons')}</th><th scope="col">${t('th_categoriesCovered')}</th></tr></thead>
        <tbody>` + data.supplyByDistrict.map(s => `<tr>
          <td class="name">${esc(s.districtKey)}</td>
          <td>${s.total}</td>
          <td class="meta">${Object.entries(s.byCategory||{}).map(([c,n])=>`${esc(c)} ${n}`).join(' · ') || '—'}</td>
        </tr>`).join('') + `</tbody></table></div>`
        : `<div class="empty">${t('empty_noBookableSalons')}</div>`}`;
  }catch(e){
    $('view').innerHTML = `<div class="empty">${esc(e.message||String(e))}</div>`;
  }
}

// ── Audit log (privileged admin actions) ──────────────────────────────────────
const AUDIT_META = {
  GRANT_ADMIN:    { icon:'🛡️', cls:'ok'   },
  REVOKE_ADMIN:   { icon:'🚫', cls:'bad'  },
  RESET_PASSWORD: { icon:'🔑', cls:'warn' },
  UPDATE_USER:    { icon:'✏️', cls:'info' },
  ADJUST_BALANCE: { icon:'💰', cls:'warn' },
  GRANT_CREDIT:   { icon:'🎁', cls:'ok'   },
  CREATE_SALON:   { icon:'🏠', cls:'ok'   },
  POST_FOR_SALON: { icon:'📸', cls:'info' },
  SETTLE_STUCK_PAYMENT: { icon:'🧯', cls:'warn' },
  SUSPEND_USER:   { icon:'🚷', cls:'bad'  },
  REINSTATE_USER: { icon:'↩️', cls:'ok'   },
  BACKFILL_CODES: { icon:'🔤', cls:'info' },
  BACKFILL_WORKING_HOURS: { icon:'🕘', cls:'info' },
};
function describeAudit(a){
  const d = a.details || {};
  const who = esc(d.targetName || d.targetUid || d.providerId || d.customerId || '');
  switch(a.action){
    case 'GRANT_ADMIN':    return `Made <b>${who}</b> an admin`;
    case 'REVOKE_ADMIN':   return `Removed admin access from <b>${who}</b>`;
    case 'RESET_PASSWORD': return `Reset the password for <b>${who}</b>`;
    case 'UPDATE_USER':    return `Edited <b>${who}</b> — ${esc(Object.keys(d.updates||{}).join(', ') || 'profile')}`;
    case 'ADJUST_BALANCE': return `Balance ${d.delta>0?'+':''}${esc(String(d.delta))} AFN for <b>${who}</b>${d.reason?` — ${esc(d.reason)}`:''}`;
    case 'GRANT_CREDIT':   return `Credit ${d.amount>0?'+':''}${esc(String(d.amount))} AFN to <b>${who}</b>${d.reason?` — ${esc(d.reason)}`:''}`;
    case 'CREATE_SALON':   return `Added the salon <b>${esc(d.salonName||'')}</b>${d.district?` in ${esc(d.district)}`:''} for <b>${who}</b>`;
    case 'POST_FOR_SALON': return `Published a ${d.kind==='STORY'?'story':'photo'} for <b>${esc(d.salonName||d.salonId||'')}</b>`;
    case 'SETTLE_STUCK_PAYMENT': return `Settled a stuck payment of ${esc(String(d.amount||0))} AFN by hand — HesabPay ref <b>${esc(d.reference||'')}</b> (${esc(d.outcome||'')})`;
    // Suspensions were written to this log and had no case here, so the most
    // consequential thing an admin can do to a person rendered as a bare
    // "SUSPEND USER" — no name, no reason, and no sign of what was restored.
    case 'SUSPEND_USER':   return `Suspended <b>${who}</b>${d.reason?` — ${esc(d.reason)}`:''}`;
    case 'REINSTATE_USER': return `Reinstated <b>${who}</b> as <b>${esc(d.restoredStatus||'?')}</b>`
      + (d.statusGuessed ? ` — ${t('hint_statusGuessed')}` : '');
    case 'BACKFILL_CODES': return `Assigned ${esc(String(d.assigned||0))} booking reference(s) across ${esc(String(d.scanned||0))} booking(s)`;
    case 'BACKFILL_WORKING_HOURS': return `Gave ${esc(String(d.filled||0))} salon(s) a working week, of ${esc(String(d.scanned||0))} checked`;
    default:               return esc(a.action || '');
  }
}
async function renderAudit(){
  try{
    const snap = await getDocs(query(collection(db,'admin_audit'), orderBy('createdAt','desc'), limit(300)));
    const rows = []; snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
    if(!rows.length){ $('view').innerHTML = `<div class="empty">${t('empty_noAdminActionsRecordedYet')}</div>`; return; }
    $('view').innerHTML = `<div class="section-title">${t('hint_adminActionLog', rows.length)}</div>
      <div class="meta" style="color:var(--muted);margin:-6px 0 14px;font-size:12px">${t('hint_auditLogIsImmutable')}</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_when')}</th><th scope="col">${t('th_by')}</th><th scope="col">${t('th_action')}</th></tr></thead>
        <tbody>` + rows.map(a => {
          const m = AUDIT_META[a.action] || { icon:'•', cls:'info' };
          return `<tr>
            <td style="white-space:nowrap">${esc(fmtDate(a.createdAt))}</td>
            <td class="name">${esc(a.adminName||a.adminUid||'—')}</td>
            <td><span class="pill ${m.cls}" style="margin-inline-end:7px">${m.icon} ${esc((a.action||'').replace(/_/g,' '))}</span>${describeAudit(a)}</td>
          </tr>`;
        }).join('') + `</tbody></table></div>`;
  }catch(e){ $('view').innerHTML = `<div class="empty">${t('hint_auditLogLoadFailed', esc(e.message))}</div>`; }
}

/** The full salon/owner control panel: edit salon + owner contact, view the
 *  uploaded tazkira/selfie, curate identity details (tazkira no., birth year,
 *  issue/expiry, address), approve/reject KYC, verify, reset password, adjust
 *  balance. Owner writes go through adminUpdateUser; salon writes are direct. */
async function openSalonModal(salon, onChanged){
  showModal(`<h2>${esc(salon.salonName||salon.id)}</h2><div class="msub">Loading owner…</div>`);
  let owner = {};
  try{ const s = await getDoc(doc(db,'users', salon.providerId)); if(s.exists()) owner = { id:s.id, ...s.data() }; }catch(_){}

  // A KYC photo is rendered from its Storage PATH, fetched with getBlob so the
  // request carries the admin's token and storage.rules decides. It used to be
  // an <img src> and an <a target="_blank"> pointing at a Firebase download
  // URL — a token URL, served without authentication — so opening one put a
  // permanent public link to a woman's identity card in the browser history,
  // and the anchor invited passing it on. The blob URL below is local to this
  // tab and dies with it.
  const photo = (path,label) => path
    ? `<img data-kyc="${esc(path)}" alt="${label}" style="width:92px;height:92px;object-fit:cover;border-radius:11px;border:1px solid var(--line);background:var(--surface)"/>`
    : `<div style="width:92px;height:92px;border-radius:11px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center">${t('lbl_notUploaded')}</div>`;

  // Blob URLs are revoked when the modal closes, so the bytes do not outlive
  // the review they were fetched for.
  const loadKycPhotos = (root) => {
    const made = [];
    root.querySelectorAll('img[data-kyc]').forEach(async (img) => {
      try {
        const blob = await getBlob(sref(storage, img.dataset.kyc));
        const u = URL.createObjectURL(blob);
        made.push(u);
        img.src = u;
      } catch (_) {
        img.replaceWith(Object.assign(document.createElement('div'), {
          className: 'meta',
          textContent: t('lbl_notUploaded'),
          style: 'width:92px;height:92px;border-radius:11px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center',
        }));
      }
    });
    return () => made.forEach((u) => URL.revokeObjectURL(u));
  };

  showModal(`
    <h2>${esc(salon.salonName||salon.id)}</h2>
    <div class="msub">${esc(owner.name||'—')} · ${salon.isVerified?`<span class="pill ok">${t('th_verified')}</span>`:`<span class="pill info">${t('pill_unverified')}</span>`} · ${kycPill(owner.kycStatus)}</div>
    <div id="s-flash" class="mflash"></div>

    <div class="mgroup">
      <div class="mglabel">${t('lbl_salon')}</div>
      <input id="s-district" class="field" value="${esc(salon.district||'')}" placeholder="District / area" />
      <div class="meta" style="color:var(--muted)">★ ${Number(salon.rating||0).toFixed(1)} · ${(salon.services||[]).length} services · ${(salon.staff||[]).length} staff · ${salon.confirmedCount||0} confirmed</div>
    </div>

    <div class="mgroup">
      <div class="mglabel">${t('lbl_ownerContact')}</div>
      <input id="s-name" class="field" value="${esc(owner.name||'')}" placeholder="Owner name" />
      <input id="s-phone" class="field" value="${esc(owner.phone||'')}" placeholder="Phone (+93…)" />
      <div class="meta" style="color:var(--muted)">HesabPay: ${esc(owner.hesabAccountNumber||'—')}${owner.email?' · '+esc(owner.email):''}</div>
    </div>

    <div class="mgroup">
      <div class="mglabel">${t('lbl_identityDocuments')}</div>
      <div style="display:flex;gap:18px;margin-bottom:13px">
        <div style="text-align:center"><div class="meta" style="margin-bottom:5px;color:var(--muted)">${t('lbl_tazkira')}</div>${photo(owner.tazkiraPhotoPath||'','Tazkira')}</div>
        <div style="text-align:center"><div class="meta" style="margin-bottom:5px;color:var(--muted)">${t('lbl_selfie')}</div>${photo(owner.selfiePhotoPath||'','Selfie')}</div>
      </div>
      <input id="s-tazkira" class="field" value="${esc(owner.tazkiraNumber||'')}" placeholder="Tazkira number" />
      <div class="mrow">
        <input id="s-birth" class="field" value="${esc(owner.birthYear||'')}" placeholder="Birth year" />
        <input id="s-issue" class="field" value="${esc(owner.tazkiraIssueDate||'')}" placeholder="Issue date" />
        <input id="s-expiry" class="field" value="${esc(owner.tazkiraExpiryDate||'')}" placeholder="Expiry date" />
      </div>
      <input id="s-prov" class="field" value="${esc(owner.addressProvince||'')}" placeholder="Province" />
      <input id="s-addr" class="field" value="${esc(owner.addressDetail||'')}" placeholder="Address detail" />
      <div class="mrow" style="margin-top:2px">
        <button class="btn-sm" id="s-kyc-ok" style="background:var(--green)">${t('btn_approveKyc')}</button>
        <button class="btn-sm" id="s-kyc-no" style="background:var(--red)">${t('btn_rejectKyc')}</button>
      </div>
    </div>

    <div class="mgroup">
      <div class="mglabel">${t('lbl_publishForThisSalon')}</div>
      <div class="meta" style="color:var(--muted);margin-bottom:9px">
        ${t('hint_seedsDiscover')}
      </div>
      <div class="mrow">
        <input id="s-story" class="field" maxlength="200" placeholder="Story — e.g. two chairs free this afternoon (24h)" />
        <button class="btn-sm" id="s-story-go" style="background:var(--rose)">${t('btn_postStory')}</button>
      </div>
      <!-- Three controls, and a file input is naturally wide: .modal .mrow is
           nowrap, which would crush them onto one line on a narrow screen. -->
      <div class="mrow" style="margin-top:8px;flex-wrap:wrap">
        <input id="s-photo" class="field" type="file" accept="image/jpeg,image/png,image/webp" />
        <input id="s-caption" class="field" maxlength="300" placeholder="Caption (optional)" />
        <button class="btn-sm" id="s-photo-go" style="background:var(--rose)">${t('btn_sharePhoto')}</button>
      </div>
    </div>

    <div class="mgroup">
      <div class="mglabel">${t('lbl_actions')}</div>
      <div class="mrow" style="flex-wrap:wrap">
        <button class="btn-sm" id="s-verify" style="background:${salon.isVerified?'var(--muted)':'var(--green)'}">${salon.isVerified?'Unverify salon':'Verify salon'}</button>
        <button class="btn-sm" id="s-pw" style="background:var(--rose)">${t('btn_resetPassword')}</button>
      </div>
      <div class="mrow" style="margin-top:8px">
        <input id="s-baldelta" class="field" type="number" placeholder="Balance ± AFN" />
        <button class="btn-sm" id="s-balbtn" style="background:var(--rose)">${t('btn_applyBalance')}</button>
      </div>
    </div>

    <button class="btn" id="s-save" style="width:100%;margin-top:4px">${t('btn_saveDetails')}</button>
    <button class="btn-sm mclose" id="s-close">${t('btn_closeSalonModal')}</button>
  `);

  const refresh = () => { if(onChanged) setTimeout(onChanged, 800); };
  // Fetch the two KYC photos now that the modal is in the DOM, and revoke the
  // blob URLs on the way out. Every path that closes this modal runs it: the
  // button, the backdrop and Escape all go through hideModal.
  onModalClose(loadKycPhotos($('modal')));
  $('s-close').onclick = hideModal;

  $('s-story-go').onclick = async (e) => {
    const text = $('s-story').value.trim();
    if(!text){ $('s-flash').className='mflash bad'; $('s-flash').textContent='Write the story text first.'; return; }
    if(await callFn('adminPostForSalon', { salonId: salon.id, kind:'STORY', text }, e.target, 's-flash', 'Story posted ✓')){
      $('s-story').value = '';
    }
  };

  $('s-photo-go').onclick = async (e) => {
    const file = ($('s-photo').files || [])[0];
    if(!file){ $('s-flash').className='mflash bad'; $('s-flash').textContent='Choose a photo first.'; return; }
    // Mirror storage.rules/isValidImage, so an oversized file fails here with a
    // readable message instead of as an opaque upload rejection.
    if(file.size >= 2*1024*1024){ $('s-flash').className='mflash bad'; $('s-flash').textContent='Photo must be under 2 MB.'; return; }

    const btn = e.target, label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Uploading…';
    $('s-flash').className='mflash'; $('s-flash').textContent='';
    try{
      // The id is minted here so the Storage path and the document agree; the
      // callable re-derives the same path and rejects any mismatch.
      const postId = doc(collection(db,'salon_posts')).id;
      const path   = `salon_posts/${salon.id}/${postId}.jpg`;
      await uploadBytes(sref(storage, path), file, { contentType: file.type });
      const imageUrl = await getDownloadURL(sref(storage, path));
      btn.textContent = label;
      const ok = await callFn('adminPostForSalon', {
        salonId: salon.id, kind:'POST', postId, imageUrl, storagePath: path,
        caption: $('s-caption').value.trim(),
      }, btn, 's-flash', 'Photo published ✓');
      if(ok){ $('s-photo').value = ''; $('s-caption').value = ''; }
    }catch(err){
      $('s-flash').className='mflash bad';
      $('s-flash').textContent = 'Upload failed: ' + (err.message || String(err));
    }finally{
      btn.disabled = false; btn.textContent = label;
    }
  };

  $('s-save').onclick = async (e) => {
    // Only send fields that actually changed and aren't blank — sending an empty
    // phone made adminUpdateUser normalize "" → "+93" and throw, wiping the other
    // edits. And do the salon-doc (district) write only AFTER the owner callable
    // succeeds, so a rejected save doesn't leave a half-applied change.
    const payload = { targetUid: salon.providerId };
    const setIf = (id, key, orig) => { const v = $(id).value.trim(); if(v && v !== (orig||'')) payload[key] = v; };
    setIf('s-name','name',owner.name);
    setIf('s-phone','phone',owner.phone);
    setIf('s-tazkira','tazkiraNumber',owner.tazkiraNumber);
    setIf('s-birth','birthYear',owner.birthYear);
    setIf('s-issue','tazkiraIssueDate',owner.tazkiraIssueDate);
    setIf('s-expiry','tazkiraExpiryDate',owner.tazkiraExpiryDate);
    setIf('s-prov','addressProvince',owner.addressProvince);
    setIf('s-addr','addressDetail',owner.addressDetail);
    const dist = $('s-district').value.trim();
    const distChanged = dist !== (salon.district||'');
    const hasUserChanges = Object.keys(payload).length > 1;
    if(!hasUserChanges && !distChanged){ $('s-flash').className='mflash'; $('s-flash').textContent='No changes.'; return; }
    if(hasUserChanges){
      const ok = await callFn('adminUpdateUser', payload, e.target, 's-flash', 'Saved ✓');
      if(!ok) return;
    }
    if(distChanged){
      try{ await updateDoc(doc(db,'salons',salon.id), { district: dist }); }
      catch(err){ $('s-flash').className='mflash bad'; $('s-flash').textContent=err.message; return; }
      $('s-flash').className='mflash ok'; $('s-flash').textContent='Saved ✓';
    }
    refresh();
  };
  $('s-verify').onclick = async (e) => {
    const next = !salon.isVerified;
    e.target.disabled = true;
    try{ await updateDoc(doc(db,'salons',salon.id), { isVerified: next }); salon.isVerified = next;
      e.target.textContent = next?'Unverify salon':'Verify salon';
      $('s-flash').className='mflash ok'; $('s-flash').textContent = next?'Verified ✓':'Unverified ✓'; refresh(); }
    catch(err){ $('s-flash').className='mflash bad'; $('s-flash').textContent=err.message; }
    finally{ e.target.disabled=false; }
  };
  $('s-pw').onclick = async (e) => {
    const pw = prompt('New temporary password for the owner:'); if(pw===null) return;
    if(pw.trim().length < 4){ $('s-flash').className='mflash bad'; $('s-flash').textContent='Password must be at least 4 characters.'; return; }
    await callFn('adminResetPassword', { targetUid: salon.providerId, newPassword: pw.trim() }, e.target, 's-flash', 'Password reset ✓');
  };
  $('s-balbtn').onclick = async (e) => {
    const delta = parseInt($('s-baldelta').value,10);
    if(!delta){ $('s-flash').className='mflash bad'; $('s-flash').textContent='Enter a non-zero amount.'; return; }
    if(await callFn('adminAdjustProviderBalance', { providerId: salon.providerId, delta, reason:'admin salon panel' }, e.target, 's-flash', 'Balance updated ✓')) $('s-baldelta').value='';
  };
  $('s-kyc-ok').onclick = async (e) => {
    if(await callFn('reviewKyc', { targetUid: salon.providerId, approve:true, rejectionReason:'' }, e.target, 's-flash', 'KYC approved ✓')) refresh();
  };
  $('s-kyc-no').onclick = async (e) => {
    const reason = prompt('Rejection reason (shown to the owner):',''); if(reason===null) return;
    if(await callFn('reviewKyc', { targetUid: salon.providerId, approve:false, rejectionReason:reason }, e.target, 's-flash', 'KYC rejected ✓')) refresh();
  };
}

// ── Finance ────────────────────────────────────────────────────────────────────
async function renderFinance(){
  $('view').innerHTML = `
    <div class="section-title">${t('hint_commission')}</div>
    <div class="card" style="padding:16px;max-width:420px;margin-bottom:22px">
      <div id="cflash"></div>
      <div class="meta" id="ccur">${t('lbl_current')}</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="cinput" class="field" type="number" min="0" max="100" placeholder="%" style="margin:0" />
        <button id="csave" class="btn-sm" style="background:var(--rose)">${t('btn_save')}</button>
      </div>
    </div>

    <div class="section-title">${t('hint_maxDiscount')}</div>
    <div class="card" style="padding:16px;max-width:420px;margin-bottom:22px">
      <div class="mhint" style="margin-bottom:10px">${t('hint_maxDiscountExplain')}</div>
      <div id="dflash"></div>
      <div class="meta" id="dcur">${t('lbl_current')}</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="dinput" class="field" type="number" min="1" max="99" placeholder="%" style="margin:0" />
        <button id="dsave" class="btn-sm" style="background:var(--rose)">${t('btn_save')}</button>
      </div>
    </div>
    <div class="section-title">${t('hint_providerPayoutsOwed')}</div>
    <div id="balances"><div class="empty">${t('lbl_templatesLoading')}</div></div>
    <div class="section-title" style="margin-top:22px">${t('hint_refundRequests')}</div>
    <div id="refunds"><div class="empty">${t('empty_loading')}</div></div>`;

  // Commission
  const cref = doc(db,'platform_config','general');
  getDoc(cref).then(s => {
    const p = s.exists() ? (s.data().commissionPercent ?? 10) : 10;
    $('ccur').textContent = 'Current commission: ' + p + '%'; $('cinput').value = p;
  }).catch(()=>{ $('ccur').textContent = 'Current commission: 10%'; });
  $('csave').onclick = async () => {
    const v = parseFloat($('cinput').value);
    if(isNaN(v)||v<0||v>100){ alert('Enter 0–100'); return; }
    try{ await setDoc(cref, { commissionPercent:v }, { merge:true });
      $('cflash').innerHTML = `<div class="flash">Saved ✓</div>`; $('ccur').textContent = 'Current commission: '+v+'%'; }
    catch(e){ alert(e.message); }
  };

  // The deepest a booking may be discounted, as a percentage of the list price.
  // Stored as a fraction (0.9) because that is what the arithmetic wants, and
  // shown as a percentage because that is what a person setting it thinks in.
  getDoc(cref).then(s => {
    const f = s.exists() ? Number(s.data().maxDiscountFraction) : NaN;
    const pct = Number.isFinite(f) && f > 0 && f <= 1 ? Math.round(f * 100) : 90;
    $('dcur').textContent = t('lbl_currentMaxDiscount', pct);
    $('dinput').value = pct;
  }).catch(()=>{ $('dcur').textContent = t('lbl_currentMaxDiscount', 90); });
  $('dsave').onclick = async () => {
    const v = parseFloat($('dinput').value);
    // A 0 here would make every booking free, so it is refused rather than
    // stored — the server refuses it too, and falls back to 90%.
    // Not 100. That leaves the salon nothing, which is the outcome this setting
    // exists to prevent; the server refuses it too and falls back to 90%.
    if(isNaN(v)||v<1||v>99){ alert(t('err_maxDiscountRange')); return; }
    try{ await setDoc(cref, { maxDiscountFraction: v/100 }, { merge:true });
      $('dflash').innerHTML = `<div class="flash">${t('ok_saved')}</div>`;
      $('dcur').textContent = t('lbl_currentMaxDiscount', v); }
    catch(e){ alert(e.message); }
  };

  // Balances + names
  try{
    const balSnap = await getDocs(collection(db,'provider_balances'));
    const balIds = []; balSnap.forEach(d => balIds.push(d.id));
    // Only the providers that actually have a balance row.
    const balUsers = await fetchUsersByIds(balIds);
    const names = {}; Object.values(balUsers).forEach(u => names[u.id] = u.name || u.id);
    const bals = [];
    // Keep every non-zero balance. Positive = platform owes the provider (payout);
    // negative = the provider owes the platform (cash-booking commission debt) —
    // previously dropped, so cash commission receivables were invisible here.
    balSnap.forEach(d => { const b=d.data(); if((b.owedAmount||0) !== 0) bals.push({ ...b, name: names[b.providerId]||b.providerId }); });
    bals.sort((a,b)=>(b.owedAmount||0)-(a.owedAmount||0));
    const bel = $('balances');
    const drawBal = () => {
      bel.innerHTML = bals.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_provider')}</th><th scope="col">${t('th_balance')}</th><th scope="col"></th></tr></thead><tbody>` +
        bals.map((b,i)=> (b.owedAmount||0) > 0 ? `<tr>
          <td class="name">${esc(b.name)}</td>
          <td><b style="color:var(--deep)">${AFN(b.owedAmount)}</b></td>
          <td style="text-align:right"><button class="btn-sm" style="background:var(--green)" data-pay="${i}">${t('btn_markPaid')}</button></td>
        </tr>` : `<tr>
          <td class="name">${esc(b.name)}</td>
          <td><b style="color:var(--red)">${AFN(b.owedAmount)}</b> <span class="pill warn">${t('pill_owesPlatform')}</span></td>
          <td></td>
        </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">${t('empty_nothingOwed')}</div>`;
      bel.querySelectorAll('[data-pay]').forEach(btn => btn.onclick = async () => {
        const b = bals[+btn.dataset.pay];
        if(!confirm(`Mark ${AFN(b.owedAmount)} paid to ${b.name}?`)) return;
        btn.disabled = true; btn.textContent='…';
        try{ await httpsCallable(fns,'recordProviderPayout')({ providerId:b.providerId });
          bals.splice(bals.indexOf(b),1); drawBal(); }
        catch(e){ alert(e.message); btn.disabled=false; btn.textContent='Mark paid'; }
      });
    };
    drawBal();

    // Refunds
    const rSnap = await getDocs(collection(db,'refund_requests'));
    const refunds = [];
    rSnap.forEach(d => { const r=d.data(); if(r.status==='PENDING') refunds.push({ id:d.id, ...r,
      cust: names[r.customerId]||r.customerId }); });
    const rel = $('refunds');
    const drawRef = () => {
      rel.innerHTML = refunds.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_amount')}</th><th scope="col">${t('th_to')}</th><th scope="col">${t('th_date')}</th><th scope="col"></th></tr></thead><tbody>` +
        refunds.map((r,i)=>`<tr>
          <td class="name">${AFN(r.amount)}</td>
          <td>${esc(r.cust)}</td>
          <td>${fmtDate(r.createdAt)}</td>
          <td style="text-align:right"><button class="btn-sm" style="background:var(--rose)" data-ref="${i}">${t('btn_markRefunded')}</button></td>
        </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">${t('empty_noPendingRefunds')}</div>`;
      rel.querySelectorAll('[data-ref]').forEach(btn => btn.onclick = async () => {
        const r = refunds[+btn.dataset.ref];
        if(!confirm(`Mark ${AFN(r.amount)} as refunded?`)) return;
        btn.disabled = true; btn.textContent='…';
        try{ await httpsCallable(fns,'recordRefundProcessed')({ refundRequestId:r.id });
          refunds.splice(refunds.indexOf(r),1); drawRef(); }
        catch(e){ alert(e.message); btn.disabled=false; btn.textContent='Mark refunded'; }
      });
    };
    drawRef();
  }catch(e){ $('balances').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ── Promo codes ────────────────────────────────────────────────────────────────
function renderPromo(){
  $('view').innerHTML = `
    <div class="section-title">${t('hint_createUpdatePromoCode')}</div>
    <div class="card" style="padding:16px;max-width:520px;margin-bottom:22px">
      <div id="pflash"></div>
      <input id="pcode" class="field" placeholder="CODE (e.g. WELCOME10)" />
      <div style="display:flex;gap:8px">
        <input id="ppct" class="field" type="number" placeholder="% off" />
        <input id="pamt" class="field" type="number" placeholder="or AFN off" />
      </div>
      <input id="pmax" class="field" type="number" placeholder="Max uses (0 = unlimited)" />
      <button id="psave" class="btn">${t('btn_saveCode')}</button>
    </div>
    <div class="section-title">${t('hint_existingCodes')}</div>
    <div id="plist"><div class="empty">${t('empty_loading')}</div></div>`;
  $('psave').onclick = async () => {
    const code = $('pcode').value.trim().toUpperCase();
    if(code.length < 3){ alert('Code must be at least 3 characters'); return; }
    const pct = parseInt($('ppct').value)||0, amt = parseInt($('pamt').value)||0, max = parseInt($('pmax').value)||0;
    if(pct<=0 && amt<=0){ alert('Set a percentage or a fixed amount'); return; }
    $('psave').disabled = true; $('psave').textContent='Saving…';
    try{
      await httpsCallable(fns,'upsertPromoCode')({ code, discountPercent:pct, discountAmount:amt, maxUses:max, expiresAt:0, active:true });
      $('pflash').innerHTML = `<div class="flash">Saved ✓</div>`;
      $('pcode').value=$('ppct').value=$('pamt').value=$('pmax').value='';
    }catch(e){ $('pflash').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    finally{ $('psave').disabled=false; $('psave').textContent='Save code'; }
  };
  unsub.push(onSnapshot(collection(db,'promo_codes'), snap => {
    const rows = []; snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
    const el = $('plist'); if(!el) return;
    el.innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th scope="col">${t('th_code')}</th><th scope="col">${t('th_discount')}</th><th scope="col">${t('th_used')}</th><th scope="col">${t('th_status')}</th><th scope="col"></th></tr></thead><tbody>` +
      rows.map(p => `<tr>
        <td class="name">${esc(p.code||p.id)}</td>
        <td>${p.discountPercent>0?p.discountPercent+'% off':''}${p.discountAmount>0?AFN(p.discountAmount)+' off':''}</td>
        <td>${p.usedCount||0}${p.maxUses>0?'/'+p.maxUses:''}</td>
        <td>${p.active?`<span class="pill ok">${t('pill_active')}</span>`:`<span class="pill info">${t('pill_off')}</span>`}</td>
        <td style="text-align:right"><button class="btn-sm" style="background:${p.active?'var(--muted)':'var(--green)'}"
          data-tog="${esc(p.code||p.id)}" data-act="${p.active?'0':'1'}">${p.active?'Disable':'Enable'}</button></td>
      </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">${t('empty_noPromoCodesYet')}</div>`;
    el.querySelectorAll('[data-tog]').forEach(b => b.onclick = () =>
      httpsCallable(fns,'setPromoActive')({ code:b.dataset.tog, active:b.dataset.act==='1' }).catch(e=>alert(e.message)));
  }, err => { const el=$('plist'); if(el) el.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}

// ── Reports (flagged customers) ─────────────────────────────────────────────────
function renderReports(){
  unsub.push(onSnapshot(query(collection(db,'customer_reports'), where('flagged','==',true)), snap => {
    const rows = []; snap.forEach(d => { const r=d.data(); if(r.status==='OPEN') rows.push({ id:d.id, ...r }); });
    rows.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(!rows.length){ $('view').innerHTML = `<div class="empty">${t('empty_noFlaggedReports')}</div>`; return; }
    $('view').innerHTML = `<div class="section-title">${t('hint_flaggedCustomerReports', rows.length)}</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_customer')}</th><th scope="col">${t('th_salon')}</th><th scope="col">${t('th_rating')}</th><th scope="col">${t('th_flag')}</th><th scope="col">${t('th_date')}</th><th scope="col"></th></tr></thead>
        <tbody>` + rows.map(r => `<tr>
          <td><div class="name">${esc(r.customerName||r.customerId)}</div>${r.comment?`<div style="color:var(--muted);font-size:11.5px;margin-top:2px;font-style:italic">"${esc(r.comment)}"</div>`:''}</td>
          <td>${esc(r.salonName||'—')}</td>
          <td>${r.rating>0?'★ '+r.rating:'—'}</td>
          <td>${r.noShow?`<span class="pill warn">${t('th_noShow')}</span>`:`<span class="pill bad">${t('pill_flagged')}</span>`}</td>
          <td>${fmtDate(r.createdAt)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn-sm" style="background:var(--muted)" data-dis="${r.id}">${t('btn_dismiss')}</button>
            <button class="btn-sm" style="background:var(--red);margin-left:6px" data-sus="${r.id}">${t('btn_suspendAccount')}</button>
          </td>
        </tr>`).join('') + `</tbody></table></div>`;
    const resolve = (id, suspend) =>
      httpsCallable(fns,'resolveCustomerReport')({ reportId:id, suspend }).catch(e=>alert(e.message||'Failed'));
    $('view').querySelectorAll('[data-dis]').forEach(b => b.onclick = () => resolve(b.dataset.dis, false));
    $('view').querySelectorAll('[data-sus]').forEach(b => b.onclick = () => {
      if(confirm('Suspend this customer?')) resolve(b.dataset.sus, true);
    });
  }, err => { $('view').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}
</script>
