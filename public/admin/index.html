<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SafeBeauty · Admin Console</title>
<style>
  :root{
    --rose:#B76E79; --deep:#8B3A47; --plum:#7A2F3D; --blush:#F9CBDA;
    --cream:#FFF7FB; --surface:#FDEFF6; --lilac:#E9D5F0; --petal:#FCE4EF;
    --ink:#3f3237; --muted:#948289; --green:#3fa14a; --red:#C0392B; --gold:#D4A853;
    --line:#EFD5E1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased}
  body{background:linear-gradient(160deg,#FFF7FB 0%,#FDEAF3 55%,#F5E7F6 100%)}
  button{font-family:inherit;cursor:pointer;border:none}
  input,textarea{font-family:inherit}
  .hidden{display:none !important}

  /* Login */
  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px rgba(139,58,71,.12)}
  #login .card{width:100%;max-width:380px;padding:36px 32px;text-align:center}
  .logo{width:72px;height:72px;border-radius:22px;margin:0 auto 14px;
        background:radial-gradient(circle at 50% 35%,#FFF0F6,#FCE4EF 60%,#F7D9E7);
        display:flex;align-items:center;justify-content:center;font-size:32px}
  h1{margin:0;font-size:23px;background:linear-gradient(90deg,#EBA9C0,#B76E79,#7A2F3D);
     -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:-.01em}
  .sub{color:var(--rose);font-size:13px;margin:5px 0 22px}
  .field{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:13.5px;
    margin-bottom:11px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
  .field:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(183,110,121,.12)}
  .btn{width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:700;color:#fff;
       background:linear-gradient(90deg,#EBA9C0,#B76E79,#7A2F3D);transition:opacity .15s}
  .btn:hover{opacity:.94}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-ghost{background:var(--petal);color:var(--deep);font-weight:600}
  .btn-sm{padding:7px 13px;border-radius:9px;font-size:12px;font-weight:700;color:#fff;transition:opacity .15s}
  .btn-sm:hover{opacity:.9}
  .err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:7px}

  /* Shell — sidebar layout */
  #app{height:100vh;display:flex;overflow:hidden}
  .sidebar{width:210px;flex-shrink:0;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);
    border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px}
  .sidebar .brand{font-size:18px;font-weight:800;padding:2px 10px 4px;letter-spacing:-.01em;
    background:linear-gradient(90deg,#EBA9C0,#B76E79,#7A2F3D);-webkit-background-clip:text;background-clip:text;color:transparent}
  .who2{font-size:11px;color:var(--muted);padding:0 10px 14px}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;width:100%;
    color:var(--rose);font-weight:600;font-size:13px;background:transparent;text-align:left;transition:background .12s,color .12s}
  .navitem:hover{background:var(--petal)}
  .navitem.active{background:linear-gradient(90deg,#EBA9C0,#B76E79);color:#fff;box-shadow:0 5px 14px rgba(183,110,121,.26)}
  .navitem .ico{font-size:14px;width:20px;text-align:center;flex-shrink:0}
  .sidebar .foot{padding-top:12px;margin-top:6px;border-top:1px solid var(--line)}
  .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{padding:15px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.6);backdrop-filter:blur(8px);
    font-size:16px;font-weight:800;color:var(--deep);letter-spacing:-.01em}
  main{flex:1;overflow-y:auto;padding:22px 28px 50px;max-width:1080px}

  /* Stats */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
  .stat{padding:16px 18px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 18px rgba(139,58,71,.05)}
  .stat .ico{font-size:19px;margin-bottom:7px}
  .stat .n{font-size:28px;font-weight:800;color:var(--deep);line-height:1.05}
  .stat .l{color:var(--muted);font-size:12px;margin-top:3px}

  /* Lists — compact rows with actions pinned to the right on wide screens */
  .row{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 15px;margin-bottom:8px;box-shadow:0 2px 8px rgba(139,58,71,.04)}
  .row h3{margin:0 0 2px;font-size:14px;color:var(--deep);font-weight:700}
  .row .meta{color:var(--muted);font-size:12px;line-height:1.5}
  .row .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  @media(min-width:680px){
    .row:not(.ticket){padding-right:168px}
    .row:not(.ticket) .actions{position:absolute;top:12px;right:14px;margin-top:0;flex-direction:column;align-items:stretch;width:142px}
    .row .actions .btn-sm{width:100%}
  }
  .row.ticket{padding-right:15px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;vertical-align:middle}
  .badge.dot{background:rgba(192,57,43,.12);color:var(--red)}
  .empty{text-align:center;color:var(--rose);padding:52px 10px;font-size:13.5px}
  .section-title{font-size:11px;color:var(--rose);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 12px}

  /* Data tables */
  .tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(139,58,71,.05)}
  .tbl{width:100%;border-collapse:collapse;background:#fff;min-width:560px}
  .tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    font-weight:800;padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover{background:#FFF9FC}
  .tbl .name{font-weight:700;color:var(--deep)}
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .pill.ok{background:rgba(63,161,74,.14);color:#2e7d32}
  .pill.warn{background:rgba(212,168,83,.20);color:#9a6f16}
  .pill.bad{background:rgba(192,57,43,.13);color:var(--red)}
  .pill.info{background:var(--surface);color:var(--rose)}

  /* Announce + support composer */
  textarea.field{min-height:100px;resize:vertical;line-height:1.5}
  .flash{background:rgba(63,161,74,.12);color:#2e7d32;border-radius:11px;padding:10px 14px;font-size:12.5px;margin-bottom:12px}

  /* Support chat */
  .support-wrap{display:grid;grid-template-columns:320px 1fr;gap:16px}
  @media(max-width:820px){.support-wrap{grid-template-columns:1fr}}
  .ticket{cursor:pointer;transition:box-shadow .12s}
  .ticket:hover{box-shadow:0 6px 20px rgba(139,58,71,.1)}
  .ticket.sel{outline:2px solid var(--rose)}
  .chat{background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:440px;box-shadow:0 3px 14px rgba(139,58,71,.045)}
  .chat .msgs{flex:1;padding:16px;overflow-y:auto;max-height:460px;display:flex;flex-direction:column;gap:9px}
  .bubble{max-width:74%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
  .bubble.them{align-self:flex-start;background:var(--surface);color:var(--ink)}
  .bubble.me{align-self:flex-end;background:linear-gradient(90deg,#EBA9C0,#B76E79);color:#fff}
  .bubble .t{display:block;font-size:10px;opacity:.7;margin-top:3px}
  .composer{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line)}
  .composer input{flex:1;margin:0}
  .chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--rose);font-size:13px}
</style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────────── -->
<div id="login">
  <div class="card">
    <div class="logo">❀</div>
    <h1>SafeBeauty</h1>
    <div class="sub">Admin Console</div>
    <input id="lp" class="field" type="tel" placeholder="Phone (e.g. +93700…)" autocomplete="username" />
    <input id="lw" class="field" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="lbtn" class="btn">Sign in</button>
    <button id="lbio" class="btn btn-ghost hidden" style="margin-top:10px">☝ Sign in with Touch ID</button>
    <label id="lrem" class="hidden" style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;font-size:13px;color:var(--rose);cursor:pointer">
      <input type="checkbox" id="lremc" /> Remember me with Touch ID
    </label>
    <div id="lerr" class="err"></div>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">SafeBeauty ❀</div>
    <div class="who2" id="who"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button class="btn-sm" id="logout" style="width:100%;background:var(--rose)">Sign out</button>
    </div>
  </aside>
  <div class="main-area">
    <div class="topbar" id="topbar">Statistics</div>
    <main id="view"></main>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, query, where, orderBy, getDocs, getDoc, doc,
         setDoc, updateDoc, addDoc, onSnapshot, getCountFromServer }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getFunctions, httpsCallable }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

const firebaseConfig = {
  apiKey: "AIzaSyBZG_ltbYVsaZkPyGQ_NozOQvo3JeuO2mQ",
  authDomain: "safebeauty.firebaseapp.com",
  projectId: "safebeauty",
  storageBucket: "safebeauty.firebasestorage.app",
  messagingSenderId: "238802374530",
  appId: "1:238802374530:android:f2617130bc9a9644b3c99b"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const fns  = getFunctions(app, 'us-central1');

// ── Phone normalization (mirrors PhoneUtils.normalizeForLogin) ──────────────
function clean(raw){ const t=raw.trim(); const plus=t.startsWith('+'); const d=t.replace(/\D/g,''); return plus?'+'+d:d; }
function normalizeAfghan(raw){
  let c=clean(raw);
  if(c.startsWith('+93')) return c;
  if(c.startsWith('0093')) return '+93'+c.slice(4);
  if(c.startsWith('93')&&c.length>=11) return '+'+c;
  c=c.replace(/^\+/,''); if(c.startsWith('0')) c=c.slice(1);
  return '+93'+c;
}
function normalizeForLogin(raw){ const c=clean(raw); return c.startsWith('+')?c:normalizeAfghan(raw); }

// ── PBKDF2 auth-password derivation (mirrors PinHasher.deriveAuthPassword) ───
function b64ToBytes(b64){ const s=atob(b64); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }
function bytesToB64(b){ let s=''; for(const x of b) s+=String.fromCharCode(x); return btoa(s); }
async function deriveAuthPassword(pin, saltB64){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode('AUTH:'+pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:b64ToBytes(saltB64), iterations:65536, hash:'SHA-256' }, key, 256);
  return bytesToB64(new Uint8Array(bits));
}

// ── State ───────────────────────────────────────────────────────────────────
let admin = null; // { uid, name }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (ms) => ms ? new Date(Number(ms)).toLocaleString() : '—';
const statusPill = (s) => {
  const c = { APPROVED:'ok', PENDING:'warn', SUSPENDED:'bad', REJECTED:'bad' }[s] || 'info';
  return `<span class="pill ${c}">${esc(s||'—')}</span>`;
};
const kycPill = (k) => {
  const v = k || 'NONE';
  const c = { APPROVED:'ok', PENDING:'warn', REJECTED:'bad' }[v] || 'info';
  return `<span class="pill ${c}">${esc(v)}</span>`;
};

// ── Login ────────────────────────────────────────────────────────────────────
$('lbtn').addEventListener('click', doLogin);
$('lw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const phone = normalizeForLogin($('lp').value);
  const pw = $('lw').value;
  $('lerr').textContent = '';
  if(!phone || !pw){ $('lerr').textContent='Enter phone and password.'; return; }
  $('lbtn').disabled = true; $('lbtn').textContent = 'Signing in…';
  try{
    const res = await httpsCallable(fns,'authenticateWithPassword')({ phone, password: pw });
    const m = res.data || {};
    if(m.mode !== 'REAL'){ throw new Error('Invalid phone or password.'); }
    if((m.role||'') !== 'ADMIN'){ throw new Error('This account is not an administrator.'); }
    const authPw = await deriveAuthPassword(pw, m.salt || '');
    await signInWithEmailAndPassword(auth, m.firebaseEmail, authPw);
    await httpsCallable(fns,'syncUidMap')({ appUid: m.uid });
    // Save the credential for Touch ID if opted in (desktop app only).
    if (window.electronBiometric && $('lremc') && $('lremc').checked) {
      try { await window.electronBiometric.save(phone, pw); } catch(_){}
    }
    admin = { uid: m.uid, name: m.name || 'Admin' };
    enterApp();
  }catch(e){
    $('lerr').textContent = (e && e.message) ? e.message : 'Sign-in failed.';
  }finally{
    $('lbtn').disabled = false; $('lbtn').textContent = 'Sign in';
  }
}

$('logout').addEventListener('click', async () => {
  await signOut(auth); location.reload();
});

// ── Touch ID (desktop app only) ────────────────────────────────────────────────
(async function setupBiometric(){
  const bio = window.electronBiometric;
  if(!bio) return;                                   // plain browser → skip
  let avail = false; try{ avail = await bio.available(); }catch(_){}
  if(!avail) return;                                 // no Touch ID hardware/enrollment
  $('lrem').classList.remove('hidden');              // offer "remember me"
  let has = false; try{ has = await bio.has(); }catch(_){}
  if(has){
    const b = $('lbio');
    b.classList.remove('hidden');
    b.onclick = async () => {
      const cred = await bio.get();                  // triggers the Touch ID prompt
      if(cred && cred.phone && cred.password){
        $('lp').value = cred.phone; $('lw').value = cred.password;
        doLogin();
      }
    };
  }
})();

// ── App shell ────────────────────────────────────────────────────────────────
const TABS = [
  { id:'stats',    label:'Statistics', icon:'📊', render:renderStats },
  { id:'support',  label:'Support',    icon:'💬', render:renderSupport },
  { id:'announce', label:'Announce',   icon:'📢', render:renderAnnounce },
  { id:'approvals',label:'Approvals',  icon:'✅', render:renderApprovals },
  { id:'kyc',      label:'KYC',        icon:'🪪', render:renderKyc },
  { id:'users',    label:'Users',      icon:'👥', render:renderUsers },
  { id:'salons',   label:'Salons',     icon:'🏠', render:renderSalons },
  { id:'finance',  label:'Finance',    icon:'💰', render:renderFinance },
  { id:'promo',    label:'Promo',      icon:'🎟️', render:renderPromo },
  { id:'reports',  label:'Reports',    icon:'🚩', render:renderReports },
];
const AFN = (n) => (Number(n)||0).toLocaleString() + ' AFN';
let activeTab = 'stats';
let unsub = [];   // active onSnapshot cleanups per view

function enterApp(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = 'Signed in as ' + admin.name;
  const nav = $('nav');
  nav.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'navitem' + (t.id===activeTab?' active':'');
    b.innerHTML = `<span class="ico">${t.icon}</span><span>${t.label}</span>`;
    b.onclick = () => selectTab(t.id);
    nav.appendChild(b);
  });
  selectTab(activeTab);
}
function selectTab(id){
  activeTab = id;
  unsub.forEach(fn => { try{fn();}catch(_){} }); unsub = [];
  const tab = TABS.find(t=>t.id===id);
  [...$('nav').children].forEach((b,i) => b.classList.toggle('active', TABS[i].id===id));
  $('topbar').textContent = tab.label;
  $('view').innerHTML = '<div class="empty">Loading…</div>';
  tab.render();
}

// ── Stats ────────────────────────────────────────────────────────────────────
async function renderStats(){
  try{
    const [usersSnap, salonsSnap, apptCount] = await Promise.all([
      getDocs(collection(db,'users')),
      getDocs(collection(db,'salons')),
      getCountFromServer(collection(db,'appointments')).catch(()=>null),
    ]);
    let providers=0, customers=0, pending=0, suspended=0, kycPending=0;
    usersSnap.forEach(d => { const u=d.data();
      if(u.role==='PROVIDER') providers++;
      if(u.role==='CUSTOMER') customers++;
      if(u.status==='PENDING') pending++;
      if(u.status==='SUSPENDED') suspended++;
      if(u.kycStatus==='PENDING') kycPending++;
    });
    const appts = apptCount ? apptCount.data().count : '—';
    const cards = [
      ['👥','Total users', usersSnap.size], ['💇','Providers', providers], ['🧑','Customers', customers],
      ['🏠','Salons', salonsSnap.size], ['📅','Appointments', appts],
      ['⏳','Pending approvals', pending], ['🪪','KYC pending', kycPending], ['🚫','Suspended', suspended],
    ];
    $('view').innerHTML =
      `<div class="section-title">Platform overview</div><div class="grid">` +
      cards.map(([ic,l,n]) => `<div class="stat"><div class="ico">${ic}</div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('') +
      `</div>`;
  }catch(e){ $('view').innerHTML = `<div class="empty">Couldn't load stats: ${esc(e.message)}</div>`; }
}

// ── Announcements ──────────────────────────────────────────────────────────────
function renderAnnounce(){
  $('view').innerHTML = `
    <div class="section-title">Send an announcement</div>
    <div class="card" style="padding:18px;max-width:560px">
      <div id="aflash"></div>
      <textarea id="amsg" class="field" placeholder="Your message to all users…"></textarea>
      <button id="asend" class="btn">Send to everyone</button>
      <div class="meta" style="margin-top:10px">Delivered as a push notification and shown in-app.</div>
    </div>`;
  $('asend').onclick = async () => {
    const msg = $('amsg').value.trim();
    if(!msg) return;
    $('asend').disabled = true; $('asend').textContent = 'Sending…';
    try{
      await addDoc(collection(db,'broadcasts'), { message: msg, sentBy:'admin', createdAt: Date.now() });
      $('amsg').value = '';
      $('aflash').innerHTML = `<div class="flash">Announcement sent ✓</div>`;
    }catch(e){ $('aflash').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    finally{ $('asend').disabled=false; $('asend').textContent='Send to everyone'; }
  };
}

// ── Approvals ──────────────────────────────────────────────────────────────────
function renderApprovals(){
  const q = query(collection(db,'users'), where('status','==','PENDING'));
  unsub.push(onSnapshot(q, snap => {
    const rows = [];
    snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
    if(!rows.length){ $('view').innerHTML = `<div class="empty">No pending approvals 🎉</div>`; return; }
    $('view').innerHTML = `<div class="section-title">Pending provider approvals (${rows.length})</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Joined</th><th></th></tr></thead>
        <tbody>` + rows.map(u => `<tr>
          <td class="name">${esc(u.name||u.id)}</td>
          <td><span class="pill info">${esc(u.role||'—')}</span></td>
          <td>${esc(u.phone||'—')}</td>
          <td>${fmtDate(u.createdAt)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn-sm" style="background:var(--green)" data-ok="${u.id}">Approve</button>
            <button class="btn-sm" style="background:var(--red);margin-left:6px" data-no="${u.id}">Reject</button>
          </td>
        </tr>`).join('') + `</tbody></table></div>`;
    $('view').querySelectorAll('[data-ok]').forEach(b => b.onclick = () =>
      updateDoc(doc(db,'users',b.dataset.ok), { status:'APPROVED' }).catch(e=>alert(e.message)));
    $('view').querySelectorAll('[data-no]').forEach(b => b.onclick = () => {
      const reason = prompt('Rejection reason (shown to the user):','');
      if(reason===null) return;
      updateDoc(doc(db,'users',b.dataset.no), { status:'REJECTED', rejectionReason: reason }).catch(e=>alert(e.message));
    });
  }, err => { $('view').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}

// ── KYC ────────────────────────────────────────────────────────────────────────
function renderKyc(){
  const q = query(collection(db,'users'), where('kycStatus','==','PENDING'));
  unsub.push(onSnapshot(q, snap => {
    const rows = [];
    snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
    if(!rows.length){ $('view').innerHTML = `<div class="empty">No identity checks awaiting review ✓</div>`; return; }
    $('view').innerHTML = `<div class="section-title">Identity verification queue (${rows.length})</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th></th></tr></thead>
        <tbody>` + rows.map(u => `<tr>
          <td class="name">${esc(u.name||u.id)}</td>
          <td><span class="pill info">${esc(u.role||'—')}</span></td>
          <td>${esc(u.phone||'—')}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn-sm" style="background:var(--green)" data-ok="${u.id}">Approve</button>
            <button class="btn-sm" style="background:var(--red);margin-left:6px" data-no="${u.id}">Reject</button>
          </td>
        </tr>`).join('') + `</tbody></table></div>`;
    const review = (uid, approve, reason='') =>
      httpsCallable(fns,'reviewKyc')({ targetUid: uid, approve, rejectionReason: reason })
        .catch(e => alert(e.message||'Failed'));
    $('view').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => review(b.dataset.ok, true));
    $('view').querySelectorAll('[data-no]').forEach(b => b.onclick = () => {
      const reason = prompt('Rejection reason:',''); if(reason===null) return;
      review(b.dataset.no, false, reason);
    });
  }, err => { $('view').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}

// ── Support ────────────────────────────────────────────────────────────────────
let selectedTicket = null;
let chatUnsub = null;

function renderSupport(){
  $('view').innerHTML = `<div class="support-wrap">
      <div id="tickets"></div>
      <div id="chat" class="chat"><div class="chat-empty">Select a conversation</div></div>
    </div>`;
  const q = query(collection(db,'support_tickets'), where('status','==','OPEN'));
  unsub.push(onSnapshot(q, snap => {
    const rows = [];
    snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
    rows.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    const el = $('tickets');
    if(!el) return;
    if(!rows.length){ el.innerHTML = `<div class="empty">No open support requests</div>`; return; }
    el.innerHTML = rows.map(t => `
      <div class="row ticket ${selectedTicket===t.userId?'sel':''}" data-uid="${esc(t.userId)}" data-name="${esc(t.userName||t.userId)}">
        <h3>${t.unreadForAdmin?'<span class="badge dot">●</span> ':''}${esc(t.userName||t.userId)}</h3>
        <div class="meta">${esc(t.userRole||'')}${t.relatedInfo?' · '+esc(t.relatedInfo):''}</div>
        <div class="meta">${fmtDate(t.updatedAt)}</div>
      </div>`).join('');
    el.querySelectorAll('.ticket').forEach(r => r.onclick = () => openChat(r.dataset.uid, r.dataset.name));
  }, err => { const el=$('tickets'); if(el) el.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}

function openChat(userId, name){
  selectedTicket = userId;
  document.querySelectorAll('.ticket').forEach(r => r.classList.toggle('sel', r.dataset.uid===userId));
  updateDoc(doc(db,'support_tickets',userId), { unreadForAdmin:false }).catch(()=>{});
  const chat = $('chat');
  chat.innerHTML = `<div class="msgs" id="msgs"></div>
    <div class="composer">
      <input id="cin" class="field" placeholder="Reply to ${esc(name)}…" />
      <button id="csend" class="btn-sm" style="background:var(--rose)">Send</button>
      <button id="cclose" class="btn-sm" style="background:var(--petal);color:var(--deep)">Close</button>
    </div>`;
  const convId = 'support_'+userId;
  if(chatUnsub){ try{chatUnsub();}catch(_){} }
  const q = query(collection(db,'chat_messages'), where('conversationId','==',convId));
  chatUnsub = onSnapshot(q, snap => {
    const msgs = [];
    snap.forEach(d => msgs.push(d.data()));
    msgs.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    const box = $('msgs'); if(!box) return;
    box.innerHTML = msgs.map(m => {
      const mine = m.senderId === admin.uid;
      return `<div class="bubble ${mine?'me':'them'}">${esc(m.content)}<span class="t">${fmtDate(m.timestamp)}</span></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  });
  const send = async () => {
    const inp = $('cin'); const text = inp.value.trim(); if(!text) return;
    inp.value='';
    try{
      await addDoc(collection(db,'chat_messages'), {
        conversationId: convId, senderId: admin.uid, senderName:'Support', content:text, timestamp: Date.now()
      });
    }catch(e){ alert(e.message); inp.value=text; }
  };
  $('csend').onclick = send;
  $('cin').addEventListener('keydown', e => { if(e.key==='Enter') send(); });
  $('cclose').onclick = () => {
    if(!confirm('Close this support ticket?')) return;
    updateDoc(doc(db,'support_tickets',userId), { status:'CLOSED' }).catch(e=>alert(e.message));
    selectedTicket = null;
    $('chat').innerHTML = `<div class="chat-empty">Select a conversation</div>`;
  };
}

// ── Users ──────────────────────────────────────────────────────────────────────
async function renderUsers(){
  try{
    const snap = await getDocs(collection(db,'users'));
    const users = []; snap.forEach(d => users.push({ id:d.id, ...d.data() }));
    users.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    $('view').innerHTML = `<div class="section-title">All users (${users.length})</div>
      <input id="usearch" class="field" placeholder="Search name or phone…" style="max-width:340px;margin-bottom:16px" />
      <div id="ulist"></div>`;
    const setStatus = async (uid, status) => {
      try{ await updateDoc(doc(db,'users',uid), { status });
        const u = users.find(x=>x.id===uid); if(u) u.status = status; draw($('usearch').value); }
      catch(e){ alert(e.message); }
    };
    const draw = (term='') => {
      const t = term.trim().toLowerCase();
      const rows = users.filter(u => !t || (u.name||'').toLowerCase().includes(t) || (u.phone||'').includes(t));
      $('ulist').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Status</th><th>KYC</th><th></th></tr></thead>
        <tbody>` + rows.map(u => `<tr>
          <td class="name">${esc(u.name||u.id)}</td>
          <td><span class="pill info">${esc(u.role||'—')}</span></td>
          <td>${esc(u.phone||'—')}</td>
          <td>${statusPill(u.status)}</td>
          <td>${kycPill(u.kycStatus)}</td>
          <td style="text-align:right">${u.status==='SUSPENDED'
            ? `<button class="btn-sm" style="background:var(--green)" data-uns="${u.id}">Unsuspend</button>`
            : `<button class="btn-sm" style="background:var(--red)" data-sus="${u.id}">Suspend</button>`}</td>
        </tr>`).join('') + `</tbody></table></div>`
        : `<div class="empty">No matching users</div>`;
      $('ulist').querySelectorAll('[data-sus]').forEach(b=>b.onclick=()=>setStatus(b.dataset.sus,'SUSPENDED'));
      $('ulist').querySelectorAll('[data-uns]').forEach(b=>b.onclick=()=>setStatus(b.dataset.uns,'APPROVED'));
    };
    draw();
    $('usearch').oninput = e => draw(e.target.value);
  }catch(e){ $('view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ── Salons ─────────────────────────────────────────────────────────────────────
async function renderSalons(){
  try{
    const snap = await getDocs(collection(db,'salons'));
    const salons = []; snap.forEach(d => salons.push({ id:d.id, ...d.data() }));
    if(!salons.length){ $('view').innerHTML = `<div class="empty">No salons yet</div>`; return; }
    $('view').innerHTML = `<div class="section-title">Salons (${salons.length})</div><div id="slist"></div>`;
    const verify = async (id, v) => {
      try{ await updateDoc(doc(db,'salons',id), { isVerified:v });
        const s = salons.find(x=>x.id===id); if(s) s.isVerified = v; draw(); }
      catch(e){ alert(e.message); }
    };
    const draw = () => {
      $('slist').innerHTML = `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Salon</th><th>District</th><th>Rating</th><th>Services</th><th>Verified</th><th></th></tr></thead>
        <tbody>` + salons.map(s => `<tr>
          <td class="name">${esc(s.salonName||s.id)}</td>
          <td>${esc(s.district||'—')}</td>
          <td>★ ${Number(s.rating||0).toFixed(1)}</td>
          <td>${(s.services||[]).length}</td>
          <td>${s.isVerified?'<span class="pill ok">Verified</span>':'<span class="pill info">No</span>'}</td>
          <td style="text-align:right">${s.isVerified
            ? `<button class="btn-sm" style="background:var(--muted)" data-unv="${s.id}">Unverify</button>`
            : `<button class="btn-sm" style="background:var(--green)" data-ver="${s.id}">Verify</button>`}</td>
        </tr>`).join('') + `</tbody></table></div>`;
      $('slist').querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>verify(b.dataset.ver,true));
      $('slist').querySelectorAll('[data-unv]').forEach(b=>b.onclick=()=>verify(b.dataset.unv,false));
    };
    draw();
  }catch(e){ $('view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ── Finance ────────────────────────────────────────────────────────────────────
async function renderFinance(){
  $('view').innerHTML = `
    <div class="section-title">Commission</div>
    <div class="card" style="padding:16px;max-width:420px;margin-bottom:22px">
      <div id="cflash"></div>
      <div class="meta" id="ccur">Current: …</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="cinput" class="field" type="number" min="0" max="100" placeholder="%" style="margin:0" />
        <button id="csave" class="btn-sm" style="background:var(--rose)">Save</button>
      </div>
    </div>
    <div class="section-title">Provider payouts owed</div>
    <div id="balances"><div class="empty">Loading…</div></div>
    <div class="section-title" style="margin-top:22px">Refund requests</div>
    <div id="refunds"><div class="empty">Loading…</div></div>`;

  // Commission
  const cref = doc(db,'platform_config','general');
  getDoc(cref).then(s => {
    const p = s.exists() ? (s.data().commissionPercent ?? 10) : 10;
    $('ccur').textContent = 'Current commission: ' + p + '%'; $('cinput').value = p;
  }).catch(()=>{ $('ccur').textContent = 'Current commission: 10%'; });
  $('csave').onclick = async () => {
    const v = parseFloat($('cinput').value);
    if(isNaN(v)||v<0||v>100){ alert('Enter 0–100'); return; }
    try{ await setDoc(cref, { commissionPercent:v }, { merge:true });
      $('cflash').innerHTML = `<div class="flash">Saved ✓</div>`; $('ccur').textContent = 'Current commission: '+v+'%'; }
    catch(e){ alert(e.message); }
  };

  // Balances + names
  try{
    const [balSnap, uSnap] = await Promise.all([
      getDocs(collection(db,'provider_balances')), getDocs(collection(db,'users'))
    ]);
    const names = {}; uSnap.forEach(d => names[d.id] = d.data().name || d.id);
    const bals = [];
    balSnap.forEach(d => { const b=d.data(); if((b.owedAmount||0) > 0) bals.push({ ...b, name: names[b.providerId]||b.providerId }); });
    bals.sort((a,b)=>(b.owedAmount||0)-(a.owedAmount||0));
    const bel = $('balances');
    const drawBal = () => {
      bel.innerHTML = bals.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Provider</th><th>Owed</th><th></th></tr></thead><tbody>` +
        bals.map((b,i)=>`<tr>
          <td class="name">${esc(b.name)}</td>
          <td><b style="color:var(--deep)">${AFN(b.owedAmount)}</b></td>
          <td style="text-align:right"><button class="btn-sm" style="background:var(--green)" data-pay="${i}">Mark paid</button></td>
        </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">Nothing owed 🎉</div>`;
      bel.querySelectorAll('[data-pay]').forEach(btn => btn.onclick = async () => {
        const b = bals[+btn.dataset.pay];
        if(!confirm(`Mark ${AFN(b.owedAmount)} paid to ${b.name}?`)) return;
        btn.disabled = true; btn.textContent='…';
        try{ await httpsCallable(fns,'recordProviderPayout')({ providerId:b.providerId });
          bals.splice(bals.indexOf(b),1); drawBal(); }
        catch(e){ alert(e.message); btn.disabled=false; btn.textContent='Mark paid'; }
      });
    };
    drawBal();

    // Refunds
    const rSnap = await getDocs(collection(db,'refund_requests'));
    const refunds = [];
    rSnap.forEach(d => { const r=d.data(); if(r.status==='PENDING') refunds.push({ id:d.id, ...r,
      cust: names[r.customerId]||r.customerId }); });
    const rel = $('refunds');
    const drawRef = () => {
      rel.innerHTML = refunds.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Amount</th><th>To</th><th>Date</th><th></th></tr></thead><tbody>` +
        refunds.map((r,i)=>`<tr>
          <td class="name">${AFN(r.amount)}</td>
          <td>${esc(r.cust)}</td>
          <td>${fmtDate(r.createdAt)}</td>
          <td style="text-align:right"><button class="btn-sm" style="background:var(--rose)" data-ref="${i}">Mark refunded</button></td>
        </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">No pending refunds</div>`;
      rel.querySelectorAll('[data-ref]').forEach(btn => btn.onclick = async () => {
        const r = refunds[+btn.dataset.ref];
        if(!confirm(`Mark ${AFN(r.amount)} as refunded?`)) return;
        btn.disabled = true; btn.textContent='…';
        try{ await httpsCallable(fns,'recordRefundProcessed')({ refundRequestId:r.id });
          refunds.splice(refunds.indexOf(r),1); drawRef(); }
        catch(e){ alert(e.message); btn.disabled=false; btn.textContent='Mark refunded'; }
      });
    };
    drawRef();
  }catch(e){ $('balances').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ── Promo codes ────────────────────────────────────────────────────────────────
function renderPromo(){
  $('view').innerHTML = `
    <div class="section-title">Create / update a promo code</div>
    <div class="card" style="padding:16px;max-width:520px;margin-bottom:22px">
      <div id="pflash"></div>
      <input id="pcode" class="field" placeholder="CODE (e.g. WELCOME10)" />
      <div style="display:flex;gap:8px">
        <input id="ppct" class="field" type="number" placeholder="% off" />
        <input id="pamt" class="field" type="number" placeholder="or AFN off" />
      </div>
      <input id="pmax" class="field" type="number" placeholder="Max uses (0 = unlimited)" />
      <button id="psave" class="btn">Save code</button>
    </div>
    <div class="section-title">Existing codes</div>
    <div id="plist"><div class="empty">Loading…</div></div>`;
  $('psave').onclick = async () => {
    const code = $('pcode').value.trim().toUpperCase();
    if(code.length < 3){ alert('Code must be at least 3 characters'); return; }
    const pct = parseInt($('ppct').value)||0, amt = parseInt($('pamt').value)||0, max = parseInt($('pmax').value)||0;
    if(pct<=0 && amt<=0){ alert('Set a percentage or a fixed amount'); return; }
    $('psave').disabled = true; $('psave').textContent='Saving…';
    try{
      await httpsCallable(fns,'upsertPromoCode')({ code, discountPercent:pct, discountAmount:amt, maxUses:max, expiresAt:0, active:true });
      $('pflash').innerHTML = `<div class="flash">Saved ✓</div>`;
      $('pcode').value=$('ppct').value=$('pamt').value=$('pmax').value='';
    }catch(e){ $('pflash').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    finally{ $('psave').disabled=false; $('psave').textContent='Save code'; }
  };
  unsub.push(onSnapshot(collection(db,'promo_codes'), snap => {
    const rows = []; snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
    const el = $('plist'); if(!el) return;
    el.innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Code</th><th>Discount</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody>` +
      rows.map(p => `<tr>
        <td class="name">${esc(p.code||p.id)}</td>
        <td>${p.discountPercent>0?p.discountPercent+'% off':''}${p.discountAmount>0?AFN(p.discountAmount)+' off':''}</td>
        <td>${p.usedCount||0}${p.maxUses>0?'/'+p.maxUses:''}</td>
        <td>${p.active?'<span class="pill ok">active</span>':'<span class="pill info">off</span>'}</td>
        <td style="text-align:right"><button class="btn-sm" style="background:${p.active?'var(--muted)':'var(--green)'}"
          data-tog="${esc(p.code||p.id)}" data-act="${p.active?'0':'1'}">${p.active?'Disable':'Enable'}</button></td>
      </tr>`).join('') + `</tbody></table></div>` : `<div class="empty">No promo codes yet</div>`;
    el.querySelectorAll('[data-tog]').forEach(b => b.onclick = () =>
      httpsCallable(fns,'setPromoActive')({ code:b.dataset.tog, active:b.dataset.act==='1' }).catch(e=>alert(e.message)));
  }, err => { const el=$('plist'); if(el) el.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}

// ── Reports (flagged customers) ─────────────────────────────────────────────────
function renderReports(){
  unsub.push(onSnapshot(query(collection(db,'customer_reports'), where('flagged','==',true)), snap => {
    const rows = []; snap.forEach(d => { const r=d.data(); if(r.status==='OPEN') rows.push({ id:d.id, ...r }); });
    rows.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(!rows.length){ $('view').innerHTML = `<div class="empty">No flagged reports 🎉</div>`; return; }
    $('view').innerHTML = `<div class="section-title">Flagged customer reports (${rows.length})</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Customer</th><th>Salon</th><th>Rating</th><th>Flag</th><th>Date</th><th></th></tr></thead>
        <tbody>` + rows.map(r => `<tr>
          <td><div class="name">${esc(r.customerName||r.customerId)}</div>${r.comment?`<div style="color:var(--muted);font-size:11.5px;margin-top:2px;font-style:italic">"${esc(r.comment)}"</div>`:''}</td>
          <td>${esc(r.salonName||'—')}</td>
          <td>${r.rating>0?'★ '+r.rating:'—'}</td>
          <td>${r.noShow?'<span class="pill warn">no-show</span>':'<span class="pill bad">flagged</span>'}</td>
          <td>${fmtDate(r.createdAt)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn-sm" style="background:var(--muted)" data-dis="${r.id}">Dismiss</button>
            <button class="btn-sm" style="background:var(--red);margin-left:6px" data-sus="${r.id}">Suspend</button>
          </td>
        </tr>`).join('') + `</tbody></table></div>`;
    const resolve = (id, suspend) =>
      httpsCallable(fns,'resolveCustomerReport')({ reportId:id, suspend }).catch(e=>alert(e.message||'Failed'));
    $('view').querySelectorAll('[data-dis]').forEach(b => b.onclick = () => resolve(b.dataset.dis, false));
    $('view').querySelectorAll('[data-sus]').forEach(b => b.onclick = () => {
      if(confirm('Suspend this customer?')) resolve(b.dataset.sus, true);
    });
  }, err => { $('view').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}
</script>
