<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SafeBeauty · Admin Console</title>
<style>
  /* ============================================================
     SafeBeauty Admin — design system (light + dark)
     Every legacy class name is preserved so the app JS keeps working;
     this is a visual overhaul, not a structural one.
     ============================================================ */
  :root{
    /* brand accents (shared by both themes) */
    --rose:#B76E79; --deep:#8B3A47; --plum:#7A2F3D; --blush:#F9CBDA;
    --gold:#D4A853; --green:#3fa14a; --red:#C0392B;
    /* status TEXT inks — tuned to pass WCAG 4.5:1 on their tinted pill/flash
       backgrounds in each theme (the raw accent colors above fail as text) */
    --ok-ink:#256b2e; --warn-ink:#77571a; --bad-ink:#a93226;
    --grad:linear-gradient(120deg,#EBA9C0,#B76E79 55%,#7A2F3D);
    /* light surfaces */
    --bg1:#FFF7FB; --bg2:#FDEAF3; --bg3:#F3E6F5;
    --panel:rgba(255,255,255,.66); --panel-solid:#ffffff;
    --card:#ffffff; --surface:#FDEFF6; --petal:#FCE4EF; --lilac:#E9D5F0; --cream:#FFF7FB;
    --ink:#3f3237; --muted:#9c8890; --line:#EFD5E1; --hover:#FFF9FC;
    --shadow:0 4px 20px rgba(139,58,71,.06);
    --shadow-md:0 8px 26px rgba(139,58,71,.10);
    --shadow-lg:0 22px 60px rgba(139,58,71,.16);
    --ring:rgba(183,110,121,.14);
  }
  :root[data-theme="dark"]{
    --deep:#F6D9E1; --plum:#F0C6D2; --blush:#4d2f39;
    --ok-ink:#7dd087; --warn-ink:#e6c47a; --bad-ink:#f0958a;
    --bg1:#17100f; --bg2:#1e1216; --bg3:#191016;
    --panel:rgba(40,27,33,.62); --panel-solid:#241820;
    --card:#241820; --surface:#2c1e26; --petal:#38262f; --lilac:#3a2a3f; --cream:#221820;
    --ink:#F1E6EB; --muted:#B79AA5; --line:#3a2831; --hover:#2a1c24;
    --shadow:0 4px 20px rgba(0,0,0,.36);
    --shadow-md:0 10px 30px rgba(0,0,0,.44);
    --shadow-lg:0 24px 64px rgba(0,0,0,.55);
    --ring:rgba(235,169,192,.20);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{background:
      radial-gradient(1100px 600px at 100% -10%,rgba(235,169,192,.18),transparent 60%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    background-attachment:fixed;transition:background .3s ease,color .3s ease}
  button{font-family:inherit;cursor:pointer;border:none}
  input,textarea{font-family:inherit}
  .hidden{display:none !important}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--rose);background-clip:content-box}

  /* ── Login ─────────────────────────────────────────────────────── */
  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg)}
  #login .card{width:100%;max-width:392px;padding:40px 34px 34px;text-align:center;position:relative;overflow:hidden}
  #login .card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad)}
  .logo{width:74px;height:74px;border-radius:24px;margin:2px auto 16px;
        background:var(--grad);box-shadow:0 12px 30px rgba(183,110,121,.42);
        display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
  h1{margin:0;font-size:25px;background:var(--grad);
     -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:12px;margin:5px 0 24px;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
  .field{width:100%;padding:12px 15px;border:1.5px solid var(--line);border-radius:13px;font-size:13.5px;
    margin-bottom:11px;background:var(--panel-solid);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  .field::placeholder{color:var(--muted);opacity:.8}
  .field:focus{border-color:var(--rose);box-shadow:0 0 0 4px var(--ring)}
  .btn{width:100%;padding:13px;border-radius:13px;font-size:14px;font-weight:700;color:#fff;letter-spacing:.01em;
       background:var(--grad);box-shadow:0 8px 20px rgba(183,110,121,.32);transition:transform .12s,box-shadow .15s,opacity .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(183,110,121,.4)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
  .btn-ghost{background:var(--petal);color:var(--deep);font-weight:700;box-shadow:none}
  .btn-ghost:hover{transform:none;box-shadow:none;opacity:.9}
  .btn-sm{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;transition:transform .12s,opacity .15s;box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .btn-sm:hover{opacity:.92;transform:translateY(-1px)}
  .btn-sm:active{transform:none}
  .btn-sm:disabled{opacity:.55}
  .err{color:var(--bad-ink);font-size:12.5px;min-height:18px;margin-top:8px;font-weight:600}

  /* ── Shell ─────────────────────────────────────────────────────── */
  #app{height:100vh;display:flex;overflow:hidden}
  .sidebar{width:224px;flex-shrink:0;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:20px 13px}
  .langpick{display:flex;gap:5px;margin-bottom:9px}
  .langpick button{flex:1;padding:6px 4px;border:none;border-radius:9px;cursor:pointer;
    font-family:inherit;font-size:11.5px;font-weight:800;background:var(--surface);color:var(--muted);
    transition:background .15s,color .15s}
  .langpick button:hover{color:var(--deep)}
  .langpick button.on{background:var(--rose);color:#fff}
  .sidebar .brand{font-size:19px;font-weight:800;padding:2px 10px 2px;letter-spacing:-.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .who2{font-size:11px;color:var(--muted);padding:2px 10px 16px;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;margin:0 -3px;padding:0 3px}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;width:100%;
    color:var(--muted);font-weight:600;font-size:13px;background:transparent;text-align:start;
    transition:background .14s,color .14s,transform .1s}
  .navitem:hover{background:var(--petal);color:var(--deep)}
  .navitem:active{transform:scale(.98)}
  .navitem.active{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(183,110,121,.34);font-weight:700}
  .navitem .ico{font-size:15px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;background:var(--surface);flex-shrink:0;transition:background .14s}
  .navitem.active .ico{background:rgba(255,255,255,.22)}
  .sidebar .foot{padding-top:12px;margin-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .theme-toggle{width:100%;padding:9px;border-radius:11px;background:var(--petal);color:var(--deep);
    font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
  .theme-toggle:hover{opacity:.88}
  .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{padding:17px 30px;border-bottom:1px solid var(--line);background:var(--panel);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:18px;font-weight:800;color:var(--deep);letter-spacing:-.02em}
  main{flex:1;overflow-y:auto;padding:24px 30px 56px;max-width:1120px;width:100%;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ── Stat cards ────────────────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
  .stat{padding:18px 18px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);
    box-shadow:var(--shadow);transition:transform .14s,box-shadow .14s;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,var(--ring),transparent 70%);pointer-events:none}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
  .stat .ico{font-size:18px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    border-radius:12px;background:var(--surface);margin-bottom:12px}
  .stat .n{font-size:30px;font-weight:800;color:var(--deep);line-height:1;letter-spacing:-.02em}
  .stat .l{color:var(--muted);font-size:12px;margin-top:5px;font-weight:600}

  /* ── Rows / tickets ────────────────────────────────────────────── */
  .row{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 16px;margin-bottom:9px;box-shadow:var(--shadow)}
  .row h3{margin:0 0 2px;font-size:14px;color:var(--deep);font-weight:700}
  .row .meta{color:var(--muted);font-size:12px;line-height:1.5}
  .row .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  @media(min-width:680px){
    .row:not(.ticket){padding-inline-end:168px}
    .row:not(.ticket) .actions{position:absolute;top:13px;right:15px;margin-top:0;flex-direction:column;align-items:stretch;width:142px}
    .row .actions .btn-sm{width:100%}
  }
  .row.ticket{padding-inline-end:16px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;vertical-align:middle}
  .badge.dot{background:rgba(192,57,43,.14);color:var(--bad-ink)}
  .empty{text-align:center;color:var(--muted);padding:56px 10px;font-size:13.5px;font-weight:600}
  .section-title{font-size:11px;color:var(--rose);font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin:4px 0 13px}

  /* ── Tables ────────────────────────────────────────────────────── */
  .tbl-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
  .tbl{width:100%;border-collapse:collapse;background:transparent;min-width:560px}
  .tbl th{text-align:start;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:800;padding:12px 17px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap;
    position:sticky;top:0;z-index:1}
  .tbl td{padding:12px 17px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr{transition:background .1s}
  .tbl tbody tr:hover{background:var(--hover)}
  .tbl .name{font-weight:700;color:var(--deep)}
  .pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .pill.ok{background:rgba(63,161,74,.16);color:var(--ok-ink)}
  .pill.warn{background:rgba(212,168,83,.22);color:var(--warn-ink)}
  .pill.bad{background:rgba(192,57,43,.15);color:var(--bad-ink)}
  .pill.info{background:var(--surface);color:var(--rose)}

  /* ── Forms / flash ─────────────────────────────────────────────── */
  textarea.field{min-height:110px;resize:vertical;line-height:1.55}
  .flash{background:rgba(63,161,74,.14);color:var(--ok-ink);border-radius:12px;padding:11px 15px;font-size:12.5px;
    margin-bottom:12px;font-weight:700;border:1px solid rgba(63,161,74,.2)}

  /* ── Support chat ──────────────────────────────────────────────── */
  .support-wrap{display:grid;grid-template-columns:330px 1fr;gap:16px}
  @media(max-width:820px){.support-wrap{grid-template-columns:1fr}}
  .ticket{cursor:pointer;transition:box-shadow .14s,transform .1s}
  .ticket:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .ticket.sel{outline:2px solid var(--rose);outline-offset:-1px}
  .chat{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;
    min-height:452px;box-shadow:var(--shadow);overflow:hidden}
  .chat .msgs{flex:1;padding:18px;overflow-y:auto;max-height:472px;display:flex;flex-direction:column;gap:10px}
  .bubble{max-width:74%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .bubble.them{align-self:flex-start;background:var(--surface);color:var(--ink);border-bottom-left-radius:5px}
  .bubble.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:5px;box-shadow:0 4px 12px rgba(183,110,121,.28)}
  .bubble .t{display:block;font-size:10px;opacity:.7;margin-top:3px}
  .composer{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:var(--panel)}
  .composer input{flex:1;margin:0}
  .chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600}

  /* ── Modal (admin actions) ─────────────────────────────────────── */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,10,15,.5);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:22px;z-index:50;animation:fade .18s ease}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);
    width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:24px 24px 22px}
  .modal h2{margin:0 0 3px;font-size:18px;color:var(--deep);font-weight:800}
  .modal .msub{color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:16px}
  .modal .mgroup{border-top:1px solid var(--line);padding:15px 0 4px;margin-top:6px}
  .modal .mglabel{font-size:11px;font-weight:800;color:var(--rose);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .modal .field{margin-bottom:9px}
  /* Side-by-side field pair. Defined globally (not only inside .modal) because
     the Salons and Admins tabs use it on the page too; when it was modal-scoped
     those fields silently stacked into one column. Wraps on narrow screens. */
  .mrow{display:flex;gap:8px;flex-wrap:wrap}
  .mrow .field{flex:1 1 200px;margin-bottom:9px}
  .modal .mrow{flex-wrap:nowrap}
  .modal .mrow .field{flex:1;margin-bottom:0}
  .mflash{font-size:12.5px;font-weight:700;margin:2px 0 8px;min-height:16px}
  .mflash.ok{color:var(--ok-ink)}
  .mflash.bad{color:var(--bad-ink)}
  .modal .mclose{margin-top:16px;width:100%;background:var(--surface);color:var(--deep)}

  /* ── Accessibility ─────────────────────────────────────────────── */
  .navitem:focus-visible,.btn:focus-visible,.btn-sm:focus-visible,
  .theme-toggle:focus-visible,.pw-toggle:focus-visible,.ticket:focus-visible{
    outline:2px solid var(--rose);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* ── Password show/hide (login) ────────────────────────────────── */
  .pw-wrap{position:relative;margin-bottom:11px}
  .pw-wrap .field{margin-bottom:0;padding-inline-end:44px}
  .pw-toggle{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);
    background:transparent;color:var(--muted);font-size:15px;padding:5px 7px;border-radius:9px;line-height:1}
  .pw-toggle:hover{background:var(--petal)}

  /* ── Responsive: collapse the sidebar to a top rail on narrow windows ── */
  @media(max-width:720px){
    #app{flex-direction:column}
    /* Brand + footer buttons share the top line; the nav drops to its own
       full-width line below and scrolls horizontally, so all 12 tabs stay
       reachable instead of being crushed into a sliver beside Sign out. */
    .sidebar{width:100%;flex-flow:row wrap;align-items:center;gap:8px;padding:10px 12px;
      border-inline-end:none;border-bottom:1px solid var(--line)}
    .sidebar .brand{white-space:nowrap;margin-inline-end:auto}
    .who2{display:none}
    .nav{order:3;flex:1 0 100%;flex-direction:row;gap:4px;overflow-x:auto;
      -webkit-overflow-scrolling:touch;padding-bottom:2px}
    .navitem{width:auto;white-space:nowrap;padding:8px 11px;flex:0 0 auto}
    .sidebar .foot{border-top:none;padding-top:0;margin-top:0;flex-direction:row;gap:8px}
    .theme-toggle{width:auto;padding:9px 11px}
    main{padding:18px 16px 44px}
    .topbar{padding:14px 18px;font-size:16px}
  }
</style>
<script>
  /* Apply the saved / system theme before first paint (no flash), and expose a
     global toggle for the sidebar button. Kept outside the Firebase module so
     it is available immediately and independent of sign-in. */
  (function(){
    try{
      var saved = localStorage.getItem('sb-theme') ||
              (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', saved);
    }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
  })();
  function toggleTheme(){
    var el = document.documentElement;
    var next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    el.setAttribute('data-theme', next);
    try{ localStorage.setItem('sb-theme', next); }catch(e){}
    var b = document.getElementById('themeToggle');
    if(b) b.innerHTML = next === 'dark' ? '☀︎ Light mode' : '☾ Dark mode';
  }
</script>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────────── -->
<div id="login">
  <div class="card">
    <div class="logo">❀</div>
    <h1>SafeBeauty</h1>
    <div class="sub">Admin Console</div>
    <input id="lp" class="field" type="tel" placeholder="Phone (e.g. +93700…)" data-i18n-ph="ph_phoneEG93700" autocomplete="username" />
    <div class="pw-wrap">
      <input id="lw" class="field" type="password" placeholder="Password" data-i18n-ph="ph_password" autocomplete="current-password" />
      <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false"
        onclick="var i=document.getElementById('lw'),s=i.type==='password';i.type=s?'text':'password';this.textContent=s?'🙈':'👁';this.setAttribute('aria-pressed',s);i.focus()">👁</button>
    </div>
    <button id="lbtn" class="btn" data-i18n="btn_signIn">Sign in</button>
    <button id="lbio" class="btn btn-ghost hidden" style="margin-top:10px" data-i18n="btn_signInWithTouchId">☝ Sign in with Touch ID</button>
    <label id="lrem" class="hidden" style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;font-size:13px;color:var(--rose);cursor:pointer">
      <input type="checkbox" id="lremc" /> Remember me with Touch ID
    </label>
    <div id="lerr" class="err"></div>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">SafeBeauty ❀</div>
    <div class="who2" id="who"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="langpick" id="langpick">
        <button data-lang="fa">دری</button>
        <button data-lang="ps">پښتو</button>
        <button data-lang="en" data-i18n="btn_en">EN</button>
      </div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" data-i18n="darkMode">☾ Dark mode</button>
      <button class="btn-sm" id="logout" style="width:100%;background:var(--rose)" data-i18n="btn_signOut">Sign out</button>
    </div>
  </aside>
  <div class="main-area">
    <div class="topbar" id="topbar">Statistics</div>
    <main id="view"></main>
  </div>
</div>

<!-- ── Modal host (admin actions) ─────────────────────────────────────────── -->
<div id="modal" class="modal-overlay hidden"></div>

<script>
  /* Sync the toggle's label to the theme resolved before paint. */
  (function(){
    var el = document.getElementById('themeToggle');
    if(el) el.innerHTML =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀︎ Light mode' : '☾ Dark mode';
  })();
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut }

import { getFirestore, collection, query, where, orderBy, limit, getDocs, getDoc, doc,
         setDoc, updateDoc, addDoc, deleteDoc, onSnapshot, getCountFromServer, documentId }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getFunctions, httpsCallable }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject, getBlob }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const firebaseConfig = {
  apiKey: "AIzaSyBZG_ltbYVsaZkPyGQ_NozOQvo3JeuO2mQ",
  authDomain: "safebeauty.firebaseapp.com",
  projectId: "safebeauty",
  storageBucket: "safebeauty.firebasestorage.app",
  messagingSenderId: "238802374530",
  appId: "1:238802374530:android:f2617130bc9a9644b3c99b"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Phone normalization (mirrors PhoneUtils.normalizeForLogin) ──────────────
function clean(raw){ const v=raw.trim(); const plus=v.startsWith('+'); const d=v.replace(/\D/g,''); return plus?'+'+d:d; }
function normalizeAfghan(raw){
  let c=clean(raw);
  if(c.startsWith('+93')) return c;
  if(c.startsWith('0093')) return '+93'+c.slice(4);
  if(c.startsWith('93')&&c.length>=11) return '+'+c;
  c=c.replace(/^\+/,''); if(c.startsWith('0')) c=c.slice(1);
  return '+93'+c;
}
function normalizeForLogin(raw){ const c=clean(raw); return c.startsWith('+')?c:normalizeAfghan(raw); }

// ── PBKDF2 auth-password derivation (mirrors PinHasher.deriveAuthPassword) ───
function b64ToBytes(b64){ const s=atob(b64); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }
function bytesToB64(b){ let s=''; for(const x of b) s+=String.fromCharCode(x); return btoa(s); }
async function deriveAuthPassword(pin, saltB64){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode('AUTH:'+pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:b64ToBytes(saltB64), iterations:65536, hash:'SHA-256' }, key, 256);
  return bytesToB64(new Uint8Array(bits));
}

// direction driven off the chosen language.
//
// Two rules about what gets translated, because getting this wrong makes an
// operator's job harder rather than easier:
//
//   · Prose is translated — labels, buttons, hints, empty states, the sentences
//     that explain what a button will do.
//   · Machine tokens are not — PAID, AWAITING_PAYMENT, FAILED_PRECONDITION, a
//     collection name, a booking code. Those are what the logs say, what the
//     error messages say, and what you would paste into a search. Translating
//     them severs the console from everything else you would look at next.
//
// A missing key returns the key itself rather than blank, so a gap shows up as
// something obviously wrong instead of an empty button.

  hint_categoryAndNeighbourhoodFilters: {en:'Category and neighbourhood filters compare against fields derived from what each salon typed. Until a salon has them, its chips match nothing — a customer searching for nails sees "no providers found" while a nail salon sits on the previous screen. Anything that cannot be resolved confidently is listed below for you to decide, never guessed.', fa:'فیلترهای دسته‌بندی و ناحیه با فیلدهایی مقایسه می‌شوند که از نوشته‌های خود سالن استخراج شده‌اند. تا وقتی سالنی این فیلدها را نداشته باشد، برچسب‌های فیلترش با هیچ جستجویی مطابقت نمی‌کند — مشتری‌ای که دنبال خدمات ناخن می‌گردد «ارائه‌دهنده‌ای یافت نشد» می‌بیند، در حالی که یک سالن ناخن درست در صفحه قبل وجود دارد. هر موردی که با اطمینان قابل تشخیص نباشد هرگز حدس زده نمی‌شود؛ در پایین فهرست می‌شود تا شما تصمیم بگیرید.', ps:'د کټګورۍ او سیمې فلټرونه له هغو ساحو سره پرتله کیږي چې د هر سالون له لیکلو څخه استخراج شوې دي. تر څو چې یو سالون دا ساحې ونه لري، د هغه د فلټر نښې له هیڅ لټون سره سمون نه خوري — هغه پیرودونکی چې د نوکانو لټون کوي، «هیڅ وړاندې کوونکی ونه موندل شو» ویني، حال دا چې د نوکانو یو سالون همدا اوس په تېره پرده کې شته. هر هغه څه چې په ډاډ سره ونه ټاکل شي، هیڅکله اټکل نه کیږي؛ لاندې لیست کیږي څو تاسو پرې پرېکړه وکړئ.'},

  hint_olderThanGraceMinutes: {en:(a0)=>`Older than ${a0} minutes. Most are customers who closed the checkout and owe nothing. The ones that matter are those where HesabPay took the money and the webhook never arrived — check the reference on your HesabPay dashboard before settling. Settling runs exactly the same code a webhook does, so settling one twice cannot pay a salon twice.`, fa:(a0)=>`از آغاز این پرداخت‌ها بیش از ${a0} دقیقه گذشته است. بیشتر این موارد مشتریانی هستند که صفحهٔ پرداخت را بسته‌اند و بدهی‌ای ندارند. موارد مهم آن‌هایی هستند که HesabPay پول را گرفته اما وب‌هوک هرگز نرسیده است — پیش از تسویه، شمارهٔ مرجع را در داشبورد HesabPay خود بررسی کنید. تسویه دقیقاً همان کدی را اجرا می‌کند که وب‌هوک اجرا می‌کند، بنابراین تسویهٔ دوبارهٔ یک مورد نمی‌تواند دو بار به سالن پرداخت کند.`, ps:(a0)=>`د دې تادیو له پیل څخه له ${a0} دقیقو زیاته موده تېره ده. ډېری یې هغه پېرودونکي دي چې د تادیې پاڼه یې بنده کړې ده او هیڅ پور نه لري. مهمې هغه دي چې HesabPay پیسې اخیستې دي خو وېب‌هوک هیڅکله نه دی راغلی — تر تسویې مخکې په خپل HesabPay ډشبورډ کې د مرجع شمېره وګورئ. تسویه کول هماغه کوډ چلوي چې وېب‌هوک یې چلوي، نو که یوه تادیه دوه ځله تسویه شي، سالون ته پیسې دوه ځله نه ورکول کېږي.`},

  hint_derivedLookupKeys: {en:'Accounts write two derived lookup keys: the phone key that resolves a sign-in to a single indexed read, and the name key the user search matches on. A trigger keeps both current, but it only fires on a write — an account nobody has touched since a key was introduced simply does not have it, and is then unfindable by that key. This fills in what is missing. Safe to run repeatedly; reports any two accounts that share a number.', fa:'برای هر حساب دو کلید جستجو نوشته می‌شود که از خود حساب استخراج شده‌اند: کلید شماره تلفن که ورود را به یک بار خواندن از ایندکس تبدیل می‌کند، و کلید نام که جستجوی کاربران با آن مطابقت داده می‌شود. یک روال خودکار هر دو را به‌روز نگه می‌دارد، اما فقط هنگام نوشتن اجرا می‌شود — حسابی که از زمان افزوده‌شدن یک کلید کسی به آن دست نزده باشد، آن کلید را ندارد و دیگر با آن کلید پیدا نمی‌شود. این دکمه موارد جاافتاده را تکمیل می‌کند. اجرای چندبارهٔ آن بی‌خطر است؛ اگر دو حساب یک شماره داشته باشند، گزارش می‌دهد.', ps:'د هر حساب لپاره د لټون دوه استخراج شوي کلیدونه لیکل کیږي: د تلیفون شمېرې کلید چې ننوتل یوې واحدې ایندکس شوې لوستنې ته اړوي، او د نوم کلید چې د کاروونکو لټون ورسره سمون خوري. یوه اتوماتیکه کړنلاره دواړه تازه ساتي، خو یوازې د لیکلو پر مهال چلیږي — هغه حساب چې د یوه کلید له زیاتېدو راهیسې چا ورته لاس نه دی وروړی، هغه کلید نه لري او بیا د هغه کلید له مخې نه پیدا کیږي. دا تڼۍ هغه څه بشپړوي چې کم دي. څو ځله یې چلول خطر نه لري؛ که دوه حسابونه یوه شمېره ولري، راپور یې ورکوي.'},
  hint_inviteCodeBackfill: {en:'The invite card in a customer\'s profile is the only place in the app that shares SafeBeauty itself, and it renders nothing at all when the account has no invite code &mdash; no card, no message. Codes are written at registration and only since the referral programme shipped in July, so every account older than that has none and cannot invite anyone. Safe to run repeatedly; it only touches accounts that still have no code, and reports any two that wanted the same one. Two things to expect on the first run: every account it touches also has its login and search keys re-derived by a background trigger, which is how they get filled in at last &mdash; and any two old accounts registered under one phone number surface as errors while that happens. Enough of them at once will trip the &ldquo;function errors are spiking&rdquo; alert. That is the backfill finding them, not a failure.', fa:'کارت دعوت در پروفایل مشتری تنها جایی در اپ است که خودِ SafeBeauty را معرفی می‌کند، و وقتی حساب کد دعوت نداشته باشد اصلاً چیزی نشان نمی‌دهد &mdash; نه کارتی، نه پیامی. کدها هنگام ثبت‌نام نوشته می‌شوند، آن هم فقط از زمانی که برنامهٔ دعوت در ماه جولای راه‌اندازی شد؛ بنابراین هر حسابی که قدیمی‌تر از آن باشد کد ندارد و نمی‌تواند کسی را دعوت کند. اجرای چندبارهٔ آن بی‌خطر است؛ فقط حساب‌هایی را تغییر می‌دهد که هنوز کد ندارند، و اگر دو حساب یک کد را خواسته باشند گزارش می‌دهد. در اجرای نخست انتظار دو چیز را داشته باشید: کلیدهای ورود و جستجوی هر حسابی که این دکمه به آن دست می‌زند، توسط یک روال خودکار در پس‌زمینه دوباره استخراج می‌شوند و سرانجام به همین شکل تکمیل می‌گردند &mdash; و در همان حال، هر دو حساب قدیمی که زیر یک شماره تلفن ثبت شده باشند به‌صورت خطا ظاهر می‌شوند. اگر تعدادشان در یک زمان زیاد باشد، هشدار «خطاهای فانکشن به‌شدت در حال افزایش است» فعال می‌شود. این یعنی همین دکمه دارد آن‌ها را پیدا می‌کند، نه اینکه خرابی‌ای رخ داده باشد.', ps:'د پیرودونکي په پروفایل کې د بلنې کارت په اپ کې یوازینی ځای دی چې پخپله SafeBeauty معرفي کوي، او کله چې حساب د بلنې کوډ ونه ل function t(key, ...args){
  const e = STR[key];
  if(!e) return key;
  const v = (e[lang] != null) ? e[lang] : e.en;
  return (typeof v === 'function') ? v(...args) : v;
}

function applyLangDir(){
  document.documentElement.lang = lang;
  document.documentElement.dir  = (lang === 'en') ? 'ltr' : 'rtl';
}

// Walks the markup rather than rebuilding it. data-i18n leaves the English in
// the HTML as the fallback, so a key that does not exist yet degrades to the
// text that was always there instead of to nothing.
function paintStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if(STR[k]) el.textContent = t(k);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const k = el.dataset.i18nPh;
    if(STR[k]) el.placeholder = t(k);
  });
  document.querySelectorAll('#langpick button').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === lang));
  // The theme button's label depends on the theme, not only the language, so it
  // cannot be a plain data-i18n row.
  const tb = $('themeToggle');
  if(tb) tb.textContent = document.documentElement.getAttribute('data-theme') === 'dark'
    ? t('lightMode') : t('darkMode');
}

function setLang(next){
  if(!LANGS.includes(next)) return;
  lang = next;
  try { localStorage.setItem('sb-admin-lang', next); } catch(e){}
  applyLangDir();
  paintStatic();
  // Only once the operator is actually inside — before login there is no nav.
  if (!$('app').classList.contains('hidden')) {
    renderNav();
    // The open tab is re-rendered rather than translated in place: its content
    // is built from template literals, and a half-repainted screen is worse
    // than a brief blank one.
    selectTab(activeTab);
  }
}

// provider_balances.owedAmount, read the way the Finance tab already reads it:
// positive means the platform owes the salon, negative means the salon owes the
// platform, because every cash booking debits its commission and nothing clears
// it. The dossier used to read `.owed`, a field no writer has ever written, so
// this line said "0 AFN owed" for every salon on the platform — sitting directly
// above the input that adjusts the balance.
function balanceLine(v) {
  const n = Number(v || 0);
  if (n === 0) return t('bal_settled');
  return n > 0 ? t('bal_owedToSalon', AFN(Math.abs(n)))
               : t('bal_owedToPlatform', AFN(Math.abs(n)));
}

// Anything a modal needs to release on the way out registers here — the KYC
// blob URLs, today. The backdrop click and Escape call hideModal directly, so
// per-modal close buttons are not the only exit and cannot be the only cleanup.
let modalCleanups = [];
function onModalClose(fn){ modalCleanups.push(fn); }
function showModal(html){
  modalCleanups = [];

}

/** Firebase surfaces unhandled/transport failures as bare code strings
 *  ("internal", "unavailable", …). Map those to human messages; real typed
 *  HttpsError messages from our own functions pass through untouched. */
function fnError(e){
  const raw = String((e && e.message) || 'Failed.');
  const map = {
    'internal':          'Server error — please try again in a moment. If it keeps happening, tell the developer (the function may need redeploying).',
    'unavailable':       'Network problem — check your connection and try again.',
    'deadline-exceeded': 'The server took too long to respond — try again.',
    'unauthenticated':   'Your session has expired — sign out and back in.',
    'not-found':         'That server function was not found — the backend may need redeploying.',
  };
  return map[raw.toLowerCase()] || raw;
}

/** Call an admin Cloud Function, showing a busy/result state on [btn] and a
 *  message in the [flashId] element. Returns true on success. */
async function callFn(name, payload, btn, flashId, okMsg){
  const flash = flashId ? $(flashId) : null;
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Working…'; }
  if(flash){ flash.className='mflash'; flash.textContent=''; }
  try{
    await httpsCallable(fns, name)(payload);
    if(flash){ flash.className='mflash ok'; flash.textContent = okMsg || 'Done ✓'; }
    return true;
  }catch(e){
    const msg = fnError(e);
    if(flash){ flash.className='mflash bad'; flash.textContent = msg; }
    else alert(msg);
    return false;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
}

async function doLogin(){
  const phone = normalizeForLogin($('lp').value);
  const pw = $('lw').value;
  $('lerr').textContent = '';
  if(!phone || !pw){ $('lerr').textContent='Enter phone and password.'; return; }
  $('lbtn').disabled = true; $('lbtn').textContent = 'Signing in…';
  try{
    const res = await httpsCallable(fns,'authenticateWithPassword')({ phone, password: pw });
    const m = res.data || {};
    if(m.mode !== 'REAL'){ throw new Error('Invalid phone or password.'); }
    if((m.role||'') !== 'ADMIN'){ throw new Error('This account is not an administrator.'); }
    const authPw = await deriveAuthPassword(pw, m.salt || '');
    await signInWithEmailAndPassword(auth, m.firebaseEmail, authPw);
    await httpsCallable(fns,'syncUidMap')({ appUid: m.uid });
    // Save the credential for Touch ID if opted in (desktop app only).
    if (window.electronBiometric && $('lremc') && $('lremc').checked) {
      try { await window.electronBiometric.save(phone, pw); } catch(_){}
    }
    admin = { uid: m.uid, name: m.name || 'Admin' };
    enterApp();
  }catch(e){
    $('lerr').textContent = (e && e.message) ? e.message : 'Sign-in failed.';
  }finally{
    $('lbtn').disabled = false; $('lbtn').textContent = 'Sign in';
  }
}

(async function setupBiometric(){
  const bio = window.electronBiometric;
  if(!bio) return;                                   // plain browser → skip
  let avail = false; try{ avail = await bio.available(); }catch(_){}
  if(!avail) return;                                 // no Touch ID hardware/enrollment
  $('lrem').classList.remove('hidden');              // offer "remember me"
  let has = false; try{ has = await bio.has(); }catch(_){}
  if(has){
    const b = $('lbio');
    b.classList.remove('hidden');
    b.onclick = async () => {

      if(cred && cred.phone && cred.password){

        doLogin();
      }
    };
  }
})();

// Rebuilt rather than relabelled when the language changes: the labels live in
// the button markup, and walking them to patch text would have to know the same
// structure this builds. One definition of what a nav item is.
function renderNav(){
  const nav = $('nav');
  nav.innerHTML = '';
  TABS.forEach(tab => {
    const b = document.createElement('button');
    b.className = 'navitem' + (tab.id===activeTab?' active':'');
    if(tab.id===activeTab) b.setAttribute('aria-current','page');
    // t() is the translator now, so the loop variable cannot be called t —
    // inside the callback it would shadow the function entirely.
    b.innerHTML = `<span class="ico">${tab.icon}</span><span>${t('tab_'+tab.id)}</span>`;
    b.onclick = () => selectTab(tab.id);
    nav.appendChild(b);
  });
}
function selectTab(id){
  activeTab = id;
  unsub.forEach(fn => { try{fn();}catch(_){} }); unsub = [];
  const tab = TABS.find(x=>x.id===id);
  [...$('nav').children].forEach((b,i) => {
    const on = TABS[i].id===id;
    b.classList.toggle('active', on);
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  $('topbar').textContent = t('tab_' + tab.id);
  $('view').innerHTML = `<div class="empty">${t('loading')}</div>`;
  tab.render();
}

// ── Stats ────────────────────────────────────────────────────────────────────
async function renderStats(){
  try{
    // Counted server-side. The old version downloaded every user document just
    // to tally six numbers, so opening the dashboard cost one read per user —
    // fine at 20 users, ruinous at 20,000. getCountFromServer bills a fraction
    // of a read regardless of collection size.
    const users = collection(db,'users');
    const countOf = (q) => getCountFromServer(q).then(r => r.data().count).catch(() => '—');
    const [total, providers, customers, pending, suspended, kycPending, salonCount, appts] =
      await Promise.all([
        countOf(users),
        countOf(query(users, where('role','==','PROVIDER'))),
        countOf(query(users, where('role','==','CUSTOMER'))),
        countOf(query(users, where('status','==','PENDING'))),
        // Counted on `suspended`, which is what actually stops an account.
        // Anything suspended from now on carries both fields, so this is exact
        // going forward; an account suspended before today through the old
        // status-only path is enforced (isSuspended reads both) but not counted
        // here, because Firestore cannot ask for "has status, lacks suspended"
        // and counting both queries would double every current row.
        countOf(query(users, where('suspended','==',true))),
        countOf(query(users, where('kycStatus','==','PENDING'))),
        countOf(collection(db,'salons')),
        countOf(collection(db,'appointments')),
      ]);
    const cards = [
      ['👥','Total users', total], ['💇','Providers', providers], ['🧑','Customers', customers],
      ['🏠','Salons', salonCount], ['📅','Appointments', appts],
      ['⏳','Pending approvals', pending], ['🪪','KYC pending', kycPending], ['🚫','Suspended', suspended],
    ];
    $('view').innerHTML =
      `<div class="section-title">${t('sec_platformOverview')}</div><div class="grid">` +
      cards.map(([ic,l,n]) => `<div class="stat"><div class="ico">${ic}</div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('') +
      `</div>`;
  }catch(e){ $('view').innerHTML = `<div class="empty">${t('hint_couldntLoadStats', esc(e.message))}</div>`; }
}

        <thead><tr><th scope="col">${t('th_name')}</th><th scope="col">${t('th_role')}</th><th scope="col">${t('th_phone')}</th><th scope="col"></th></tr></thead>
        <tbody>` + rows.map(u => `<tr>
          <td class="name">${esc(u.name||u.id)}</td>
          <td><span class="pill info">${esc(u.role||'—')}</span></td>
          <td>${esc(u.phone||'—')}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn-sm" style="background:var(--green)" data-ok="${u.id}">${t('btn_approve')}</button>
            <button class="btn-sm" style="background:var(--red);margin-left:6px" data-no="${u.id}">${t('btn_reject')}</button>
          </td>
        </tr>`).join('') + `</tbody></table></div>`;
    const review = (uid, approve, reason='') =>
      httpsCallable(fns,'reviewKyc')({ targetUid: uid, approve, rejectionReason: reason })
        .catch(e => alert(e.message||'Failed'));
    $('view').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => review(b.dataset.ok, true));
    $('view').querySelectorAll('[data-no]').forEach(b => b.onclick = () => {
      const reason = prompt('Rejection reason:',''); if(reason===null) return;
      review(b.dataset.no, false, reason);
    });
  }, err => { $('view').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}

let selectedTicket = null;
let chatUnsub = null;

function renderSupport(){
  $('view').innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button id="tplmanage" class="btn-sm" style="background:var(--petal);color:var(--deep)">${t('btn_messageTemplates')}</button>
    </div>
    <div class="support-wrap">
      <div id="tickets"></div>
      <div id="chat" class="chat"><div class="chat-empty">Select a conversation</div></div>
    </div>`;
  $('tplmanage').onclick = () => openTemplates(null);
  const q = query(collection(db,'support_tickets'), where('status','==','OPEN'));
  unsub.push(onSnapshot(q, snap => {
    const rows = [];
    snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
    rows.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    const el = $('tickets');
    if(!el) return;
    if(!rows.length){ el.innerHTML = `<div class="empty">${t('empty_noOpenSupportRequests')}</div>`; return; }
    el.innerHTML = rows.map(row => `
      <div class="row ticket ${selectedTicket===row.userId?'sel':''}" role="button" tabindex="0" data-uid="${esc(row.userId)}" data-name="${esc(row.userName||row.userId)}">
        <h3>${row.unreadForAdmin?'<span class="badge dot">●</span> ':''}${esc(row.userName||row.userId)}</h3>
        <div class="meta">${esc(row.userRole||'')}${row.relatedInfo?' · '+esc(row.relatedInfo):''}</div>
        <div class="meta">${fmtDate(row.updatedAt)}</div>
      </div>`).join('');
    el.querySelectorAll('.ticket').forEach(r => {
      r.onclick = () => openChat(r.dataset.uid, r.dataset.name);
      r.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); r.click(); } };
    });
  }, err => { const el=$('tickets'); if(el) el.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }));
}

function openChat(userId, name){
  selectedTicket = userId;
  document.querySelectorAll('.ticket').forEach(r => r.classList.toggle('sel', r.dataset.uid===userId));
  updateDoc(doc(db,'support_tickets',userId), { unreadForAdmin:false }).catch(()=>{});
  const chat = $('chat');
  chat.innerHTML = `<div class="msgs" id="msgs"></div>
    <div class="composer">
      <button id="ctpl" class="btn-sm" style="background:var(--petal);color:var(--deep)" title="Insert a saved reply">📋</button>
      <input id="cin" class="field" placeholder="Reply to ${esc(name)}…" />
      <button id="csend" class="btn-sm" style="background:var(--rose)">${t('btn_send')}</button>
      <button id="cclose" class="btn-sm" style="background:var(--petal);color:var(--deep)">${t('btn_closeGeneric')}</button>
    </div>`;
  const convId = 'support_'+userId;
  if(chatUnsub){ try{chatUnsub();}catch(_){} }
  const q = query(collection(db,'chat_messages'), where('conversationId','==',convId));
  chatUnsub = onSnapshot(q, snap => {
    const msgs = [];
    snap.forEach(d => msgs.push(d.data()));
    msgs.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    const box = $('msgs'); if(!box) return;
    box.innerHTML = msgs.map(m => {
      const mine = m.senderId === admin.uid;
      return `<div class="bubble ${mine?'me':'them'}">${esc(m.content)}<span class="t">${fmtDate(m.timestamp)}</span></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  });
  const send = async () => {
    const inp = $('cin'); const text = inp.value.trim(); if(!text) return;
    inp.value='';
    try{
      await addDoc(collection(db,'chat_messages'), {
        conversationId: convId, senderId: admin.uid, senderName:'Support', content:text, timestamp: Date.now()
      });
    }catch(e){ alert(e.message); inp.value=text; }
  };
  $('csend').onclick = send;
  $('ctpl').onclick = () => openTemplates('cin');
  $('cin').addEventListener('keydown', e => { if(e.key==='Enter') send(); });
  $('cclose').onclick = () => {
    if(!confirm('Close this support ticket?')) return;
    updateDoc(doc(db,'support_tickets',userId), { status:'CLOSED' }).catch(e=>alert(e.message));
    selectedTicket = null;
    $('chat').innerHTML = `<div class="chat-empty">Select a conversation</div>`;
  };
}

/** Add every default reply not already present (matched by title). Returns the
 *  number added. Used by the auto-seed and the "Add default replies" button. */
async function addMissingDefaults(){
  const snap = await getDocs(collection(db,'support_templates'));
  const have = new Set(); snap.forEach(d => have.add(String(d.data().title||'').trim()));
  let added = 0;
  for(let i=0;i<DEFAULT_TEMPLATES.length;i++){
    const tpl = DEFAULT_TEMPLATES[i];
    if(have.has(tpl.title.trim())) continue;
    await addDoc(collection(db,'support_templates'), { ...tpl, order:i, createdAt: Date.now() });
    added++;
  }
  return added;
}

async function seedTemplatesIfEmpty(){
  const snap = await getDocs(collection(db,'support_templates'));
  if(!snap.empty) return;
  await addMissingDefaults();
}

/** Templates panel. When [targetInputId] is set, "Insert" drops the text into
 *  that composer input; otherwise it copies to the clipboard. */
async function openTemplates(targetInputId){
  showModal(`
    <h2>Message templates</h2>
    <div class="msub">${targetInputId ? 'Insert into the current reply, or copy.' : 'Copy a reply, or manage your saved messages.'}</div>
    <div id="tpl-flash" class="mflash"></div>
    <div style="margin-bottom:10px"><button class="btn-sm" id="tpl-defaults" style="background:var(--petal);color:var(--deep)">${t('btn_addDefaultReplies')}</button></div>
    <div id="tpl-list"><div class="meta" style="color:var(--muted)">${t('lbl_templatesLoading')}</div></div>
    <div class="mgroup">
      <div class="mglabel">${t('lbl_newTemplate')}</div>
      <select id="tpl-cat" class="field">${TEMPLATE_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
      <input id="tpl-title" class="field" placeholder="Title (for your reference)" />
      <textarea id="tpl-body" class="field" placeholder="Message text (what gets sent)"></textarea>
      <button class="btn-sm" id="tpl-add" style="background:var(--rose)">${t('btn_addTemplate')}</button>
    </div>
    <button class="btn-sm mclose" id="tpl-close">${t('btn_close')}</button>`);
  $('tpl-close').onclick = hideModal;
  $('tpl-defaults').onclick = async (e) => {
    e.target.disabled = true;
    try{
      const n = await addMissingDefaults();
      $('tpl-flash').className='mflash ok';
      $('tpl-flash').textContent = n ? `Added ${n} default repl${n>1?'ies':'y'} ✓` : 'All defaults already present.';
      load();
    }catch(err){ $('tpl-flash').className='mflash bad'; $('tpl-flash').textContent=err.message; }
    finally{ e.target.disabled = false; }
  };

  const load = async () => {
    const snap = await getDocs(collection(db,'support_templates'));
    const tpls = []; snap.forEach(d=>tpls.push({ id:d.id, ...d.data() }));
    tpls.sort((a,b)=> (a.category||'').localeCompare(b.category||'') || (a.order||0)-(b.order||0));
    const list = $('tpl-list'); if(!list) return;
    if(!tpls.length){ list.innerHTML = `<div class="meta" style="color:var(--muted)">${t('hint_noTemplatesYet')}</div>`; return; }
    list.innerHTML = tpls.map(tp => `<div class="row" style="margin-bottom:8px" data-id="${esc(tp.id)}">
      <h3>${esc(tp.title||'')} <span class="pill info">${esc(tp.category||'')}</span></h3>
      <div class="meta" style="white-space:pre-wrap;color:var(--ink);margin-top:4px">${esc(tp.body||'')}</div>
      <div class="actions" style="margin-top:9px">
        <button class="btn-sm t-ins" style="background:var(--rose)">${targetInputId?'Insert':'Copy'}</button>
        <button class="btn-sm t-cpy" style="background:var(--petal);color:var(--deep)">${t('btn_copy')}</button>
        <button class="btn-sm t-del" style="background:var(--red)">${t('btn_deleteTemplate')}</button>
      </div></div>`).join('');
    const copy = (txt) => { try{ navigator.clipboard.writeText(txt); }catch(_){} $('tpl-flash').className='mflash ok'; $('tpl-flash').textContent='Copied ✓'; };
    list.querySelectorAll('.row').forEach(row => {
      const tp = tpls.find(x=>x.id===row.dataset.id);
      row.querySelector('.t-ins').onclick = () => {
        const inp = targetInputId ? $(targetInputId) : null;
        if(inp){ inp.value = (inp.value ? inp.value+'\n' : '') + tp.body; inp.focus(); hideModal(); }
        else copy(tp.body);
      };
      row.querySelector('.t-cpy').onclick = () => copy(tp.body);
      row.querySelector('.t-del').onclick = async () => {
        if(!confirm('Delete this template?')) return;
        try{ await deleteDoc(doc(db,'support_templates',tp.id)); load(); }
        catch(e){ $('tpl-flash').className='mflash bad'; $('tpl-flash').textContent=e.message; }
      };
    });
  };

  $('tpl-add').onclick = async (e) => {
    const title=$('tpl-title').value.trim(), body=$('tpl-body').value.trim(), category=$('tpl-cat').value;
    if(!title || !body){ $('tpl-flash').className='mflash bad'; $('tpl-flash').textContent='Title and message are required.'; return; }
    e.target.disabled=true;
    try{
      await addDoc(collection(db,'support_templates'), { category, title, body, order: Date.now(), createdAt: Date.now() });
      $('tpl-title').value=''; $('tpl-body').value='';
      $('tpl-flash').className='mflash ok'; $('tpl-flash').textContent='Added ✓'; load();
    }catch(err){ $('tpl-flash').className='mflash bad'; $('tpl-flash').textContent=err.message; }
    finally{ e.target.disabled=false; }
  };

  try{ await seedTemplatesIfEmpty(); }catch(_){}
  load();
}

// ── Users ──────────────────────────────────────────────────────────────────────
async function renderUsers(){
  try{
    // Newest 300 rather than the entire collection. The list is browsed and
    // searched by eye; an admin who needs an older account uses the phone/name
    // search, which is what the Manage flow is driven by anyway.
    const USER_PAGE = 300;
    const snap = await getDocs(query(collection(db,'users'), orderBy('createdAt','desc'), limit(USER_PAGE)));
    const users = []; snap.forEach(d => users.push({ id:d.id, ...d.data() }));
    // Say so when the list is capped. A console that silently shows a subset is
    // worse than one that shows fewer rows and admits it.
    const capped = users.length === USER_PAGE;
    $('view').innerHTML = `<div class="section-title">${t('hint_allUsersCount', users.length, capped?'+':'')}</div>` +
      (capped ? `<div class="meta" style="color:var(--warn-ink);margin-bottom:10px">
         ${t('hint_showingNewestAccounts', USER_PAGE)}</div>` : '') +
      `<input id="usearch" class="field" placeholder="${t('ph_searchNameOrPhone')}" style="max-width:340px;margin-bottom:16px" />
      <div id="uflash" class="mflash" style="margin-bottom:10px"></div>
      <div id="ulist"></div>`;
    // Through the audited callable, not a raw updateDoc. This wrote status
    // directly from the browser: nothing on the server reads that field, so the
    // badge turned red and the account went on booking and paying; the action
    // never reached admin_audit; and "unsuspend" wrote APPROVED, promoting any
    // provider who had been suspended while still awaiting review. The Manage
    // modal had always done this properly — this was the same button done twice.
    const setSuspended = async (uid, suspend) => {
      const u = users.find(x=>x.id===uid);
      const who = u ? (u.name||u.id) : uid;
      let reason = '';
      if (suspend) {
        reason = (prompt(t('prompt_suspendReason', who)) || '').trim();
        if (!reason) return;                       // cancelled, or no reason given
      } else if (!confirm(t('confirm_reinstate', who))) {
        return;
      }
      const payload = suspend ? { targetUid: uid, suspend: true, reason }
                              : { targetUid: uid, suspend: false };
      // callFn only shows okMsg when it has a flash element, and this list has
      // none — so the two translated confirmations were computed and discarded.
      if (await callFn('adminSetUserStatus', payload, null, 'uflash',
                       suspend ? t('ok_suspended') : t('ok_reinstated'))) {
        // Re-read rather than guess. adminSetUserStatus restores the status the
        // account had before it was suspended, which this cannot know: guessing
        // APPROVED/PENDING made a working, approved salon read as "pending
        // review" in the table until someone reloaded the tab.
        const fresh = await getDoc(doc(db,'users',uid)).catch(()=>null);
        if (u && fresh && fresh.exists()) Object.assign(u, fresh.data());
        else if (u) u.suspended = suspend;
        draw($('usearch').value);
      }
    };
    const draw = (term='') => {
      // Named q, not t: t is the translation function, and shadowing it here
      // turned every translated label below into "" is not a function.
      const q = term.trim().toLowerCase();
      const rows = users.filter(u => !q || (u.name||'').toLowerCase().includes(q) || (u.phone||'').includes(q));
      $('ulist').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th scope="col">${t('th_name')}</th><th scope="col">${t('th_role')}</th><th scope="col">${t('th_phone')}</th><th scope="col">${t('th_status')}</th><th scope="col">${t('th_kyc')}</th><th scope="col"></th></tr></thead>
        <tbody>` + rows.map(u => `<tr>
          <td class="name">${esc(u.name||u.id)}</td>
          <td><span class="pill info">${esc(u.role||'—')}</span></td>
          <td>${esc(u.phone||'—')}</td>
          <td>${statusPill(u.suspended===true ? 'SUSPENDED' : u.status)}</td>
          <td>${kycPill(u.kycStatus)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn-sm" style="background:var(--rose)" data-manage="${u.id}">${t('btn_manage')}</button>
            ${(u.suspended===true || u.status==='SUSPENDED')
              ? `<button class="btn-sm" style="background:var(--green);margin-inline-start:6px" data-uns="${u.id}">${t('btn_unsuspend')}</button>`
              : `<button class="btn-sm" style="background:var(--red);margin-inline-start:6px" data-sus="${u.id}">${t('btn_suspend')}</button>`}
          </td>
        </tr>`).join('') + `</tbody></table></div>`
        : `<div class="empty">${t('empty_noMatchingUsers')}</div>`;
      $('ulist').querySelectorAll('[data-sus]').forEach(b=>b.onclick=()=>setSuspended(b.dataset.sus,true));
      $('ulist').querySelectorAll('[data-uns]').forEach(b=>b.onclick=()=>setSuspended(b.dataset.uns,false));
      $('ulist').querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{
        const u = users.find(x=>x.id===b.dataset.manage); if(u) openUserModal(u, ()=>renderUsers());
      });
    };
    draw();
    $('usearch').oninput = e => draw(e.target.value);
  }catch(e){ $('view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/** The per-user "solve any problem" action panel: reset password, fix
 *  name/phone, grant/revoke admin, and (by role) adjust balance or grant credit.
 *  Each action calls its admin Cloud Function; [onChanged] refreshes the list. */
function openUserModal(u, onChanged){
  const isProvider = (u.role==='PROVIDER');
  const isAdminUser = (u.role==='ADMIN');
  const adminBtn = isAdminUser
    ? `<button class="btn-sm" id="m-revoke" style="background:var(--red)">${t('btn_removeAdmin')}</button>`
    : `<button class="btn-sm" id="m-grant" style="background:var(--gold)">${t('btn_makeAdmin')}</button>`;
  showModal(`
    <h2>${esc(u.name||u.id)}</h2>
    <div class="msub">${esc(u.role||'—')} · ${esc(u.phone||'—')}</div>
    <div id="m-flash" class="mflash"></div>

    <div class="mgroup">
      <div class="mglabel">${t('hint_resetPassword')}</div>
      <div class="mrow">
        <input id="m-pw" class="field" placeholder="New temporary password" />
        <button class="btn-sm" id="m-pwbtn" style="background:var(--rose)">${t('btn_reset')}</button>
      </div>
      <div class="meta" style="color:var(--muted);font-size:11px">${t('hint_tellUserThisPassword')}</div>
    </div>

    <div class="mgroup">
      <div class="mglabel">${t('hint_editProfile')}</div>
      <input id="m-name" class="field" value="${esc(u.name||'')}" placeholder="Name" />
      <div class="mrow">
        <input id="m-phone" class="field" value="${esc(u.phone||'')}" placeholder="Phone (+93…)" />
        <button class="btn-sm" id="m-savebtn" style="background:var(--rose)">${t('btn_save')}</button>
      </div>
    </div>

    ${isProvider ? `
    <div class="mgroup">
      <div class="mglabel">${t('hint_adjustSalonBalance')}</div>
      <input id="m-baldelta" class="field" type="number" placeholder="Amount (+ owed to them, − they owe)" />
      <div class="mrow">
        <input id="m-balreason" class="field" placeholder="Reason (optional)" />
        <button class="btn-sm" id="m-balbtn" style="background:var(--rose)">${t('btn_apply')}</button>
      </div>
    </div>` : `
    <div class="mgroup">
      <div class="mglabel">${t('hint_grantCredit')}</div>
      <input id="m-credamt" class="field" type="number" placeholder="Amount (+ add, − deduct)" />
      <div class="mrow">
        <input id="m-credreason" class="field" placeholder="Reason (optional)" />
        <button class="btn-sm" id="m-credbtn" style="background:var(--rose)">${t('btn_grant')}</button>
      </div>
    </div>`}

    <div class="mgroup">
      <div class="mglabel">${t('hint_adminAccess')}</div>
      ${adminBtn}
    </div>

    <div class="mgroup">
      <div class="mglabel">${t('hint_accountStanding')}</div>
      ${u.suspended
        ? `<div class="meta" style="color:var(--bad-ink);margin-bottom:9px">
             ${t('hint_suspendedExplain', u.suspendedReason ? esc(u.suspendedReason) : '')}
           </div>
           <button class="btn-sm" id="m-reinstate" style="background:var(--green)">${t('btn_reinstateAccount')}</button>`
        : `<div class="mrow">
             <input id="m-susreason" class="field" placeholder="Reason (kept on the record)" />
             <button class="btn-sm" id="m-suspend" style="background:var(--red)">${t('btn_suspendAccount')}</button>
           </div>`}
    </div>

    <div class="mgroup">
      <div class="mglabel">${t('hint_deleteAccount')}</div>
      <div class="meta" style="color:var(--muted);margin-bottom:9px">
        ${t('hint_deleteAccountRules')}
      </div>
      <div class="mrow">
        <input id="m-delreason" class="field" placeholder="Reason (kept on the record)" />
        <button class="btn-sm" id="m-delete" style="background:var(--red)">${t('btn_delete')}</button>

      <div class="mglabel">${t('hint_fullHistory')}</div>

    const reason = $('m-susreason').value.trim();

      // every provider dossier asked for bookings of salon "___none___".
      const { data } = await httpsCallable(fns,'adminUserDossier')({ targetUid:u.id });

      const list = (rows, body, empty) => rows.length
        ? `<div class="tbl-wrap"><table class="tbl"><tbody>${rows.map(body).join('')}</tbody></table></div>`
        : `<div class="meta" style="color:var(--muted)">${empty}</div>`;

        <div class="mglabel" style="margin-top:4px">${t('hint_bookingsCount', b.length)}</div>
        ${list(b, x => `<tr>
            <td class="name">${esc(x.bookingCode||x.id)}</td>
            <td>${esc(x.salonName||'—')}</td>
            <td><span class="pill ${STATUS_PILL[x.status]||'info'}">${esc(x.status||'')}</span></td>
            <td>${fmtDate(x.appointmentDate)}</td>
          </tr>`, 'No bookings')}
        <div class="mglabel" style="margin-top:12px">${t('hint_reviewsWrittenCount', r.length)}</div>
        ${list(r, x => `<tr><td>★ ${Number(x.rating||0)}</td><td>${esc(x.comment||'—')}</td></tr>`, 'None')}
        <div class="mglabel" style="margin-top:12px">${t('hint_reportedBySalonsCount', rep.length)}</div>
        ${list(rep, x => `<tr>
            <td>${x.noShow?`<span class="pill bad">${t('th_noShow')}</span>`:'★ '+Number(x.rating||0)}</td>
            <td>${esc(x.comment||'—')}</td><td>${fmtDate(x.createdAt)}</td>
          </tr>`, 'None — nothing has been reported about this account')}
        ${data.balance ? `<div class="mglabel" style="margin-top:12px">${t('hint_salonBalance')}</div>
          <div class="meta">${balanceLine(data.balance.owedAmount)}</div>` : ''}`;
    }catch(err){
      $('m-dossier-out').innerHTML = `<div class="meta" style="color:var(--bad-ink)">${esc(fnError(err))}</div>`;
    }finally{ btn.disabled = false; btn.textContent = lbl; }
  };

  $('m-pwbtn').onclick = async (e) => {
    const pw = $('m-pw').value.trim();
    if(pw.length < 4){ $('m-flash').className='mflash bad'; $('m-flash').textContent='Password must be at least 4 characters.'; return; }
    if(await callFn('adminResetPassword', { targetUid:u.id, newPassword:pw }, e.target, 'm-flash', 'Password reset ✓')) $('m-pw').value='';
  };
  $('m-savebtn').onclick = async (e) => {
    const payload = { targetUid:u.id };
    const name = $('m-name').value.trim(); const phone = $('m-phone').value.trim();
    if(name && name !== (u.name||'')) payload.name = name;
    if(phone && phone !== (u.phone||'')) payload.phone = phone;
    if(!payload.name && !payload.phone){ $('m-flash').className='mflash'; $('m-flash').textContent='No changes.'; return; }
    if(await callFn('adminUpdateUser', payload, e.target, 'm-flash', 'Saved ✓')) refresh();
  };
  if($('m-balbtn')) $('m-balbtn').onclick = async (e) => {
    const delta = parseInt($('m-baldelta').value,10);
    if(!delta){ $('m-flash').className='mflash bad'; $('m-flash').textContent='Enter a non-zero amount.'; return; }
    if(await callFn('adminAdjustProviderBalance', { providerId:u.id, delta, reason:$('m-balreason').value.trim() }, e.target, 'm-flash', 'Balance updated ✓')){ $('m-baldelta').value=''; }
  };
  if($('m-credbtn')) $('m-credbtn').onclick = async (e) => {
    const amount = parseInt($('m-credamt').value,10);

    if(await callFn('adminGrantCredit', { customerId:u.id, amount, reason:$('m-credreason').value.trim() }, e.target, 'm-flash', 'Credit granted ✓')){ $('m-credamt').value=''; }
  };
  if($('m-grant')) $('m-grant').onclick = async (e) => {
    if(!confirm('Give this user full admin access?')) return;
    if(await callFn('grantAdmin', { targetUid:u.id }, e.target, 'm-flash', 'Now an admin ✓')) refresh();
  };
  if($('m-revoke')) $('m-revoke').onclick = async (e) => {
    if(!confirm('Remove admin access from this user?')) return;
    if(await callFn('revokeAdmin', { targetUid:u.id }, e.target, 'm-flash', 'Admin access removed ✓')) refresh();
  };
}

/** Fetch just the user docs whose ids are in [ids], keyed by id. Firestore caps
 *  an `in` filter at 30 values, so this chunks. Used instead of downloading the
 *  whole users collection to resolve a handful of owner names. */
async function fetchUsersByIds(ids){
  const unique = [...new Set(ids.filter(Boolean))];
  const out = {};
  for(let i=0;i<unique.length;i+=30){
    const chunk = unique.slice(i,i+30);
    const snap = await getDocs(query(collection(db,'users'), where(documentId(),'in',chunk)));
    snap.forEach(d => out[d.id] = { id:d.id, ...d.data() });
  }
  return out;
}
